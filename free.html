<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>グラビティ・ポップ フリー</title>
<style>
  :root{
    --bg:#0e1116; --panel:#171b23; --line:#262c38; --text:#e8ecf3; --dim:#8a93a6; --accent:#ffcf5a;
    --side: clamp(170px, 20vw, 240px);                     /* 左右の列幅 */
    --b: clamp(46px, min(calc((var(--side) - 28px)/3.25), calc(13dvh)), 84px);   /* 操作ボタンの大きさ */
    --s: min(calc(100dvh - 20px), calc(100vw - 2*var(--side) - 44px));          /* 盤面の一辺 */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden;touch-action:none;overscroll-behavior:none}
  body{
    display:grid; place-content:center; gap:0 12px;
    padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));
    grid-template-columns: var(--side) var(--s) var(--side);
    grid-template-rows: auto 1fr;
    height:100dvh;
    grid-template-areas: "hudL stage hudR" "ctrlL stage ctrlR";
    background: radial-gradient(120% 80% at 50% 40%, #151a24 0%, var(--bg) 70%);
  }
  #hudL{grid-area:hudL;justify-self:start;align-self:start}
  #hudR{grid-area:hudR;justify-self:end;align-self:start;display:flex;gap:10px;align-items:center}
  #stage{grid-area:stage;width:var(--s);height:var(--s);position:relative;align-self:center}
  #ctrlL{grid-area:ctrlL;justify-self:center;align-self:end;margin-bottom:6px}
  #ctrlR{grid-area:ctrlR;justify-self:center;align-self:end;margin-bottom:6px}
  #turnHint{display:none}
  @media (orientation:portrait){
    body>*:not(#turnHint):not(#overlay){display:none!important}
    #turnHint{display:flex;position:fixed;inset:0;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--dim);font-size:17px;z-index:20}
    #turnHint svg{animation:turn 2.2s ease-in-out infinite}
    @keyframes turn{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
  }
  #stage,#board{touch-action:none}
  #board{width:100%;height:100%;display:block;border-radius:14px;box-shadow:0 0 0 1px #232a37,0 18px 40px rgba(0,0,0,.45)}

  /* HUD */
  .stat{display:flex;align-items:baseline;gap:8px}
  .stat .label{font-size:11px;letter-spacing:.16em;color:var(--dim)}
  #score{font-size:clamp(26px,4.2vmin,40px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  #lines{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
  #status{font-size:10.5px;color:var(--dim);margin-top:6px}
  .nextbox{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:12px;padding:6px 8px 4px;text-align:center}
  .nextbox .label{font-size:10px;letter-spacing:.16em;color:var(--dim)}
  #next{width:56px;height:56px;display:block}
  .iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;padding:0;
    background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--dim)}
  .iconbtn svg{width:18px;height:18px}

  /* アイテム */
  .item{position:relative;width:48px;height:48px;border-radius:14px;padding:0;display:grid;place-items:center;
    background:linear-gradient(180deg,#24405e,#182a40);border:1px solid #2f5a85;color:#bfe3ff;
    box-shadow:0 3px 0 #0a121c, inset 0 1px 0 rgba(255,255,255,.12);touch-action:none}
  .item#itemJump{background:linear-gradient(180deg,#1f4a33,#143022);border-color:#3f9a6a;color:#d4ffe6}
  .item#itemShuf{background:linear-gradient(180deg,#4a2b5e,#2f1b40);border-color:#7a4a99;color:#f0d6ff}
  .item#itemMag{background:linear-gradient(180deg,#5e2b34,#401b22);border-color:#b04a5c;color:#ffd6dc}
  .item.active{box-shadow:0 0 0 3px #ffcf5a, 0 3px 0 #0a121c}
  .item svg{width:26px;height:26px}
  .item.down{transform:translateY(2px);box-shadow:0 1px 0 #0a121c}
  .item.empty{opacity:.35;filter:grayscale(.6)}
  .item.empty.active{opacity:1;filter:none}
  .item.active{box-shadow:0 0 0 2px #7fd0ff, 0 0 14px rgba(127,208,255,.7)}
  .badge{position:absolute;right:-6px;top:-6px;min-width:20px;height:20px;border-radius:10px;padding:0 5px;
    background:#ffcf5a;color:#2a1f05;font-size:12px;font-weight:800;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.4)}
  /* 操作ボタン */
  .pad3{display:flex;gap:calc(var(--b)*0.12);align-items:flex-end}
  .pad3 .bw:nth-child(2){margin-bottom:calc(var(--b)*0.42)}          /* 真ん中の「落とす」は少し上 */
  /* 右: 回転ボタンのまわりにアイテム（右手の親指から届く左上側に並べる） */
  .rotring{--ib:max(calc(var(--b)*0.7),40px);--rr:calc(var(--ib)*2.4);position:relative;
    width:calc(var(--b)*0.7 + var(--ib)*0.5 + var(--rr));height:calc(var(--b)*0.7 + var(--ib)*0.5 + var(--rr))}
  .rotring #rotBtn{position:absolute;right:calc(var(--b)*0.12);bottom:calc(var(--b)*0.12)}
  .rotring .item{position:absolute;width:var(--ib);height:var(--ib);border-radius:32%}
  .rotring .item svg{width:52%;height:52%}
  /* 回転ボタンの中心から同じ距離の円弧（左・左上・上寄り・上） */
  .rotring #itemStop{right:calc(var(--b)*0.7 - var(--ib)*0.5 + var(--rr));bottom:calc(var(--b)*0.7 - var(--ib)*0.5)}
  .rotring #itemMag{right:calc(var(--b)*0.7 - var(--ib)*0.5 + var(--rr)*0.866);bottom:calc(var(--b)*0.7 - var(--ib)*0.5 + var(--rr)*0.5)}
  .rotring #itemShuf{right:calc(var(--b)*0.7 - var(--ib)*0.5 + var(--rr)*0.5);bottom:calc(var(--b)*0.7 - var(--ib)*0.5 + var(--rr)*0.866)}
  .rotring #itemJump{right:calc(var(--b)*0.7 - var(--ib)*0.5);bottom:calc(var(--b)*0.7 - var(--ib)*0.5 + var(--rr))}
  .pad3 .cap{display:none}
  .bw{display:flex;flex-direction:column;align-items:center;gap:9px}
  .cap{font-size:10.5px;letter-spacing:.2em;color:#5d6577}
  button{font:inherit;color:var(--text);cursor:pointer}
  .pbtn{
    width:var(--b);height:var(--b);border-radius:50%;padding:0;display:grid;place-items:center;
    color:#dfe5f1;
    background:linear-gradient(180deg,#2b3244 0%,#1c212d 100%);
    border:1px solid #3a4359;
    box-shadow:0 5px 0 #0a0c11, 0 10px 18px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.09);
    transition:transform .06s, box-shadow .06s, filter .06s;
    touch-action:none;
  }
  .pbtn.down{transform:translateY(4px);box-shadow:0 1px 0 #0a0c11, 0 3px 8px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);filter:brightness(1.15)}
  .pbtn svg{width:44%;height:44%;overflow:visible}
  .pbtn .icon{transition:transform .25s cubic-bezier(.3,1.5,.5,1);transform-origin:50% 50%}
  .pbtn.rot{width:calc(var(--b)*1.16);height:calc(var(--b)*1.16);
    background:linear-gradient(180deg,#43357a 0%,#2b2252 100%);border-color:#6150a6;color:#eee9ff;
    box-shadow:0 5px 0 #150f2c, 0 10px 18px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.14)}
  .pbtn.rot.down{box-shadow:0 1px 0 #150f2c, 0 3px 8px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.1)}
  .pbtn.drop{background:linear-gradient(180deg,#ffd978 0%,#e8ad33 100%);border-color:#ffe29a;color:#2a1f05;
    box-shadow:0 5px 0 #6b4c0c, 0 10px 18px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.45)}
  .pbtn.drop.down{box-shadow:0 1px 0 #6b4c0c, 0 3px 8px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.35)}

  #overlay{position:fixed;inset:0;background:rgba(8,10,14,.86);display:flex;z-index:10;padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
  #overlay .sheet{margin:auto}
  @media (max-height:500px){ .sheet{padding:16px} .sheet h1{font-size:22px} ul.help{font-size:12px;line-height:1.6;margin:6px 0} .sheet p{font-size:13px;margin:4px 0} }
  #overlay.hidden{display:none}
  .sheet{max-width:460px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;text-align:center}
  .sheet h1{margin:0 0 4px;font-size:28px}
  .sheet p{color:var(--dim);font-size:14px;line-height:1.7;margin:8px 0}
  .sheet button{background:#232937;border:1px solid #333b4d;border-radius:10px;padding:8px 12px}
  .sheet .big{font-size:18px;padding:12px 28px;background:var(--accent);color:#1a1a1a;border:none;font-weight:700;margin-top:12px}
  .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
  .row button{font-size:13px}
  .warn{color:#ff9f7a!important}
  .sheet.wide{max-width:min(760px,96vw)}
  .rec-list{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;margin:10px auto;max-width:440px;text-align:left;font-size:14px}
  .rec-row{display:flex;justify-content:space-between;border-bottom:1px solid #2c3446;padding:3px 0;color:var(--dim)}
  .rec-row b{color:var(--text)}
  i.new{font-style:normal;color:#ff6b9a;font-weight:900;font-size:12px}
  .xbtn{background:#000!important;color:#fff!important;border:1px solid #555!important}
  .zk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:12px 0;text-align:left}
  .zk{display:flex;gap:10px;align-items:flex-start;background:#1a1f2b;border:1px solid #2c3446;border-radius:12px;padding:10px}
  .zk canvas{flex:none;width:76px;height:76px;border-radius:10px;background:radial-gradient(circle at 50% 40%,#232a3a,#141822)}
  .zk h3{margin:0 0 2px;font-size:15px;color:var(--text)}
  .zk .no{font-size:11px;color:#ffcf5a;letter-spacing:.05em}
  .zk p{margin:3px 0 0;font-size:12px;line-height:1.55;color:var(--dim);text-align:left}
  .zk .flv{color:#c9b8ff}
  .zk.lock h3{color:#6b7385}
  .zk-count{font-size:14px;color:var(--dim)}
  ul.help{text-align:left;font-size:13px;color:var(--dim);line-height:1.8;padding-left:20px;margin:10px 0}
</style>
</head>
<body>

<div id="hudL">
  <div class="stat"><span class="label">SCORE</span></div>
  <div id="score">0</div>
  <div class="stat" style="margin-top:4px"><span class="label">最大連鎖</span><span id="lines">0</span><span class="label" style="margin-left:10px">ステージ</span><span id="stageN">1</span></div>
  <div id="status">傾きセンサー: なし</div>
</div>

<div id="hudR">
  <div class="nextbox"><div class="label">NEXT</div><canvas id="next"></canvas></div>
  <button id="pauseBtn" class="iconbtn" aria-label="ポーズ"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></svg></button>
</div>

<div id="stage"><canvas id="board"></canvas></div>

<div id="ctrlL" class="pad3">
  <div class="bw"><button id="mvA" class="pbtn" aria-label="移動"><svg viewBox="0 0 24 24"><g class="icon"><path d="M5 12h13M12.5 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></g></svg></button><span class="cap">移動</span></div>
  <div class="bw"><button id="dropBtn" class="pbtn drop" aria-label="落とす"><svg viewBox="0 0 24 24"><g class="icon"><path d="M3.5 12h11M9.5 6.5l5.5 5.5-5.5 5.5M20 5v14" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></g></svg></button><span class="cap">落とす</span></div>
  <div class="bw"><button id="mvB" class="pbtn" aria-label="移動"><svg viewBox="0 0 24 24"><g class="icon"><path d="M5 12h13M12.5 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></g></svg></button><span class="cap">移動</span></div>
</div>

<div id="ctrlR" class="rotring">
  <button id="rotBtn" class="pbtn rot" aria-label="回転"><svg viewBox="0 0 24 24"><path d="M19.2 13.2A7.3 7.3 0 1 1 17 6.9" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M18.6 3.2v4.6H14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button id="itemStop" class="item" aria-label="ストップ"><svg viewBox="0 0 24 24"><path d="M7 3h10M7 21h10M8 3c0 5 8 5 8 9s-8 4-8 9M16 3c0 5-8 5-8 9s8 4 8 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="badge" id="nStop">1</span></button>
  <button id="itemMag" class="item" aria-label="マグネット"><svg viewBox="0 0 24 24"><path d="M6 4v8a6 6 0 0 0 12 0V4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M4 4h4M16 4h4M4 8h4M16 8h4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span class="badge" id="nMag">1</span></button>
  <button id="itemShuf" class="item" aria-label="シャッフル"><svg viewBox="0 0 24 24"><path d="M12 12c0-1.2 1.6-1.6 2.3-.7 1 1.3-.2 3.4-2.3 3.4-2.6 0-4-2.8-3-5 1.3-2.8 5.2-3.4 7.5-1.4 2.7 2.3 2.4 6.9-.6 8.9-3.6 2.4-8.9 1.1-10.6-2.9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="badge" id="nShuf">1</span></button>
  <button id="itemJump" class="item" aria-label="ジャンプ"><svg viewBox="0 0 24 24"><path d="M4 21h16M8 15l4-4 4 4M8 9l4-4 4 4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="badge" id="nJump">1</span></button>
</div>

<div id="turnHint"><svg viewBox="0 0 64 64" width="72" height="72"><rect x="20" y="8" width="24" height="44" rx="5" fill="none" stroke="currentColor" stroke-width="3"/><path d="M50 44a20 20 0 0 1-14 12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M38 52l-3 4 5 1" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><div>横向きにして遊んでね</div></div>

<div id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<script>
"use strict";
// ===== 設定 =====
const N = 13;                 // 盤面サイズ（奇数で中心が1マスに決まる）
const SLIDE_MS = 42;          // 粒が1マス流れる間隔
const LOCK_DELAY = 150;       // 接地してから固定されるまで
const POP_MS = 420;           // 消える演出の長さ
if(!CanvasRenderingContext2D.prototype.roundRect) CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h){ this.rect(x,y,w,h); };   // 古い iOS 用
// 連鎖を起こしやすくする仕組み
const SLIP_MS = 1100;         // 消えた場所のまわりの粒が滑りやすくなる長さ
// 連鎖の受付時間: 消え終わってからこの時間内に次が消えたら連鎖。連鎖が続くほど長くなる
function chainWin(n){ return Math.min(4500, 2000 + (n-1)*500); }
const TILT_MIN = 2.2;         // m/s^2 これ未満の傾きは無視（ほぼ水平）
const TILT_SNAP = 32;         // 新しい方向の軸から何度以内で切替えるか
const TILT_HOLD = 120;        // 切替えに必要な安定時間 ms

const DIRS = [[0,1],[-1,0],[0,-1],[1,0]];   // 0:下 1:左 2:上 3:右（盤面座標, y下向き）
const PALETTE = [
  {base:"#ff4d6d", hi:"#ffc2cf", dark:"#9e1030"},   // 赤
  {base:"#2fa8ff", hi:"#c2e6ff", dark:"#0a559e"},   // 青
  {base:"#3ddc84", hi:"#c4f7da", dark:"#0f8444"},   // 緑
  {base:"#ffc93c", hi:"#fff2c0", dark:"#a87400"},   // 黄
  {base:"#b06bff", hi:"#e6d1ff", dark:"#5f1fb3"},   // 紫
  {base:"#9aa3b2", hi:"#e6e9ef", dark:"#4b5260"},   // 5: お邪魔（灰色）
  {base:"#f4f0ff", hi:"#ffffff", dark:"#b9b0d8"},   // 6: 虹（どの色ともつながる）
];
const RAINBOW = 6;
const GARBAGE = 5;   // お邪魔ぷに: くっつくけど、何個つながっても消えない。となりで消えた粒があると巻き込まれて消える
const CHAIN_POWER = [0,1,4,8,16,32,64,96,128,160,192,224,256,288,320,352];

// ===== 保存 =====
const store = {
  get(k,d){ try{ const v = localStorage.getItem("gp_"+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem("gp_"+k, JSON.stringify(v)); }catch(e){} }
};
let sensorOffset = store.get("sensorOffset",0);   // センサー向き補正（90°単位）
let soundOn = store.get("sound",true);
let faceOn = store.get("face",true);
// ===== 物理: 斜面と摩擦 =====
// 盤面を「傾いた板」、粒を板の上の物体とみなす。
//   斜面方向の加速度 a = g・(sinθ − μk・cosθ)   （動き出す条件: sinθ > μs・cosθ ⇔ tanθ > μs）
//   θ: 盤面（画面）が水平から傾いた角度。sinθ は重力の「画面に沿った成分」、cosθ は「画面に垂直な成分」。
const G = 9.81;
const FRICTION = {
  ice:    {name:"つるつる（氷）", s:0.10, k:0.05},
  normal: {name:"ふつう",        s:0.30, k:0.20},
  rough:  {name:"ざらざら",      s:0.55, k:0.40},
};
const SCALES = [0.05, 0.10, 0.20];                 // 1マスの大きさ[m]。大きいほど（マス単位では）ゆっくり
let frictionKey = store.get("friction","normal"); if(!FRICTION[frictionKey]) frictionKey="normal";
let cellM = store.get("cellM",0.10); if(!SCALES.includes(cellM)) cellM=0.10;
// 重力の向きの単位ベクトル（画面座標: x右, y下, z画面に垂直）。センサーがないときは「下に35°傾けた」ことにする
const NO_SENSOR = {x:0, y:Math.sin(35*Math.PI/180), z:Math.cos(35*Math.PI/180)};
let gN = {...NO_SENSOR};
let tiltDeg = 35, tiltK = 1, physActive = false;
function slope(){
  const f=FRICTION[frictionKey];
  const sin = Math.hypot(gN.x, gN.y);              // 盤面に沿った重力の成分（= sinθ）。向きは自由
  const cos = Math.abs(gN.z);                      // 盤面に垂直な成分（= cosθ）→ 摩擦力の元になる垂直抗力
  const gc = G / cellM;                            // g を「マス/秒²」に換算
  return { sin, cos, f, gc, canStart: sin > f.s*cos, aK: gc*(sin - f.k*cos), aMS: G*(sin - f.k*cos) };
}
// 難易度: 出現してから落ち始めるまでの「ふわっと待つ時間」と、落ちてくる組の最高速度（空気抵抗による終端速度）
const LEVELS = {
  easy:   {name:"やさしい",   hover:500, vmax:10, vmin:7,  every:1400},
  normal: {name:"ふつう",     hover:220, vmax:15, vmin:12,  every:1000},
  hard:   {name:"むずかしい", hover:80,  vmax:18, vmin:15,  every:750},
};
let levelKey = store.get("level","normal"); if(!LEVELS[levelKey]) levelKey="normal";
let best = store.get("bestFree",0);
// ===== 記録（その場でほめる＋ゲームオーバーでまとめる） =====
const REC_DEFS = [   // key, 表示名, 単位
  ["maxChain","最大連鎖","連鎖"], ["stage","到達ステージ",""], ["maxPop","一度に消した数","個"],
  ["allClear","全消し","回"], ["comeback","大逆転","回"], ["niceTilt","ナイス傾き連鎖","回"],
  ["lastSec","ギリギリセーフ","回"], ["multi","3色以上の同時消し","回"], ["bigBomb","大爆発","回"],
  ["garbage","お邪魔一掃","回"], ["upside","さかさま消し","回"],
];

    const bk=new Map();
    for(let i=0;i<balls.length;i++){ const o=balls[i], k=bucketKey(o.x,o.y); let a=bk.get(k); if(!a){a=[];bk.set(k,a);} a.push(i); }
    const cts=[];
    for(let i=0;i<balls.length;i++){
      const o=balls[i], fx=Math.floor(o.x), fy=Math.floor(o.y);
      for(let yy=fy-1;yy<=fy+1;yy++) for(let xx=fx-1;xx<=fx+1;xx++){
        const a=bk.get((yy+2)*64+(xx+2)); if(!a) continue;
        for(const j of a){ if(j<=i) continue;
          const p=balls[j], dx=p.x-o.x, dy=p.y-o.y, d2=dx*dx+dy*dy;
          if(d2 < (2*R+0.02)*(2*R+0.02) && d2>1e-9){ const d=Math.sqrt(d2); cts.push([o,p,dx/d,dy/d,d]); }
        }

    }
    // 粒がどれだけ「動かない」か（消える途中の粒と、浮いている組は動かない壁あつかい）
    const inv=o=> (o.pop || (o.live&&hovering)) ? 0 : ((o.heavy&&!o.live) ? 0.2 : 1);   // 重りは5倍の重さ
    // 3) 速度の拘束: 近づく向きの速度を消す（壁・粒・組のつなぎ棒）
    // 下（重力の先）にある粒から順に処理すると、積み重なりが早く落ち着く
    const depth=o=>o.x*gN.x+o.y*gN.y;
    cts.sort((c1,c2)=>Math.max(depth(c2[0]),depth(c2[1]))-Math.max(depth(c1[0]),depth(c1[1])));
    const IT=10;
    for(let it=0;it<IT;it++){
      const shock = it>=IT-2;                                          // 最後の2回は「下の粒は動かない」とみなして上へ伝える
      for(const o of balls){
        if(!inv(o)) continue;
        if(o.x<=R+0.001 && o.vx<0){ if(o.vx<-1) land(o,Math.min(1.3,0.25-o.vx/22)); o.vx*=-E_REST; }
        if(o.x>=N-R-0.001 && o.vx>0){ if(o.vx>1) land(o,Math.min(1.3,0.25+o.vx/22)); o.vx*=-E_REST; }
        if(o.y<=R+0.001 && o.vy<0){ if(o.vy<-1) land(o,Math.min(1.3,0.25-o.vy/22)); o.vy*=-E_REST; }
        if(o.y>=N-R-0.001 && o.vy>0){ if(o.vy>1) land(o,Math.min(1.3,0.25+o.vy/22)); o.vy*=-E_REST; }
      }
      for(const [o,p,nx,ny,d] of cts){
        if(d>2*R+0.005) continue;
        let wa=inv(o), wb=inv(p); if(!wa&&!wb) continue;
        if(piece && o.live && p.live) continue;                       // 組の2個どうしは下のつなぎ棒で扱う
        if(shock && wa && wb){ if(depth(p)>depth(o)) wb=0; else wa=0; }
        const rv=(p.vx-o.vx)*nx+(p.vy-o.vy)*ny;
        if(rv>=0) continue;
        const j=-(1+E_REST)*rv/(wa+wb);
        o.vx-=j*nx*wa; o.vy-=j*ny*wa; p.vx+=j*nx*wb; p.vy+=j*ny*wb;
        if(it===0 && j>1){ land(o,Math.min(1.3,0.25+j/22)); land(p,Math.min(1.3,0.25+j/22)); }
      }
      for(const [a,b] of bonds){                                       // くっついた粒どうしの棒（距離を変える速度を消す）
        const wa=inv(a), wb=inv(b); if(!wa&&!wb) continue;
        const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1, nx=dx/d, ny=dy/d;
        const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny; if(rv===0) continue;
        if(rv<0 && d<=2*R+0.005) continue;                               // 押し合う向きは上の接触で処理済み
        const j=-rv/(wa+wb);
        a.vx-=j*nx*wa; a.vy-=j*ny*wa; b.vx+=j*nx*wb; b.vy+=j*ny*wb;
      }
      if(piece && !hovering) for(const [a,b] of piece.links){          // 組は全部の粒が棒でつながった1つのかたまり
        const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1, nx=dx/d, ny=dy/d;
        const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny, j=-rv/2;
        a.vx-=j*nx; a.vy-=j*ny; b.vx+=j*nx; b.vy+=j*ny;
      }
    }
    // 4) 盤面の摩擦（速度と逆向きに μk・g・cosθ）と、落ちてくる組の最高速度
    const fr=gc*f.k*cos*h;
    for(const o of balls){
      const sp=Math.hypot(o.vx,o.vy); if(sp===0) continue;
      const fo = o.live ? fr : fr*(o.frozen ? 0 : (o.heavy ? 3 : 1))*((o.slip>0 || magLeft>0) ? 0.15 : 1);
      let k = sp<=fo ? 0 : (sp-fo)/sp;
      if(o.live && sp*k>vmax) k=vmax/sp;
      o.vx*=k; o.vy*=k;
    }
    // 5) 位置を進めて、重なりを押し戻す
    for(const o of balls){ if(!inv(o)) continue; o.x+=o.vx*h; o.y+=o.vy*h; }
    for(let it=0;it<3;it++){
      for(const [o,p] of cts){
        const wa=inv(o), wb=inv(p); if(!wa&&!wb) continue;
        const dx=p.x-o.x, dy=p.y-o.y, d=Math.hypot(dx,dy);
        const pen=2*R-d; if(pen<=0||d<1e-9) continue;
        const k=pen*0.8/(wa+wb), nx=dx/d, ny=dy/d;
        o.x-=nx*k*wa; o.y-=ny*k*wa; p.x+=nx*k*wb; p.y+=ny*k*wb;
      }
      for(const [a,b] of bonds){ const wa=inv(a), wb=inv(b); if(!wa&&!wb) continue;
        const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1, e=d-2*R; if(e<=0) continue;
        const k=e*0.8/(wa+wb); a.x+=dx/d*k*wa; a.y+=dy/d*k*wa; b.x-=dx/d*k*wb; b.y-=dy/d*k*wb; }
      if(piece && !hovering) for(const [a,b,L] of piece.links){ const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1, e=(d-L)/2; a.x+=dx/d*e; a.y+=dy/d*e; b.x-=dx/d*e; b.y-=dy/d*e; }
      for(const o of balls){ if(!inv(o)) continue; o.x=Math.min(N-R,Math.max(R,o.x)); o.y=Math.min(N-R,Math.max(R,o.y)); }
    }
  }
  for(const o of balls){
    if(o.live) continue;
    const sp=Math.hypot(o.vx,o.vy); if(sp>maxSp) maxSp=sp;
    if(sp>0.3) o.w=Math.min(o.w||0,-Math.min(0.14,sp/180));
  }

}
// 組が何かに乗って止まったら手放す
function pieceStep(dt){
  if(piece.drop){ dropStep(dt); return; }
  if(piece.hover>0){ piece.hover=Math.max(0,piece.hover-dt); lockTimer=0; return; }
  const sp=Math.max(...piece.balls.map(o=>Math.hypot(o.vx,o.vy)));
  const touch = piece.balls.some(o=> o.x<=R+0.03||o.y<=R+0.03||o.x>=N-R-0.03||o.y>=N-R-0.03 ||
    balls.some(p=>!p.live && Math.hypot(p.x-o.x,p.y-o.y)<2*R+0.04));
  // 何かに乗ったら、止まっていれば LOCK_DELAY、すべり続けていても少し待って手放す（テンポのため）
  if(touch){ lockTimer+=dt; if(lockTimer>=(sp<0.6?LOCK_DELAY:LOCK_DELAY*2.5)) release(0.6); }
  else lockTimer=0;
}
function land(o,str){ o.wv=(o.wv||0)+0.0095*str; }
function jiggleAll(v){ for(const o of balls) o.wv=(o.wv||0)+v*(0.7+Math.random()*0.6); }
// 同じ色が4つ以上くっついたら消す（くっつき = 中心の距離が TOUCH 以内）
function findPops(now){
  const list=balls.filter(o=>!o.live&&!o.pop);
  let pops=[], bombs=[]; let bonus=0, colorSet=new Set();
  const seen=new Set(), lv0=level;
  for(const s0 of list){
    if(seen.has(s0) || s0.frozen || s0.c===GARBAGE || s0.c===RAINBOW) continue;
    const c=s0.c, g=[s0], inG=new Set([s0]), st=[s0]; seen.add(s0);
    while(st.length){                                           // 同じ色と虹をたどる（氷はつながらない）
      const o=st.pop();
      for(const p of list){
        if(inG.has(p) || p.frozen || !(p.c===c || p.c===RAINBOW)) continue;
        if(Math.hypot(p.x-o.x,p.y-o.y)<=TOUCH){ inG.add(p); g.push(p); st.push(p); if(p.c===c) seen.add(p); }
      }
    }
    const bm=g.filter(o=>o.bomb);
    if(bm.length && g.length===3){ pops.push(...g); bombs.push(...bm); colorSet.add(c); }
    else if(g.length>=4){ bombs.push(...bm); pops.push(...g); bonus+=Math.min(10,g.length-4)*2; colorSet.add(c); }
  }
  pops=[...new Set(pops)];
  if(!pops.length) return false;
  // 爆弾: まわり（半径2.6個ぶん）を色に関係なく全部消して、その外側を吹き飛ばす
  for(const b of bombs){
    for(const o of list) if(!pops.includes(o) && Math.hypot(o.x-b.x,o.y-b.y)<=2.6*2*R) pops.push(o);
    for(const o of balls){ if(o.live||pops.includes(o)) continue;
      const dx=o.x-b.x, dy=o.y-b.y, d=Math.hypot(dx,dy)||1;
      if(d<4.5*2*R){ const v=(4.5*2*R-d)*4; o.vx+=dx/d*v; o.vy+=dy/d*v; o.wv=(o.wv||0)-0.01; } }
    for(let i=0;i<4;i++) burst(b.x-0.5,b.y-0.5,i%colorsN);
    bombFx={x:b.x,y:b.y,t:now};
  }
  if(bombs.length){ sfx("bomb"); }
  chain = cascade ? chain+1 : 1; cascade=true; maxChain=Math.max(maxChain,chain);
  chainUntil=Infinity;                                         // 消え終わるまで連鎖の受付は続く
  const power = CHAIN_POWER[Math.min(chain,CHAIN_POWER.length-1)];
  const colorBonus=[0,0,3,6,12,24][colorSet.size]||0;
  let gain = pops.length*10*Math.max(1, power + bonus + colorBonus);
  // 傾けて作った連鎖: 前に消えたときから重力の向きを20°以上変えていたらボーナス
  const gu=gDir(); let tiltNice=false;
  if(chain>=2 && lastPopG && gu && (gu[0]*lastPopG[0]+gu[1]*lastPopG[1]) < Math.cos(20*Math.PI/180)){ tiltNice=true; gain=Math.round(gain*1.5); }
  if(gu) lastPopG=gu;
  score += gain;
  popped += pops.length; level = 1+Math.floor(popped/40); colorsN = level>=5 ? 5 : 4;
  // となりで消えた粒があるお邪魔は巻き込まれて消える（くっついたお邪魔のかたまりごとではなく、触れている粒だけ）
  const gb=list.filter(o=>o.c===GARBAGE && !pops.includes(o) && pops.some(p=>Math.hypot(p.x-o.x,p.y-o.y)<=TOUCH));
  pops.push(...gb); score += gb.length*20;
  // 氷: となりで消えた粒があると溶けて、ふつうの粒になる
  for(const o of list) if(o.frozen && !pops.includes(o) && pops.some(p=>Math.hypot(p.x-o.x,p.y-o.y)<=2*R*1.3)){ o.frozen=false; o.wv=(o.wv||0)+0.01; burst(o.x-0.5,o.y-0.5,1); }
  // ---- 記録 ----
  const total=pops.length;
  rec.maxPop=Math.max(rec.maxPop,total);

  else if(total>=10) praise("大量消し！", `${total}個いっぺんに`);
  if(colorSet.size>=3){ rec.multi++; praise(`${colorSet.size}色同時消し！`, "", "#9dffb0"); }
  if(bombs.length && total>=12){ rec.bigBomb++; praise("大爆発！", `${total}個を巻き込んだ`, "#ff8a5a"); }
  if(gb.length>=5){ rec.garbage++; praise("お邪魔一掃！", `${gb.length}個まとめて`, "#cfd6e4"); }
  if(pops.some(o=>o.timer!=null && o.timer<=3000)){ rec.lastSec++; praise("ギリギリセーフ！", "時限ぷにを残り3秒で", "#ffe066"); }
  if(gu && gu[1]<-0.7){ rec.upside++; praise("さかさま消し！", "重力が上向きのまま", "#8fe3ff"); }
  if(tiltNice) rec.niceTilt++;
  rec.maxChain=Math.max(rec.maxChain,chain);
  if(level>lv0){                                               // ステージアップ
    const nw=SPECIALS.filter(a=>a.st===level);
    stageFx={n:level, t:now, text: (!devAll && nw.length) ? "NEW "+nw.map(a=>a.name).join("・") : ""};
  }
  popping=pops; popT=now;
  for(const o of pops){ o.pop=true; o.vx=o.vy=0; burst(o.x-0.5,o.y-0.5,o.c); }
  for(const o of balls) if(!o.pop && pops.some(p=>Math.hypot(p.x-o.x,p.y-o.y)<2*R*1.3)) o.wv=(o.wv||0)+0.006;
  if(chain>=2) chainFx={n:chain, t:now, nice:tiltNice};
  if(chain===3) grantItem(now);
  while(popped>=nextItemAt){ nextItemAt+=50; grantItem(now); }
  shake = Math.min(18, 2 + chain*2.5 + (bombs.length?8:0));
  sfx("pop", chain);
  updateHud();
  return true;
}
function burst(x,y,c){
  for(let i=0;i<7;i++){
    const a=Math.random()*Math.PI*2, v=0.004+Math.random()*0.006;
    particles.push({x:x+0.5, y:y+0.5, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:1, c, r:0.12+Math.random()*0.12});

}

// ===== アイテム =====

// ジャンプ: 床（重力の向きの辺）から突き上げて、全部の粒を跳ね上げる。落ちてくるときに少し混ざる
function useJump(){
  if(!running||paused||over||items.jump<=0||shuffle||popping) return;
  const list=balls.filter(o=>!o.live);
  if(!list.length) return;
  items.jump--;
  const u=gDir()||[0,1], p=[-u[1],u[0]];
  const a=Math.max(15, G/cellM*Math.hypot(gN.x,gN.y));     // 重力加速度[マス/秒²]。跳ぶ高さがだいたい揃うように
  for(const o of list){
    const H=3+Math.random()*5;                               // 3〜8マスくらい跳ぶ
    const v=Math.sqrt(2*a*H), side=(Math.random()-0.5)*v*0.6;
    const hk = o.heavy ? 0.35 : 1;                            // 重りは少ししか跳ねない
    o.vx=(-u[0]*v+p[0]*side)*hk; o.vy=(-u[1]*v+p[1]*side)*hk;
    o.wv=(o.wv||0)-0.012;                                    // ぐっと縮んでから飛ぶ
  }
  chain=0; cascade=false; quietT=0;
  jumpFx={t:performance.now()}; shake=10;
  itemFx={text:"ジャンプ!", t:performance.now()};
  sfx("jump"); updateHud();
}

function useShuffle(){
  if(!running||paused||over||items.shuf<=0||shuffle||popping) return;
  const src=balls.filter(o=>!o.live);
  if(!src.length) return;
  const FL=['virus','vLeft','bomb','balloon','heavy','frozen','magnet','timer'];
  const from=src.map(o=>{ const b={x:o.x-0.5, y:o.y-0.5, c:o.c}; for(const k of FL) if(o[k]!=null) b[k]=o[k]; return b; });
  // 行き先: 真ん中3×3と、落下中の組のまわりを避けて、ランダムに散らす（1マスに1個なので重ならない）
  const c=(N-1)/2, spots=[];
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    if(Math.abs(x-c)<=1 && Math.abs(y-c)<=1) continue;
    if(piece && piece.balls.some(o=>Math.hypot(o.x-(x+0.5),o.y-(y+0.5))<1.2)) continue;
    spots.push([x,y]);
  }
  for(let i=spots.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [spots[i],spots[j]]=[spots[j],spots[i]]; }
  if(spots.length<from.length) return;
  items.shuf--;
  const colors=from.map(b=>{ const x={...b}; delete x.x; delete x.y; return x; });
  for(let i=colors.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [colors[i],colors[j]]=[colors[j],colors[i]]; }
  const to=from.map((b,i)=>({x:spots[i][0], y:spots[i][1], ...colors[i]}));

  sfx("shuf"); updateHud();
}
function easeInCubic(t){ return t*t*t; }
function easeOutBack(t){ const c1=1.4, c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); }
// シャッフル中の粒の位置（盤面のマス単位、中心座標）
function shuffleFrame(now){
  const t=now-shuffle.t, c=(N-1)/2+0.5, out=[];
  const sp=shuffle.spin;
  if(t<SHUF_IN){                               // ぐるぐる回りながら中央へ
    const e=easeInCubic(t/SHUF_IN);
    for(const b of shuffle.from){
      const dx=b.x+0.5-c, dy=b.y+0.5-c, r0=Math.hypot(dx,dy), a0=Math.atan2(dy,dx);
      const r=r0*(1-e), a=a0+sp*e*Math.PI*3;
      out.push({x:c+Math.cos(a)*r, y:c+Math.sin(a)*r, c:b.c, sc:1-0.45*e});
    }
  }else if(t<SHUF_IN+SHUF_HOLD){               // 中央で渦を巻く
    const k=(t-SHUF_IN)/SHUF_HOLD;
    shuffle.from.forEach((b,i)=>{
      const a=i*2.399+sp*(k*Math.PI*2+t*0.01), r=0.35+0.25*Math.sin(i*1.7+t*0.02);
      out.push({x:c+Math.cos(a)*r, y:c+Math.sin(a)*r, c:shuffle.to[i].c, sc:0.55});
    });
  }else{                                       // 四方へ吐き出す
    const k=Math.min(1,(t-SHUF_IN-SHUF_HOLD)/SHUF_OUT), e=easeOutBack(k);
    for(const b of shuffle.to){
      const dx=b.x+0.5-c, dy=b.y+0.5-c, rr=Math.hypot(dx,dy), a1=Math.atan2(dy,dx);
      const a=a1 - sp*(1-k)*Math.PI*1.2, r=rr*e;
      out.push({x:c+Math.cos(a)*r, y:c+Math.sin(a)*r, c:b.c, sc:0.55+0.45*Math.min(1,k*1.5)});
    }
  }
  return out;
}

function tone(f0,f1,dur,type,vol,delay=0){

// ===== ループ =====
let last = performance.now();
const PORTRAIT = matchMedia("(orientation:portrait)");
function frame(now){
  const dt = Math.min(100, now-last); last=now;
  if(paused && shuffle) shuffle.t+=dt;
  if(running && !paused && !over && PORTRAIT.matches){ paused=true; showMenu("pause"); }   // 縦向きにしたら一時停止
  if(running && !paused && !over) update(dt, now);
  stepFx(dt);
  draw(now);
  requestAnimationFrame(frame);
}
let popCheckT=0, sampleT=0, lastMove=1;
function update(dt, now){
  if(shuffle){                                  // シャッフル演出中は時間を止める
    if(now-shuffle.t >= SHUF_IN+SHUF_HOLD+SHUF_OUT){
      const c=N/2;
      for(const b of shuffle.to){ const o=newBall(b.x+0.5,b.y+0.5,b.c); for(const k of ['virus','vLeft','bomb','balloon','heavy','frozen','magnet','timer']) if(b[k]!=null) o[k]=b[k]; if(o.virus) o.vT=0; const dx=o.x-c, dy=o.y-c, d=Math.hypot(dx,dy)||1; o.vx=dx/d*2; o.vy=dy/d*2; o.wv=0.008; balls.push(o); }
      shuffle=null; chain=0; cascade=false; quietT=0;
    }
    return;
  }
  if(stopLeft>0){ stopLeft=Math.max(0,stopLeft-dt); if(stopLeft===0) updateHud(); }
  if(magLeft>0){ magLeft=Math.max(0,magLeft-dt); if(magLeft===0){ for(const o of balls){ o.mx=o.my=0; } magPairs=[]; updateHud(); } }
  if(popping && now-popT>=POP_MS){
    const gone=popping;
    balls=balls.filter(o=>!o.pop); dropBonds(o=>!o.pop); popping=null; quietT=0;
    // 消えた場所のまわりの粒: すべりやすくして、重力の向きに軽く押し出す（流れが止まりにくい）
    const u=gDir();
    for(const o of balls){ if(o.live) continue;
      if(gone.some(p=>Math.hypot(p.x-o.x,p.y-o.y)<3*2*R)){ o.slip=SLIP_MS; if(u){ o.vx+=u[0]*1.2; o.vy+=u[1]*1.2; } } }
    chainWinLen=chainWin(chain); chainUntil=now+chainWinLen;
    if(!balls.some(o=>!o.live)){ rec.allClear++; score+=3000; updateHud(); praise("全消し！", "+3000点", "#ff9df0"); shake=16; }
  }
  for(const o of balls) if(o.slip>0) o.slip-=dt;
  const maxSp=physicsStep(dt);
  // 「落ち着いた」かどうかは、0.12秒ごとに粒がどれだけ動いたかで判断する（接触の細かい振動は無視）
  sampleT+=dt;
  if(sampleT>=120){
    let maxD=0;
    for(const o of balls){ if(o.live||o.pop) continue; if(o.sx!=null) maxD=Math.max(maxD,Math.hypot(o.x-o.sx,o.y-o.sy)); else maxD=1; o.sx=o.x; o.sy=o.y; }
    lastMove=maxD; sampleT=0;
  }
  physActive = lastMove>0.02;
  if(!popping){
    quietT = lastMove<0.02 ? quietT+dt : 0;
    popCheckT+=dt;
    if(popCheckT>=80){ spreadVirus(popCheckT); tickTimers(popCheckT); popCheckT=0; makeBonds(); findPops(now); checkDanger(); }
    if(!popping && now>chainUntil) cascade=false;   // 消え終わってしばらく次が消えなければ連鎖はおしまい
  }
  if(!piece){
    // 次の組: 前の組が出てから一定時間（ふつう1秒）たったら、積み山が動いていても出す
    if(!popping && !over && stopLeft<=0 && now-releaseT>=120 && now-spawnT>=LEVELS[levelKey].every) spawn(now);
    return;
  }
  pieceStep(dt);
}
// 大逆転: 出口（真ん中）のすぐそばまで積もったピンチから、まわりをすっきり空けたら
function checkDanger(){
  const c=N/2; let near=Infinity;
  for(const o of balls){ if(o.live||o.pop) continue; near=Math.min(near,Math.hypot(o.x-c,o.y-c)); }
  if(near<2.2*2*R) danger=true;
  else if(danger && near>4.5*2*R){ danger=false; rec.comeback++; praise("大逆転！", "ピンチを切り抜けた", "#9dffb0"); }
}
let statusAcc=0;
function stepFx(dt){
  statusAcc+=dt; if(statusAcc>200){ statusAcc=0; if(sensorSeen) setStatus(); }
  const gx=gN.x*1.6, gy=gN.y*1.6;
  for(const p of particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx+=gx*0.00002*dt; p.vy+=gy*0.00002*dt; p.life-=dt/650; }
  particles=particles.filter(p=>p.life>0);
  shake=Math.max(0, shake - dt*0.04);
  { const u=gDir(); if(u){ const d=dirDeg(u); const el=document.querySelector("#dropBtn .icon"); if(el && Math.abs(((d-(el._r||0))%360+540)%360-180)>3) setRot(el,d); } }   // 「落とす」ボタンの矢印は本当の重力の向き
  const S=slope(); const eff = S.canStart||physActive ? Math.max(0, S.sin - S.f.k*S.cos) : 0;
  tiltK += (eff*2 - tiltK) * Math.min(1, dt/180);   // 見た目用（床の光・矢印の強さ）
  // ばね: つぶれ具合 w が 0 に戻ろうとして、ぷるんと揺れる
  const K=0.0007, C=0.011;
  const spring=o=>{
    let t=dt; while(t>0){ const h=Math.min(16,t); t-=h;
      o.wv=(o.wv||0)+(-K*(o.w||0)-C*(o.wv||0))*h; o.w=(o.w||0)+o.wv*h; }
    if(Math.abs(o.w)<0.001 && Math.abs(o.wv)<0.00005){ o.w=0; o.wv=0; }
  };
  const decay=(o,rate)=>{
    const st=dt/rate;
    if(o.ox){ o.ox = Math.abs(o.ox)<=st ? 0 : o.ox-Math.sign(o.ox)*st; }
    if(o.oy){ o.oy = Math.abs(o.oy)<=st ? 0 : o.oy-Math.sign(o.oy)*st; }
  };
  if(balls) for(const o of balls) spring(o);
  if(piece){ decay(piece,70); spring(piece); }
}

// 顔: 小さな点の目・ほっぺ・小さな口（つぶらな目で、本家とは違う顔）
function face(g,r,o,gx,gy){

// くびれた橋: 2つの円のあいだを、内側にへこんだ曲線でつなぐ
function neck(g,x1,y1,x2,y2,r,ang,pinch,fill){
  const dx=x2-x1, dy=y2-y1, d=Math.hypot(dx,dy)||1, ux=dx/d, uy=dy/d, nx=-uy, ny=ux;
  const ca=Math.cos(ang), sa=Math.sin(ang), mx=(x1+x2)/2, my=(y1+y2)/2, hw=r*pinch;
  g.fillStyle=fill; g.beginPath();
  g.moveTo(x1+r*(ca*ux+sa*nx), y1+r*(ca*uy+sa*ny));

  g.quadraticCurveTo(mx-nx*hw, my-ny*hw, x1+r*(ca*ux-sa*nx), y1+r*(ca*uy-sa*ny));
  g.closePath(); g.fill();
}

function bondOver(g,x1,y1,x2,y2,r,ci,t){
  const p=PALETTE[ci], mx=(x1+x2)/2, my=(y1+y2)/2, dx=x2-x1, dy=y2-y1, d=Math.hypot(dx,dy)||1, ux=dx/d, uy=dy/d;
  if(bondStyle==="goo"||bondStyle==="mochi"){            // つなぎ目のかげを消して、ひとつながりに見せる
    const k=bondStyle==="goo"?0.3:0.46;
    const gr=g.createRadialGradient(mx,my,0,mx,my,r*k);
    gr.addColorStop(0,p.base); gr.addColorStop(0.7,p.base); gr.addColorStop(1,p.base+"00");
    g.save(); g.translate(mx,my); g.rotate(Math.atan2(uy,ux)); g.scale(0.55,1.2); g.translate(-mx,-my);
    g.fillStyle=gr; g.beginPath(); g.arc(mx,my,r*k,0,Math.PI*2); g.fill(); g.restore();
    let nx=-uy, ny=ux; if(ny>0||(ny===0&&nx>0)){ nx=-nx; ny=-ny; }   // 光の来る上側に、橋のつや
    g.fillStyle="rgba(255,255,255,.3)";
    g.beginPath(); g.ellipse(mx+nx*r*0.24, my+ny*r*0.24, r*0.13, r*0.045, Math.atan2(uy,ux), 0, Math.PI*2); g.fill();
  }else if(bondStyle==="hands"){                          // 小さな手をつないでいる
    const nx=-uy, ny=ux, side = (ny>0 || (ny===0 && nx>0)) ? 1 : -1;   // 下側（画面の下寄り）で手をつなぐ
    const hx=mx+nx*side*r*0.72, hy=my+ny*side*r*0.72;
    g.lineCap="round";
    for(const [cx,cy] of [[x1,y1],[x2,y2]]){              // うで（体のふちから、つないだ手まで）
      const ax=hx-cx, ay=hy-cy, al=Math.hypot(ax,ay)||1, sx=cx+ax/al*r*0.86, sy=cy+ay/al*r*0.86;
      g.strokeStyle=p.dark; g.lineWidth=Math.max(2.5,r*0.24); g.beginPath(); g.moveTo(sx,sy); g.lineTo(hx,hy); g.stroke();
      g.strokeStyle=p.base; g.lineWidth=Math.max(1.5,r*0.13); g.beginPath(); g.moveTo(sx,sy); g.lineTo(hx,hy); g.stroke();
    }
    g.fillStyle="#fff7fb"; g.strokeStyle=p.dark; g.lineWidth=Math.max(1,r*0.07);
    for(const k of [-1,1]){ g.beginPath(); g.arc(hx+ux*k*r*0.09,hy+uy*k*r*0.09,r*0.17,0,Math.PI*2); g.fill(); g.stroke(); }
  }else if(bondStyle==="heart"){                          // くっついたところに小さなハート
    const sz=r*(0.4+0.04*Math.sin(t/260+mx));
    g.save(); heartPath(g,mx,my+sz*0.1,sz); g.fillStyle="#ff7eb0"; g.fill();
    g.lineWidth=Math.max(1.5,r*0.1); g.strokeStyle="#ffffff"; g.stroke();
    g.fillStyle="rgba(255,255,255,.7)"; g.beginPath(); g.arc(mx-sz*0.42,my-sz*0.38,sz*0.13,0,Math.PI*2); g.fill(); g.restore();
  }
}
// シール: つながったかたまり全体を白いふちで囲む（粒より先に描く）
function stickerBack(g,group,s,r){
  g.fillStyle="#ffffff"; g.strokeStyle="#ffffff";
  for(const o of group){ g.beginPath(); g.arc(o.x*s,o.y*s,r*1.17,0,Math.PI*2); g.fill(); }
}

  ctx.save();

  ctx.fillStyle="#131722"; ctx.fillRect(-20,-20,W+40,W+40);

  const gu=gDir()||[0,1], dx=gu[0], dy=gu[1], gw=s*1.6;
  const ext=W/2*(Math.abs(dx)+Math.abs(dy));             // 重力の向きで一番遠い角までの距離

      gr2.addColorStop(0,`rgba(255,240,180,${(0.9*(1-t)).toFixed(3)})`); gr2.addColorStop(0.6,`rgba(255,140,60,${(0.5*(1-t)).toFixed(3)})`); gr2.addColorStop(1,"rgba(255,100,40,0)");

  if(itemFx){

    else{
      ctx.save(); ctx.globalAlpha = t>0.7 ? 1-(t-0.7)/0.3 : 1;

      ctx.lineWidth=s*0.16; ctx.strokeStyle="rgba(0,0,0,.6)"; ctx.strokeText(itemFx.text,0,0);

    ctx.fillStyle="rgba(0,0,0,.5)"; ctx.fillRect(0,0,W,W);
    ctx.fillStyle="#fff"; ctx.font=`700 ${s*1.2}px sans-serif`; ctx.textAlign="center"; ctx.textBaseline="middle";

function drawNext(){
  fitCanvas(nv);
  const W=nv.width; nctx.clearRect(0,0,W,W);
  const draw1=(nx,cx,cy,size,alpha,face)=>{
    const xs=nx.o.map(o=>o[0]), ys=nx.o.map(o=>o[1]);
    const mx=(Math.min(...xs)+Math.max(...xs))/2, my=(Math.min(...ys)+Math.max(...ys))/2;
    const span=Math.max(Math.max(...xs)-Math.min(...xs), Math.max(...ys)-Math.min(...ys))+1;
    const u=Math.min(size/span, size*0.5), r=u*0.47;
    nx.o.forEach(([x,y],i)=>blob(nctx,cx+(x-mx)*u,cy+(y-my)*u,r,nx.c[i],alpha,{face,fx:{[nx.f[i]||"_"]:true, timer:nx.f[i]==="timer"?TIMER_MS:null},t:performance.now()}));
  };
  draw1(nextPairs[0], W*0.38, W*0.5, W*0.62, 1, true);            // 次の組
  draw1(nextPairs[1], W*0.83, W*0.5, W*0.28, 0.7, false);          // その次
}

// 盤面は常に「画面に見えている向き」のまま（CSSで回さない）。
// 端末の回転は、センサーの値を画面座標へ変換するときにだけ使う。
// iOS は screen.orientation.angle の向きが仕様と逆なので、window.orientation を優先する
// （window.orientation: 正 = 端末を反時計回りに回した）。
function screenAngleCCW(){
  // iOS アプリ版: アプリが本当の画面の向きを教えてくれる（縦持ちで起動したときに window.orientation が 0 のままになるため）
  if(typeof window.__nativeAngle==="number") return window.__nativeAngle;
  if(typeof window.orientation==="number") return window.orientation;
  if(screen.orientation && typeof screen.orientation.angle==="number") return screen.orientation.angle;
  return 0;
}
const angle=0;   // 盤面の回転（常に0）。タッチ座標変換用
function applyOrientation(){ updatePad(); updateCtrl(); }
window.addEventListener("orientationchange",()=>setTimeout(applyOrientation,50));
if(screen.orientation) screen.orientation.addEventListener("change",applyOrientation);
window.addEventListener("resize",()=>{ applyOrientation(); drawNext(); });

// ===== 傾きセンサー =====
// iOS（iPadOS はデスクトップ版 Mac の UA を名乗るので、タッチ対応の Mac も iOS 扱い）
const IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent)
  || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints>1);
let sensorSeen=false, sx=0, sy=0, pendDir=-1, pendSince=0;
function onMotion(e){
  const a=e.accelerationIncludingGravity;
  if(!a || a.x==null || a.y==null) return;
  if(!sensorSeen){ sensorSeen=true; setStatus(); }
  // 1) 端末座標系（x右, y上）での「重力が引く向き」
  //    仕様（Android）: 値は重力の反作用 → 向きは -a
  //    iOS: 全軸が仕様と逆 → 向きは +a
  const sgn = IS_IOS ? 1 : -1;
  // 2) y を下向きに直す
  let dx0 = sgn*a.x, dy0 = -sgn*a.y;
  // 3) 画面の回転ぶん戻して「画面上の向き」にする（反時計回りに w 度回した端末 → -w 度回転）
  const w = (screenAngleCCW() + sensorOffset*90) * Math.PI/180;
  const c=Math.cos(-w), s=Math.sin(-w);
  let gx = dx0*c - dy0*s, gy = dx0*s + dy0*c;
  sx = sx*0.6 + gx*0.4; sy = sy*0.6 + gy*0.4;
  const mag=Math.hypot(sx,sy);
  // 重力の単位ベクトル（画面に沿った成分 x,y と、画面に垂直な成分 z）
  const az = Math.abs(a.z||0), tot = Math.hypot(gx,gy,az) || 1;
  gN.x = gN.x*0.7 + (gx/tot)*0.3; gN.y = gN.y*0.7 + (gy/tot)*0.3; gN.z = gN.z*0.7 + (az/tot)*0.3;
  tiltDeg = Math.asin(Math.min(1, Math.hypot(gN.x,gN.y)))*180/Math.PI;   // 盤面が水平から何度傾いているか
  if(mag<TILT_MIN) { pendDir=-1; return; }
  const ang=Math.atan2(sy,sx)*180/Math.PI;            // 0=右, 90=下
  const axes=[90,180,-90,0];                          // DIRS の順
  let bestD=0, bestDiff=999;
  axes.forEach((ax,i)=>{ let d=Math.abs(((ang-ax)%360+540)%360-180); if(d<bestDiff){bestDiff=d;bestD=i;} });
  if(bestD!==grav && bestDiff<40 && running&&!paused&&!over) setGravity(bestD);   // 操作ボタンの向きだけ一番近い方向に合わせる
  if(Math.hypot(gN.x,gN.y)>0.05) dirty=true;
}
async function enableSensor(){
  try{
    if(typeof DeviceMotionEvent!=="undefined" && typeof DeviceMotionEvent.requestPermission==="function"){
      const res = await DeviceMotionEvent.requestPermission();
      if(res!=="granted"){ setStatus("センサーが許可されませんでした"); return; }
    }
    window.addEventListener("devicemotion",onMotion);
  }catch(err){ setStatus("センサーを使えません（"+(err&&err.name||"error")+"）"); }
}
function setStatus(msg){
  const el=document.getElementById("status");
  if(msg){ el.textContent=msg; return; }
  const S=slope();
  const acc = (S.canStart||physActive) ? Math.max(0,S.aMS) : 0;
  el.textContent = sensorSeen ? `傾き ${Math.round(tiltDeg)}° ・ μ ${S.f.k.toFixed(2)} ・ ${acc>0?acc.toFixed(1)+" m/s²":"静止摩擦で停止"}` : (window.isSecureContext ? "傾きセンサー: なし" : "傾きセンサー: HTTPSが必要");
}

// ===== タッチ操作 =====
// 横ドラッグ（重力と直交方向）= 移動 / 重力方向へドラッグ = ソフトドロップ / 重力方向へフリック = ハードドロップ / タップ = 回転
let tp=null;
function toBoard(dx,dy){ // 画面上の移動量 → 盤面座標
  const r=angle*Math.PI/180, c=Math.cos(r), s=Math.sin(r);
  return [dx*c - dy*s, dx*s + dy*c];
}
const stage=document.getElementById("stage");
stage.addEventListener("pointerdown",e=>{
  if(!running||paused||over) return;
  stage.setPointerCapture(e.pointerId);
  tp={id:e.pointerId, x0:e.clientX, y0:e.clientY, ax:e.clientX, ay:e.clientY, t0:performance.now(), maxd:0};
});
stage.addEventListener("pointermove",e=>{
  if(!tp||e.pointerId!==tp.id||!piece) return;
  const cell = stage.offsetWidth/N;
  tp.maxd=Math.max(tp.maxd, Math.hypot(e.clientX-tp.x0, e.clientY-tp.y0));
  const [bx,by]=toBoard(e.clientX-tp.ax, e.clientY-tp.ay);
  const [gx,gy]=DIRS[grav];
  const along = bx*gx + by*gy;                 // 重力方向成分
  const perp  = gx!==0 ? by : bx;              // 直交成分
  const px = gx!==0 ? 0 : 1, py = gx!==0 ? 1 : 0;
  const step = cell*0.85;
  if(Math.abs(perp)>=step){
    const k=Math.sign(perp);
    tryMove(px*k,py*k); lockTimer=0;
    const [sx2,sy2]=toBoardInv(px*k*step, py*k*step);
    tp.ax+=sx2; tp.ay+=sy2;
  }else if(along>=step*1.2){
    if(tryMove(gx,gy)) score+=1;
    const [sx2,sy2]=toBoardInv(gx*step*1.2, gy*step*1.2);
    tp.ax+=sx2; tp.ay+=sy2;
  }
});
function toBoardInv(bx,by){ const r=-angle*Math.PI/180, c=Math.cos(r), s=Math.sin(r); return [bx*c-by*s, bx*s+by*c]; }
stage.addEventListener("pointerup",e=>{
  if(!tp||e.pointerId!==tp.id) return;
  const dt=performance.now()-tp.t0;
  const [bx,by]=toBoard(e.clientX-tp.x0, e.clientY-tp.y0);
  const [gx,gy]=DIRS[grav];
  const along=bx*gx+by*gy, perp=gx!==0?by:bx;
  if(tp.maxd<12 && dt<300) rotate(1);
  else if(dt<280 && along>stage.offsetWidth*0.12 && along>Math.abs(perp)*2) hardDrop();
  tp=null;
});
stage.addEventListener("pointercancel",()=>{tp=null;});

// ===== キーボード（PC確認用） =====
window.addEventListener("keydown",e=>{
  const k=e.key;
  if(k==="p"||k==="P"||k==="Escape"){ togglePause(); return; }
  if(!running||paused||over) return;
  const [gx,gy]=DIRS[grav];
  const map={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
  if(map[k]){
    const [dx,dy]=map[k];
    if(dx===gx&&dy===gy){ if(tryMove(dx,dy)) score+=1; }
    else if(dx!==-gx||dy!==-gy){ tryMove(dx,dy); lockTimer=0; }
    e.preventDefault(); return;
  }
  if(k===" "){ hardDrop(); e.preventDefault(); return; }
  if(k==="1") useStop();
  if(k==="2") useShuffle();
  if(k==="3") useJump();
  if(k==="x"||k==="X") rotate(1);
  if(k==="z"||k==="Z") rotate(-1);
  const gk={s:0,a:1,w:2,d:3,S:0,A:1,W:2,D:3};
  if(k in gk){ const [x,y]=DIRS[gk[k]], t=35*Math.PI/180; gN={x:x*Math.sin(t), y:y*Math.sin(t), z:Math.cos(t)}; setGravity(gk[k]); dirty=true; }
});

// ===== ボタン =====
// 重力パッドは画面上の向き → 盤面の向きに変換
function screenToBoardDir(i){ const [x,y]=DIRS[i]; const [bx,by]=toBoard(x,y); return nearestDir(bx,by); }
function boardToScreenDir(i){ const [x,y]=DIRS[i]; const [sx2,sy2]=toBoardInv(x,y); return nearestDir(sx2,sy2); }
function nearestDir(x,y){ let bi=0,bv=-9; DIRS.forEach(([dx,dy],i)=>{ const v=dx*x+dy*y; if(v>bv){bv=v;bi=i;} }); return bi; }
document.querySelectorAll(".pad [data-g]").forEach(b=>b.addEventListener("click",()=>{ if(running&&!paused&&!over) setGravity(screenToBoardDir(+b.dataset.g)); }));

// 操作ボタン（押しっぱなしでリピート）
let ctrlDirs=[[-1,0],[1,0]];
function dirDeg([x,y]){ return Math.atan2(y,x)*180/Math.PI; }
function setRot(el,deg){                    // 最短の回り方でアイコンを回す
  if(!el) return;
  const prev = (el._r==null) ? deg : el._r;
  let d=deg; while(d-prev>180) d-=360; while(d-prev<-180) d+=360;
  el._r=d; el.style.transform=`rotate(${d}deg)`;
}
function updateCtrl(){
  const p = DIRS[grav][0]!==0 ? [0,1] : [1,0];          // 重力と直交する盤面方向
  let a=[-p[0],-p[1]], b=[p[0],p[1]];
  if(a[0]>0||a[1]>0) [a,b]=[b,a];                       // 左/上を指す方を左のボタンに
  ctrlDirs=[a,b];
  const q=id=>document.querySelector(`#${id} .icon`);
  setRot(q("mvA"), dirDeg(a)); setRot(q("mvB"), dirDeg(b));
  setRot(q("dropBtn"), dirDeg(gDir()||DIRS[grav]));
}
function holdButton(id, fn, repeat){
  const el=document.getElementById(id); let t1=null, t2=null;
  const stop=()=>{ clearTimeout(t1); clearInterval(t2); t1=t2=null; el.classList.remove("down"); };
  el.addEventListener("pointerdown",e=>{
    e.preventDefault(); e.stopPropagation();
    el.classList.add("down");
    if(!running||paused||over) return;
    fn();
    if(repeat){ t1=setTimeout(()=>{ t2=setInterval(()=>{ if(running&&!paused&&!over) fn(); else stop(); },70); },220); }
  });
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>el.addEventListener(ev,stop));
  el.addEventListener("click",e=>e.preventDefault());
}
holdButton("mvA",()=>{ if(tryMove(...ctrlDirs[0])) lockTimer=0; },true);
holdButton("mvB",()=>{ if(tryMove(...ctrlDirs[1])) lockTimer=0; },true);
holdButton("rotBtn",()=>rotate(1),false);
holdButton("dropBtn",()=>hardDrop(),false);
holdButton("itemStop",()=>useStop(),false);
holdButton("itemShuf",()=>useShuffle(),false);
holdButton("itemJump",()=>useJump(),false);
holdButton("itemMag",()=>useMag(),false);

// 図鑑の画面（見つけたぷにだけ姿と説明が出る。開発版で全部出す設定のときは全部見られる）
let zkAnim=0;
function showZukan(back){
  sheet.classList.add("wide");
  const known=z=>zkSeen.has(z.k)||devAll;
  const n=ZUKAN.filter(known).length;
  sheet.innerHTML=`<h1>ぷに図鑑</h1>
    <div class="zk-count">見つけたぷに ${n} / ${ZUKAN.length}${devAll?"（開発版: 全部表示）":""}</div>
    <div class="zk-grid">${ZUKAN.map((z,i)=>known(z)
      ? `<div class="zk"><canvas data-i="${i}"></canvas><div><div class="no">No.${String(i+1).padStart(2,"0")}・ステージ${z.st}から</div><h3>${z.name}</h3><p>${z.desc}</p><p class="flv">${z.flv}</p></div></div>`
      : `<div class="zk lock"><canvas data-i="${i}" data-lock="1"></canvas><div><div class="no">No.${String(i+1).padStart(2,"0")}</div><h3>？？？</h3><p>ステージ${z.st}で出会えるかも。</p></div></div>`).join("")}
    </div>
    <button class="big" id="zkBack">もどる</button>`;
  document.getElementById("zkBack").onclick=()=>{ cancelAnimationFrame(zkAnim); sheet.classList.remove("wide"); showMenu(back); };
  const cvs=[...sheet.querySelectorAll(".zk canvas")], dpr=Math.min(3,window.devicePixelRatio||1);
  for(const c of cvs){ c.width=c.height=Math.round(76*dpr); }
  const draw=now=>{
    if(!sheet.contains(cvs[0])) return;
    for(const c of cvs){
      const z=ZUKAN[+c.dataset.i], g=c.getContext("2d"), W=c.width;
      g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,W,W);
      if(c.dataset.lock){                                         // まだ見つけていない: かげだけ
        g.fillStyle="#2a3142"; g.beginPath(); g.arc(W/2,W*0.54,W*0.3,0,Math.PI*2); g.fill();
        g.fillStyle="#4a5368"; g.font=`bold ${W*0.3}px sans-serif`; g.textAlign="center"; g.textBaseline="middle"; g.fillText("?",W/2,W*0.56);
        continue;
      }
      const br=1+0.025*Math.sin(now/420+(+c.dataset.i)), blink=((now/1000+(+c.dataset.i)*0.7)%4)<0.12;
      if(z.k==="normal"){                                         // 5色を並べる
        const r=W*0.15, pts=[[0.3,0.36],[0.7,0.36],[0.2,0.7],[0.5,0.7],[0.8,0.7]];
        pts.forEach(([x,y],j)=>blob(g,W*x,W*y,r*br,j,1,{face:faceOn,blink,g:[0,1],t:now}));
      }else{
        const fx=Object.assign({},z.fx||{});
        if(fx.timer) fx.timer = 30000-((now/1000)%30)*1000;      // 数字が減っていく
        const yy = z.k==="balloon" ? W*(0.52+0.04*Math.sin(now/600)) : W*0.55;
        blob(g,W/2,yy,W*0.3*br,z.c,1,{face:faceOn,blink,g:[0,1],fx,t:now});
      }
    }
    zkAnim=requestAnimationFrame(draw);
  };
  cancelAnimationFrame(zkAnim); zkAnim=requestAnimationFrame(draw);
  overlay.scrollTop=0;
}

function shareX(){

  const url="https://saaiya-chan.github.io/gravity-tetris/free.html";
  const intent="https://x.com/intent/post?text="+encodeURIComponent(text)+"&url="+encodeURIComponent(url);
  const h=window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.openExternal;
  if(h) h.postMessage(intent);                                  // iOS アプリ: アプリに X（なければ Safari）で開いてもらう
  else if(!window.open(intent,"_blank")) location.href=intent;   // ブラウザ: 新しいタブ（開けなければこのタブ）で
}
function hideOverlay(){ overlay.classList.add("hidden"); last=performance.now(); }
async function start(){
  initAudio();
  await enableSensor();
  setStatus();
  running=true; reset(); updatePad(); updateCtrl(); hideOverlay();
  try{ window.focus(); }catch(e){}
}
let lastNew=[];
function gameOver(){
  over=true; piece=null;
  rec.stage=level; rec.maxChain=Math.max(rec.maxChain,maxChain);
  lastNew=[];
  if(score>best){ if(best>0) lastNew.push("score"); best=score; store.set("bestFree",best); }
  for(const [k] of REC_DEFS) if(rec[k]>(bestRec[k]||0)){ if(bestRec[k]) lastNew.push(k); bestRec[k]=rec[k]; }
  store.set("bestRecFree",bestRec);
  setTimeout(()=>showMenu("over"),400);
}

// ===== 起動 =====
grav=0;
colorsN=4; balls=[]; nextPairs=[newPair(),newPair()]; particles=[];
running=false; paused=false; over=false;
applyOrientation(); updatePad(); setStatus(); drawNext(); showMenu("title");
requestAnimationFrame(frame);
</script>
