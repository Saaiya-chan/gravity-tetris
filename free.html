  menuKind=kind; overlay.classList.remove("hidden"); sheet.classList.remove("wide","home","intro","clear"); overlay.classList.remove("homeBg"); introOpen=false; cancelAnimationFrame(introAnim); cancelAnimationFrame(zkAnim); cancelAnimationFrame(homeAnim);
  const secure = window.isSecureContext;
  if(kind==="title"){                                          // ホーム画面
    sheet.classList.add("home"); overlay.classList.add("homeBg");
    const noAd = IAP_MH && !iap.adFree;
    sheet.innerHTML=`${HOME_BG}<div class="home-top">
        <div class="home-id"><button class="home-av" id="avBtn" aria-label="プロフィール">${avatarHtml()}</button><h1 class="home-title">グラビティ・ポップ${RELEASE?"":` <span style="font-size:.5em;-webkit-text-fill-color:#ffcf5a">フリー</span>`}</h1></div>
        <div class="home-pills">
          <button class="home-pill" id="lifeBtn">${ICON.heart}<b id="lifeN">${(lifeTick(),lives.n)}</b><small id="lifeTxt">${lifeLeftText()}</small><i class="plus">+</i></button>
          <button class="home-pill" id="coinBtn">${ICON.coin}<b>${coins}</b><i class="plus">+</i></button><button class="home-gear" id="setBtn" aria-label="設定">${ICON.gear}</button></div>
      </div>
      <div class="home-side l">
        <button class="home-round" id="zkBtn">${ICON.book}<span>ぷに図鑑</span></button>
        <button class="home-round" id="slotBtn">${ICON.slots}<span>アイテム配置</span></button>
        <button class="home-round" id="skillBtn">${ICON.lab}<span>ぷに研究所</span>${Object.values(GEM_ITEM).some(canDevelop)?`<i class="bang">!</i>`:""}</button>
        <button class="home-round" id="helpBtn">${ICON.help}<span>あそびかた</span></button>
      </div>
      <div class="home-mid">
        <canvas id="homeArt"></canvas>
        <p class="home-tag">傾けて、ころがして、まとめて消そう</p>
        ${secure?"":'<p class="warn" style="margin:0">傾きセンサーは HTTPS で開いたときだけ使えます。</p>'}
        <button class="big home-start" id="startBtn"><span class="hs-w">ワールドをえらぶ</span><small>スタート</small></button>
        <div class="home-modes"><button id="endlessBtn">${ICON.endless}エンドレス</button></div>
        <div class="home-foot">${IAP_MH ? "" : (RELEASE?"":`<a href="./" style="color:#9fd3ff">← マス目版で遊ぶ</a>`)}</div>
      </div>
      <div class="home-side r">
        <button class="home-round" id="shopBtn">${ICON.cart}<span>ショップ</span></button>
        <button class="home-round" id="dailyBtn">${ICON.gift}<span>デイリー</span>${dailyReady()?`<i class="bang">!</i>`:""}</button>
        <button class="home-round" id="recBtn">${ICON.trophy}<span>プロフィール</span></button>
        ${noAd?`<button class="home-round noad" id="noAdOpen">${ICON.noads}<span>広告を消す</span></button>`:""}
      </div>`;
    bindIap(); drawHomeArt(); drawAvatars(sheet);
    document.getElementById("avBtn").onclick=()=>showMenu("records");
    { // 押しボタン: 触れたら沈み、離すと戻ると同時にスタート
      const sb=document.getElementById("startBtn"), up=()=>sb.classList.remove("down");
      sb.addEventListener("pointerdown",()=>sb.classList.add("down")); for(const ev of ["pointerup","pointerleave","pointercancel"]) sb.addEventListener(ev,up);
      sb.onclick=()=>{ up(); showMenu("worlds"); };
    }
    if(document.getElementById("noAdOpen")) document.getElementById("noAdOpen").onclick=()=>{ noadsBack="title"; showMenu("noads"); };
    document.getElementById("endlessBtn").onclick=()=>start("endless");
    document.getElementById("recBtn").onclick=()=>showMenu("records");
    document.getElementById("dailyBtn").onclick=()=>showMenu("daily");
    document.getElementById("lifeBtn").onclick=()=>showMenu("nolife");
    document.getElementById("helpBtn").onclick=()=>showMenu("help","title");
    document.getElementById("setBtn").onclick=()=>showMenu("settings","title");
    document.getElementById("zkBtn").onclick=()=>showZukan("title");
    document.getElementById("skillBtn").onclick=()=>showMenu("skills");
    document.getElementById("shopBtn").onclick=document.getElementById("coinBtn").onclick=()=>showShop("title");
    document.getElementById("slotBtn").onclick=()=>enterSlotEdit("title");
  }else if(kind==="clear"){                                    // ワールドクリア: コインの受け取り（動画を見ると2倍）
    const th=theme(), canAd = IAP_MH && iap.rewardReady && !iap.adFree && !clearDoubled;
    sheet.classList.add("intro","clear");
    const canSkill=Object.values(GEM_ITEM).some(canDevelop), gth=THEMES.find(t=>t.k===clearGems.k)||th;
    sheet.innerHTML=`<div class="in-head">${th.name}ワールド クリア！</div>
      <div class="in-pic cl-pic"><canvas id="clBoss"></canvas></div><div class="cl-cap">${BOSS_NAME[clearGems.k]||bossName(clearBossN)}「まいりました…」</div>
      <div class="cl-stats" style="margin-top:10px"><span>スコア <b>${score}</b></span><span>最大 <b>${maxChain}</b> 連鎖</span></div>
      <div class="cl-coins"><b class="cl-num" id="clNum">${ICON.coin} +${clearDoubled?lastCoins*2:lastCoins}</b>${clearDoubled?` <span class="cl-x2tag">2倍！</span>`:""}<small>クリアボーナス ${clearBonus} をふくむ</small></div>
      <div class="cl-gems"><span class="cl-gem">${gemHtml(clearGems.k)}<b>+${clearGems.n}</b><small>${gth.name}の宝石${clearDoubled?"（2倍！）":""}</small></span>${clearGems.rainbow?`<span class="cl-gem rb">${gemHtml("rainbow")}<b>+1</b><small>虹の宝石（王冠をこわした！）</small></span>`:`<span class="cl-gem off"><small>王冠をこわして倒すと<br>虹の宝石がもらえる</small></span>`}</div>
      <div class="cl-stars">${[0,1,2].map(i=>{ const on=starsOf(lastStars.k)[i], nw=lastStars.fresh[i]; return `<span class="cl-star${on?" on":""}${nw?" new":""}"><span class="st${on?" on":""}">${ICON.star}</span><small>${STAR_TEXT[i]}</small>${nw?`<i class="cl-new">NEW</i>`:""}</span>`; }).join("")}</div>
      <div class="cl-starcap">${ICON.star} <b>${starTotal()}/${starMax()}</b>　${ICON.bolt} 上限 <b>${enCap()}</b>・スタート時 <b>${enStart()}</b></div>
      ${canSkill?`<button class="cl-unlock" id="clSkill"><span class="cl-uic">${ICON.lab}</span><span><span class="cl-new">ぷに研究所</span><b>宝石がそろいました</b><small>新しいアイテムを開発できます</small></span></button>`:""}
      <div class="row">${canAd?`<button class="big cl-x2" id="x2Btn">▶ 動画を見て 2倍<br><small>${ICON.coin} +${lastCoins*2}　${gemHtml(clearGems.k)} +${clearGems.n*2}</small></button>`:""}<button class="big" id="clOk">${canAd?"このまま受け取る":"受け取る"}</button></div>
      <p id="clMsg" style="font-size:12px;margin:4px 0 0;color:var(--dim);min-height:1em"></p>`;
    drawBossDown(document.getElementById("clBoss")); updateHud(); fitSheet();
    overlay.scrollTop=0;
    document.getElementById("clOk").onclick=goHome;
    if(document.getElementById("clSkill")) document.getElementById("clSkill").onclick=()=>{ goHome(); showMenu("skills"); };
    if(canAd) document.getElementById("x2Btn").onclick=()=>{
      document.getElementById("x2Btn").disabled=true; document.getElementById("clMsg").textContent="動画を読み込んでいます…";
      rewardCb=ok=>{
        if(ok){ coins+=lastCoins; clearDoubled=true; addGem(clearGems.k, clearGems.base||0); clearGems.n+=clearGems.base||0; saveShop(); sfx("get"); showMenu("clear"); }
        else{ const m=document.getElementById("clMsg"); if(m) m.textContent="動画を最後まで見られませんでした"; const b=document.getElementById("x2Btn"); if(b) b.disabled=false; }
      };
      iapSend("reward");
    };
  }else if(kind==="skills"){                                   // ぷに研究所: あつめた宝石でアイテムを開発する
    sheet.classList.add("wide");
    const chip=k=>{ const b=document.getElementById(ITEM_BTN[k]), cs=getComputedStyle(b); return `<span class="tn-ic" style="background:${cs.backgroundImage};border-color:${cs.borderTopColor};color:${cs.color}">${b.querySelector("svg")?.outerHTML||""}</span>`; };
    const wname=w=>THEMES.find(t=>t.k===w).name, order=["sticky","space","bouncy","ice","desert","meadow","popcorn","fire","flower","magma"];
    const LAB_DESC={boost:"15秒間、連鎖の受付時間が2倍。大きな連鎖をねらえる。", hand:"5秒間、ぷにを指でつかんで運べる。", mag:"6秒間、同じ色どうしが引き合って集まる。",
      jump:"全部のぷにを高くはね上げて、山をくずす。", stop:"6秒間、新しいぷにが出てこない。", shuf:`ぷにの${Math.round(shufRate()*100)}%を吸い込んで、ばらまき直す。`,
      broom:`ぷにについた べたべた・感染・時限をはらい落として、ふつうのぷにに戻す。舞っている花びらも、はき出す。${broomN()?`お邪魔ぷにも${broomN()}個はき出す。`:""}`, pop:"ぷにがいちばん集まっている所で爆発して、まわりのぷにを お邪魔ぷにごと消す。",
      weight:"8秒間、全部のぷにが重くなって、はずまない・はね飛ばされない。", fire:`氷をぜんぶとかして、お邪魔ぷにを${fireN()}個まで燃やす。`, water:`火の粉とマグマぷにを消して、お邪魔ぷにを${waterN()}個まで ふつうのぷにに育てる。`};
    const done=(it,w)=>{ const cbs=spBosses(it), lv=lvOf(it), mx=lv>=UP_MAX, c=upCost(it);
      return `<div class="lab own"><div class="lab-ic">${chip(it)}<i class="lab-lv">Lv${lv}</i>${mx?`<span class="lab-max">MAX</span>`:`<button class="big" data-up="${it}"${canUpgrade(it)?"":" disabled"}>強化<small>${gemHtml(c.w)}${c.n}</small></button>`}</div>
        <div class="lab-t"><h3>${ITEM_NAME[it]}</h3><p>${LAB_DESC[it]}</p>${cbs.map(cb=>weakKnown(cb)?`<p class="lab-vs">${THEMES.find(t=>t.k===cb).ic} ${wname(cb)}のボスにきく</p>`:`<p class="lab-vs q">？？？のボスにきく</p>`).join("")}<p class="lab-en">${ICON.bolt} 消費エネルギー <b>${enCost(it)}</b></p>${mx?"":`<p class="lab-upt">強化: ${UP_TEXT[it]?UP_TEXT[it]+"・":""}王冠ダメージ +1%・消費 +${Math.round(EN_COST[it]*0.1)}</p>`}</div></div>`; };
    const todo=w=>{ const it=GEM_ITEM[w], have=gems[w]||0, can=it&&canDevelop(it), rb=can?Math.max(0,GEM_NEED-have):0, th=THEMES.find(t=>t.k===w);
      return `<div class="lab todo${can?" can":""}"><span class="tn-ic q">？</span><div class="lab-t"><h3>${ITEM_NAME[it]}</h3>
        <div class="lab-need">${gemHtml(w)} <b>${Math.min(have,GEM_NEED)}/${GEM_NEED}</b><small>${th.ic} ${th.name}の宝石${rb?`（たりない${rb}個は虹の宝石で）`:""}</small></div></div>
        ${can?`<button class="big" data-dev="${it}">開発する</button>`:""}</div>`; };
    const owned=order.filter(w=>GEM_ITEM[w]&&devItems.includes(GEM_ITEM[w])), rest=order.filter(w=>!owned.includes(w));
    sheet.innerHTML=`<h1>ぷに研究所</h1>
      <div class="gem-bar">${order.map(w=>`<span class="${gems[w]?"":"zero"}"><i>${THEMES.find(t=>t.k===w).ic}</i>${gemHtml(w)}<b>${gems[w]||0}</b></span>`).join("")}<span class="rb ${gems.rainbow?"":"zero"}"><i>虹</i>${gemHtml("rainbow")}<b>${gems.rainbow||0}</b></span></div>
      <h3 class="sk-h">つかえるアイテム</h3>
      <div class="lab-grid own2">${done("boost")}${owned.map(w=>done(GEM_ITEM[w],w)).join("")}</div>
      <h3 class="sk-h">これから開発 <small>ボスを倒して宝石を ${GEM_NEED} 個あつめよう</small></h3>
      <div class="lab-grid">${rest.map(todo).join("")}</div>
      <div class="row"><button id="backBtn">もどる</button>${RELEASE?"":`<button id="trDev">宝石 +3ずつ（開発）</button><button id="trReset">研究を最初に戻す（開発）</button>`}</div>`;
    const re=()=>{ const y=overlay.scrollTop; showMenu("skills"); overlay.scrollTop=y; updateHud(); };
    for(const b of sheet.querySelectorAll("[data-up]")) b.onclick=()=>{ if(upgrade(b.dataset.up)){ sfx("get"); re(); } };
    for(const b of sheet.querySelectorAll("[data-dev]")) b.onclick=()=>{ if(develop(b.dataset.dev)){ sfx("get"); re(); } };
    if(document.getElementById("trDev")) document.getElementById("trDev").onclick=()=>{ for(const w of order) addGem(w,3); re(); };
    if(document.getElementById("trReset")) document.getElementById("trReset").onclick=()=>{ devItems=[]; store.set("devItems",devItems); itemLv={}; store.set("itemLv",itemLv); weakFound=[]; store.set("weakFound",weakFound); re(); };
    document.getElementById("backBtn").onclick=goHome;
  }else if(kind==="noads"){                                    // 広告を消す（買い切り）。購入の復元もここ
    sheet.innerHTML=`<h1>広告を消す</h1>
      <div class="na-ic">${ICON.noads}</div>
      ${iap.adFree?`<p><b>広告なし版</b>になっています。ありがとうございます！</p>`
        :`<p>一度買うと、画面の下の広告がずっと出なくなります<br><small>動画を見てもらえるごほうびは、そのまま使えます</small></p>
          <div class="row"><button class="big" id="noAdBtn"${iap.busy||!IAP_MH?" disabled":""}>${iap.price?iap.price+" で広告を消す":"広告を消す"}</button></div>
          <p style="font-size:13px;margin:10px 0 2px">前に買ったことがある人は、こちら</p>
          <div class="row"><button id="restoreBtn"${iap.busy||!IAP_MH?" disabled":""}>購入を復元</button></div>`}
      <p id="iapMsg" style="font-size:13px;margin:4px 0;min-height:1.2em"></p>
      <button id="backBtn">とじる</button>`;
    bindIap();
    document.getElementById("backBtn").onclick=()=>{ if(noadsBack==="title") goHome(); else showMenu(noadsBack); };
  }else if(kind==="nolife"){                                   // ライフがなくなった
    lifeTick();
    const adOk=IAP_MH && iap.rewardReady;
    sheet.innerHTML=`<h1>ライフ</h1>
      <div class="nl-hearts">${Array.from({length:LIFE_MAX},(_,i)=>`<span class="${i<lives.n?"on":""}">${ICON.heart}</span>`).join("")}</div>
      <p>${lives.n>0?`あと <b>${lives.n}</b> 回遊べます`:"ライフがなくなりました"}${lives.n<LIFE_MAX?`<br>つぎの回復まで <b id="nlWait">${lifeLeftText()}</b>`:""}</p>
      <p style="font-size:13px">遊び始めるたびに1つ使い、ワールドをクリアすると1つ戻ります（20分で1つ回復）</p>
      <div class="row">${IAP_MH?`<button class="big" id="nlAd"${adOk&&lives.n<LIFE_MAX?"":" disabled"}>▶ 動画を見て +1</button>`:""}<button id="nlCoin"${coins>=LIFE_COST&&lives.n<LIFE_MAX?"":" disabled"}>${ICON.coin} ${LIFE_COST} で全回復</button>${RELEASE?"":`<button id="nlDev">全回復（開発）</button>`}</div>
      <p id="nlMsg" style="font-size:12px;min-height:1em;margin:4px 0"></p>
      <button id="backBtn">とじる</button>`;
    document.getElementById("backBtn").onclick=()=>{ if(running&&!over) { paused=true; showMenu("pause"); } else goHome(); };
    document.getElementById("nlCoin").onclick=()=>{ if(coins<LIFE_COST) return; coins-=LIFE_COST; saveShop(); addLife(LIFE_MAX); sfx("get"); showMenu("nolife"); };
    if(document.getElementById("nlDev")) document.getElementById("nlDev").onclick=()=>{ addLife(LIFE_MAX); showMenu("nolife"); };
    if(document.getElementById("nlAd")) document.getElementById("nlAd").onclick=()=>{
      document.getElementById("nlAd").disabled=true; document.getElementById("nlMsg").textContent="動画を読み込んでいます…";
      rewardCb=ok=>{ if(ok){ addLife(1); sfx("get"); } showMenu("nolife"); if(!ok){ const m=document.getElementById("nlMsg"); if(m) m.textContent="動画を最後まで見られませんでした"; } };
      iapSend("reward");
    };
  }else if(kind==="daily"){                                    // デイリーボーナス
    sheet.classList.add("wide");
    const ready=dailyReady(), cur=daily.day%7, step=dailyAdStep(), adOk=IAP_MH && (iap.adFree || iap.rewardReady);
    sheet.innerHTML=`<h1>デイリーボーナス</h1>
      <div class="dl-grid">${DAILY.map((r,i)=>`<div class="dl${i===6?" big7":""}${i<cur||(i===cur&&!ready&&false)?" got":""}${i===cur&&ready?" now":""}"><div class="dl-day">${i+1}日目</div><div class="dl-rw">${rewardHtml(r)}</div>${i<cur?`<div class="dl-ck">✓</div>`:""}</div>`).join("")}</div>
      <div class="row"><button class="big" id="dlClaim"${ready?"":" disabled"}>${ready?"受け取る":"また明日！"}</button></div>
      ${IAP_MH?`<div class="dl-ads"><div class="dl-adt">${iap.adFree?"広告なし版のおまけ（1日3回）":"▶ 動画を見てコインをもらう（1日3回）"}</div>
        ${DAILY_AD.map((c,i)=>`<div class="dl-ad${i<step?" got":""}"><span>${ICON.coin} <b>${c}</b></span><button data-i="${i}"${i===step&&adOk?"":" disabled"}>${i<step?"✓ 受け取り済み":i>step?"🔒":iap.adFree?"受け取る":"▶ 見てもらう"}</button></div>`).join("")}
        <p id="dlMsg" style="font-size:12px;margin:4px 0 0;color:var(--dim);min-height:1em">${adOk||step>=DAILY_AD.length?"":"動画の準備中です。少し待ってからもう一度ひらいてください"}</p></div>`:""}
      <p style="font-size:12px;color:var(--dim);margin:6px 0">エネルギー缶は、プレイ中に使うとエネルギーが満タンになります（「アイテム配置」でスロットに置いて使います）</p>
      <button id="backBtn">とじる</button>`;
    document.getElementById("backBtn").onclick=()=>showMenu("title");
    document.getElementById("dlClaim").onclick=()=>{ if(!dailyReady()) return; giveReward(DAILY[daily.day%7]); daily.day++; daily.last=today(); store.set("daily",daily); sfx("get"); showMenu("daily"); };
    for(const b of sheet.querySelectorAll(".dl-ad button:not([disabled])")) b.onclick=()=>{
      const give=()=>{ coins+=DAILY_AD[step]; saveShop(); daily.adDate=today(); daily.ad=step+1; store.set("daily",daily); sfx("get"); showMenu("daily"); };
      if(iap.adFree){ give(); return; }
      b.disabled=true; document.getElementById("dlMsg").textContent="動画を読み込んでいます…";
      rewardCb=ok=>{ if(ok) give(); else { const m=document.getElementById("dlMsg"); if(m) m.textContent="動画を最後まで見られませんでした"; b.disabled=false; } };
      iapSend("reward");
    };
    overlay.scrollTop=0;
  }else if(kind==="worlds"){                                   // ワールドをえらぶ: 段ごと（1段目→2段目）にならべる。どれも最初から遊べる。ランダムは最後
    sheet.classList.add("wide");
    const all=THEMES.every(t=>worldClears[t.k]);
    const vs=t=>{ const tx=weakText(t.k); return tx ? `<span class="wl-vs${weakKnown(t.k)?" ok":""}">${tx}</span>` : ""; };
    const card=k=>{ const i=THEMES.findIndex(t=>t.k===k), t=THEMES[i]; return `<button class="wl${worldClears[t.k]?" done":""}" data-w="${i}" style="--wc:${t.floor}">
        <span class="wl-ic">${t.ic}</span><span class="wl-name">${t.name}</span><span class="wl-ab">ボス: ${ABIL_DESC[t.k]}</span>${vs(t)}
        <span class="wl-stars" aria-label="スター ${starsOf(t.k).reduce((a,b)=>a+b,0)}/${STAR_N}">${starRow(t.k)}</span>
        <span class="wl-st">${gemHtml(t.k)} ${gems[t.k]||0}${worldClears[t.k]?`　クリア ${worldClears[t.k]}回`:""}</span></button>`; };
    sheet.innerHTML=`<h1>ワールドをえらぶ</h1>
      <p style="margin:0 0 8px;color:var(--dim)">どのワールドからでも遊べます。${WORLD_STAGES}つ目のステージのボスを倒すと、そのワールドの宝石と<span style="white-space:nowrap">${ICON.star}スター</span>がもらえます</p>
      ${TIER_NOTE.map((note,j)=>`<h3 class="tier-h" data-tier="${j+1}"><b>${j+1}段目</b><small>${note}</small></h3>
      <div class="wl-grid tier" data-tier="${j+1}">${Object.keys(TIER).filter(k=>TIER[k]===j+1).map(card).join("")}</div>`).join("")}
      <div class="wl-grid tier wl-extra">
        <button class="wl${all||!RELEASE?"":" lock"}" data-w="-1"${all||!RELEASE?"":" disabled"} style="--wc:200,200,255"><span class="wl-ic">${all||!RELEASE?"🎲":"🔒"}</span><span class="wl-name">ランダム</span><span class="wl-st">${all?"どのワールドになるかはお楽しみ":"全部クリアで開く"}</span></button>
      </div>
      <button class="big" id="backBtn">もどる</button>`;
    for(const b of sheet.querySelectorAll(".wl:not([disabled])")) b.onclick=()=>{ const w=+b.dataset.w; start("world", w<0 ? THEMES.length : w); };
    document.getElementById("backBtn").onclick=()=>showMenu("title");
    overlay.scrollTop=0;
  }else if(kind==="records"){                                  // プロフィール: ぷに妖精・名前・きろく
    sheet.classList.add("wide");
    const T=(ic,label,val)=>`<div class="pf-t"><div class="pf-ic">${ic}</div><div class="pf-l">${label}</div><div class="pf-v">${val}</div></div>`;
    const rows=REC_DEFS.filter(([k])=>!["maxChain","boss","stage"].includes(k)).map(([k,label,unit])=>`<div class="rec-row"><span>${label}</span><b>${bestRec[k]?bestRec[k]+unit:"—"}</b></div>`).join("");
    sheet.innerHTML=`<h1>プロフィール</h1>

// X に記録を投稿する（投稿画面を開くだけ。送信は本人が X で押す）
function shareX(withImage){
  const top=REC_DEFS.filter(([k])=>rec[k]>0 && !["maxChain","stage","maxPop"].includes(k)).slice(0,3).map(([k,label,unit])=>`${label}${rec[k]>1?"×"+rec[k]:""}`);
  const text=`グラビティ・ポップで ${score}点！\n最大${rec.maxChain}連鎖・ステージ${rec.stage}${top.length?"\n"+top.join("・"):""}${lastNew.includes("score")?"\nベスト更新！":""}${withImage?"\n#グラビティポップ #落ちものパズル #ぷに":""}`;
  const url="https://saaiya-chan.github.io/gravity-tetris/free.html";
  const tags=["グラビティポップ","落ちものパズル","ぷに"];
  const intent="https://x.com/intent/post?text="+encodeURIComponent(text)+"&url="+encodeURIComponent(url)+"&hashtags="+encodeURIComponent(tags.join(","));
  const msg=document.getElementById("xMsg");
  const say=t=>{ if(msg) msg.textContent=t; };
  const mh=window.webkit && window.webkit.messageHandlers;
  let card=null; try{ card=makeShareCard(); }catch(e){}
  if(!withImage){
    // X で投稿: 結果カードの画像をコピーしてから投稿画面を開く（投稿画面で長押し→ペーストで画像を添付できる）
    try{
      if(mh && mh.postX && card){ mh.postX.postMessage({intent, image:card.toDataURL("image/png")}); say("画像をコピーしました。X の投稿画面で長押し→「ペースト」で画像を添付できます"); return; }
      if(!mh && card && navigator.clipboard && window.ClipboardItem){
        navigator.clipboard.write([new ClipboardItem({"image/png": new Promise(r=>card.toBlob(r,"image/png"))})])
          .then(()=>say("画像をコピーしました。X の投稿画面で貼り付けて添付できます")).catch(()=>{});
      }
    }catch(e){}
  }
  try{
    if(mh && mh.shareImage && card){                                                 // iOS アプリ: 画像つきで共有メニューを開く（そこで X を選ぶ）
      shareScrim(true);                                                              // 共有メニューの後ろを暗くぼかす（半透明のメニューが見やすいように）
      mh.shareImage.postMessage({text, url, image:card.toDataURL("image/png")});
      say("共有メニューから送り先を選んでください（X は X アプリが入っていると出ます）"); return;
    }
    if(!mh && card && navigator.canShare){                                           // ブラウザ（iPad の Safari など）: 画像つきで共有
      card.toBlob(b=>{ const f=new File([b],"gravity-pop.png",{type:"image/png"});
        if(navigator.canShare({files:[f]})) navigator.share({files:[f], text:text+"\n"+url}).catch(()=>{});
        else window.open(intent,"_blank"); },"image/png");
      say("「画像を保存」で写真に保存して、X で添付できます"); return;
    }
    const h=mh && mh.openExternal;
    if(h){ h.postMessage(intent); say("X を開いています…"); }       // 古いアプリ: X の投稿画面を開く
    else{
      const w=window.open(intent,"_blank");                                          // ブラウザ: 新しいタブで
      say(w ? "X を開いています…" : "X を開けませんでした（アプリの入れ直しが必要かも）");
    }
  }catch(e){ say("X を開けませんでした: "+e.message); }
  // 開けなかったときのために、投稿する文をコピーしておく（X に貼り付けられる）
  try{ navigator.clipboard && navigator.clipboard.writeText(text+"\n"+url).then(()=>{ if(msg) msg.textContent+=" ／ 投稿文をコピーしました"; }).catch(()=>{}); }catch(e){}
}

// 新しい種類のぷにがはじめて出口から出てきたとき、アイテムをはじめて手に入れたときに、遊びを止めて1回だけ紹介する
let introSeen=new Set(store.get("introSeen",[])), introQ=[], introOpen=false, introAnim=0;
function introAdd(type,k,delay=0){
  const id=type+":"+k; if(introSeen.has(id)||introQ.some(q=>q.id===id)) return;
  introQ.push({id,type,k,at:performance.now()+delay});
}
function introStep(){
  if(introOpen||!introQ.length||!running||paused||over||popping||shuffle||slotEdit) return;
  const i=introQ.findIndex(q=>performance.now()>=q.at); if(i<0) return;
  showIntro(introQ.splice(i,1)[0]);
}
function showIntro(q){
  introOpen=true; paused=true; introSeen.add(q.id); store.set("introSeen",[...introSeen]);
  menuKind="intro"; overlay.classList.remove("hidden"); leaveHome(); sheet.classList.remove("wide","clear"); sheet.classList.add("intro");
  cancelAnimationFrame(zkAnim); cancelAnimationFrame(homeAnim);
  let pic, name, desc, head;
  if(q.type==="puni"){
    const z=ZUKAN.find(z=>z.k===q.k)||ZUKAN[0]; head="あたらしいぷに"; name=z.name; desc=z.desc; pic=`<canvas id="introCv"></canvas>`;
  }else{
    const it=SHOP.find(x=>x.k===q.k), btn=document.getElementById(ITEM_BTN[q.k]), cs=getComputedStyle(btn);
    head="あたらしいアイテム"; name=it.name; desc=it.desc+"。ボタンを押すと使える";
    pic=`<div class="in-item" style="background:${cs.backgroundImage};border-color:${cs.borderTopColor};color:${cs.color}">${btn.querySelector("svg")?.outerHTML||""}</div>`;
  }
  sheet.innerHTML=`<div class="in-head">${head}</div>
    <div class="in-pic"><div class="in-rays"></div>${pic}</div>
    <h2 class="in-name">${name}</h2><p class="in-desc">${desc}</p>
    <button class="big" id="introOk">OK</button>`;
  overlay.scrollTop=0; sfx("get");
  const c=document.getElementById("introCv");
  if(c){
    const z=ZUKAN.find(z=>z.k===q.k), dpr=Math.min(3,window.devicePixelRatio||1), W=Math.round(150*dpr); c.width=c.height=W; const g=c.getContext("2d");
    const draw=now=>{ if(!c.isConnected) return; g.clearRect(0,0,W,W);
      const fx=Object.assign({},z.fx||{}); if(fx.timer) fx.timer=30000-((now/1000)%30)*1000;
      const br=1+0.04*Math.sin(now/300), blink=((now/1000)%3.2)<0.12, yy=z.k==="balloon" ? W*(0.5+0.05*Math.sin(now/600)) : W*0.52;
      blob(g,W/2,yy,W*0.32*br,z.c,1,{face:true,blink,g:[0,1],fx,t:now}); introAnim=requestAnimationFrame(draw); };
    cancelAnimationFrame(introAnim); introAnim=requestAnimationFrame(draw);
  }
  document.getElementById("introOk").onclick=()=>{
    cancelAnimationFrame(introAnim); sheet.classList.remove("intro"); introOpen=false;
    const i=introQ.findIndex(q=>performance.now()>=q.at);
    if(i>=0) showIntro(introQ.splice(i,1)[0]); else { paused=false; hideOverlay(); }
  };
}

function gameOver(){
  if(worldDone) return;
  over=true; piece=null;
  // ゲームオーバーの演出: 出口から近い順に灰色になって、そのあと下へこぼれ落ちる
  const now=performance.now(), c=N/2;
  for(const o of balls){ o.ovDelay=Math.hypot(o.x-c,o.y-c)*70+Math.random()*60; o.ovGrey=false; o.fvy=null; }
  overFx={t:now}; shake=10; sfx("over");
  try{ boardSnap=document.createElement("canvas"); boardSnap.width=cv.width; boardSnap.height=cv.height; boardSnap.getContext("2d").drawImage(cv,0,0); }catch(e){ boardSnap=null; }
  rec.stage=level; rec.maxChain=Math.max(rec.maxChain,maxChain);
  saveRecords();
  lastCoins=coinsForGame(); coins+=lastCoins; saveShop();
  setTimeout(()=>{ if(over) showMenu("over"); },2600);
}
// 記録を残す（ベストスコアと到達ステージはエンドレスだけ）
function saveRecords(){
  lastNew=[];
  if(mode==="endless" && score>best){ if(best>0) lastNew.push("score"); best=score; store.set("bestFree",best); }
  for(const [k] of REC_DEFS){ if(k==="stage" && mode!=="endless") continue; if(rec[k]>(bestRec[k]||0)){ if(bestRec[k]) lastNew.push(k); bestRec[k]=rec[k]; } }
  store.set("bestRecFree",bestRec);
}
// ワールドクリア: ボスを倒したら、少し余韻を見せてからコインの画面へ
let clearBonus=0, clearDoubled=false;
let clearGems={k:"meadow",n:0,rainbow:0}, clearBossN=1;       // このクリアでもらった宝石 / 倒したボスの番号
// クリア画面の絵: やられてしょんぼりしたボス（つぶれて、目を回して、涙。王冠は転がり、白旗をあげている）と紙ふぶき
function drawBossDown(cv){
  const W=cv.width=640, H=cv.height=250, g=cv.getContext("2d"), t0=performance.now(), th=THEMES[worldTheme%THEMES.length]||THEMES[0];
  const conf=Array.from({length:46},(_,i)=>({x:Math.random()*W, y:Math.random()*H, v:30+Math.random()*50, a:Math.random()*6.28, c:["#ff5c8d","#ffc21f","#5ad1ff","#8fe04a","#c9a0ff","#fff"][i%6], w:6+Math.random()*7}));
  const loop=()=>{
    if(!cv.isConnected) return; introAnim=requestAnimationFrame(loop);
    const now=performance.now(), t=(now-t0)/1000; g.clearRect(0,0,W,H);
    const sky=g.createLinearGradient(0,0,0,H); sky.addColorStop(0,"#bfe9ff"); sky.addColorStop(1,"#fff7c9"); g.fillStyle=sky; g.fillRect(0,0,W,H);
    g.save(); g.translate(W/2,H*0.55); g.rotate(t*0.25); for(let i=0;i<12;i++){ g.rotate(Math.PI/6); g.fillStyle="rgba(255,255,255,.35)"; g.beginPath(); g.moveTo(0,0); g.lineTo(-38,-520); g.lineTo(38,-520); g.fill(); } g.restore();
    g.fillStyle="#9fdc7a"; g.beginPath(); g.ellipse(W/2,H+60,W*0.75,120,0,0,7); g.fill();
    const cx=W/2, r=84, cy=H-62-r*0.62+Math.sin(t*2.2)*2, INK="#2a1840";
    g.fillStyle="rgba(23,48,110,.2)"; g.beginPath(); g.ellipse(cx,H-50,r*1.25,13,0,0,7); g.fill();
    // 白旗（左手）
    g.save(); g.translate(cx-r*1.12,cy+r*0.2); g.rotate(-0.25+Math.sin(t*3)*0.08); g.strokeStyle="#8a5a2a"; g.lineWidth=6; g.lineCap="round"; g.beginPath(); g.moveTo(0,40); g.lineTo(0,-96); g.stroke();
    g.fillStyle="#fff"; g.strokeStyle="#17306e"; g.lineWidth=3; g.beginPath(); g.moveTo(0,-96); for(let i=0;i<=10;i++) g.lineTo(-i*7.2,-96+Math.sin(t*5+i*0.6)*4*(i/10)); for(let i=10;i>=0;i--) g.lineTo(-i*7.2,-52+Math.sin(t*5+i*0.6)*4*(i/10)); g.closePath(); g.fill(); g.stroke(); g.restore();
    // からだ（つぶれている）
    blob(g,cx,cy,r,4,1,{face:false,g:[0,1],w:0.3+0.02*Math.sin(t*2.2),t:now});
    const fy=cy+r*0.3;
    // ばんそうこう
    g.save(); g.translate(cx+r*0.5,fy-r*0.62); g.rotate(0.5); g.fillStyle="#ffe2c0"; g.strokeStyle=INK; g.lineWidth=2.5; for(const a of [0,Math.PI/2]){ g.save(); g.rotate(a); g.beginPath(); g.roundRect(-22,-7,44,14,6); g.fill(); g.stroke(); g.restore(); } g.restore();
    // ぐるぐるの目
    g.strokeStyle=INK; g.lineWidth=4; g.lineCap="round";
    for(const sx of [-1,1]){ g.beginPath(); for(let a=0;a<Math.PI*4.5;a+=0.25){ const rr=2+a*1.5, x=cx+sx*r*0.36+Math.cos(a*sx+t*4*sx)*rr, y=fy-r*0.12+Math.sin(a*sx+t*4*sx)*rr; a?g.lineTo(x,y):g.moveTo(x,y); } g.stroke(); }
    // 困りまゆ・ふにゃふにゃの口
    for(const sx of [-1,1]){ g.beginPath(); g.moveTo(cx+sx*r*0.16,fy-r*0.44); g.lineTo(cx+sx*r*0.52,fy-r*0.36); g.stroke(); }
    g.beginPath(); for(let i=0;i<=24;i++){ const x=cx-r*0.2+r*0.4*i/24, y=fy+r*0.28+Math.sin(i*0.9+t*6)*3.5; i?g.lineTo(x,y):g.moveTo(x,y); } g.stroke();
    // 涙（ぽろぽろ）
    for(const sx of [-1,1]) for(let i=0;i<3;i++){ const k=((t*0.9+i/3+(sx>0?0.17:0))%1), x=cx+sx*(r*0.62+k*26), y=fy-r*0.02+k*k*70; g.globalAlpha=1-k; g.fillStyle="#7fd4ff"; g.strokeStyle="#2a7fd0"; g.lineWidth=2; g.beginPath(); g.moveTo(x,y-9); g.quadraticCurveTo(x+8,y+3,x,y+7); g.quadraticCurveTo(x-8,y+3,x,y-9); g.fill(); g.stroke(); } g.globalAlpha=1;
    // 頭の上の星（くらくら）
    for(let i=0;i<3;i++){ const a=t*2.4+i*2.094, x=cx+Math.cos(a)*r*0.62, y=cy-r*0.72+Math.sin(a)*10; g.fillStyle="#ffc21f"; g.strokeStyle="#17306e"; g.lineWidth=2; g.beginPath(); for(let j=0;j<10;j++){ const rr=j%2?5:11, b=j*Math.PI/5-Math.PI/2; g.lineTo(x+Math.cos(b)*rr,y+Math.sin(b)*rr); } g.closePath(); g.fill(); g.stroke(); }
    // 転がった王冠（右の地面）
    g.save(); g.translate(cx+r*1.55,H-60); g.rotate(1.1+Math.sin(t*2)*0.05); g.fillStyle="#ffc21f"; g.strokeStyle="#17306e"; g.lineWidth=3; g.lineJoin="round";
    g.beginPath(); g.moveTo(-30,14); g.lineTo(-34,-24); g.lineTo(-15,-6); g.lineTo(0,-32); g.lineTo(15,-6); g.lineTo(34,-24); g.lineTo(30,14); g.closePath(); g.fill(); g.stroke(); g.fillStyle="#ff4d6d"; g.beginPath(); g.arc(0,2,5,0,7); g.fill(); g.restore();
    // 紙ふぶき
    for(const c of conf){ const y=(c.y+t*c.v)%(H+20)-10, x=c.x+Math.sin(t*2+c.a)*14; g.save(); g.translate(x,y); g.rotate(c.a+t*3); g.fillStyle=c.c; g.fillRect(-c.w/2,-c.w/4,c.w,c.w/2); g.restore(); }
  };
  loop();
}
function worldClear(){
  worldDone=true; piece=null; balls=balls.filter(o=>!o.live); stopLeft=0;
  setTimeout(()=>{
    if(!worldDone||!running) return;
    running=false; rec.stage=level; rec.maxChain=Math.max(rec.maxChain,maxChain); saveRecords();
    clearBonus=50+10*worldNo; lastCoins=coinsForGame()+clearBonus; clearDoubled=false;
    coins+=lastCoins;
    if(IAP_MH && iap.adFree){ coins+=lastCoins; clearDoubled=true; }       // 広告なし版は、動画なしでいつも2倍
    addLife(1);                                                // クリアしたらライフが1つ戻る
    clearBossN=Math.max(1,Math.floor(level/BOSS_EVERY));
    { const k=lastBossK, n=1+(Math.random()*3|0), x2=(IAP_MH && iap.adFree)?2:1;              // 宝石: 1〜3個（広告なし版はいつも2倍）。王冠をこわして倒すと、どの宝石にもなる虹の宝石
      clearGems={k, n:n*x2, base:n, rainbow:lastCrownBroken?1:0}; addGem(k,n*x2); if(clearGems.rainbow) addGem("rainbow",1);
      worldClears[k]=(worldClears[k]||0)+1; store.set("worldClears",worldClears);
      awardStars(k, lastCrownBroken, canUsed); }
    worldsCleared=THEMES.filter(t=>worldClears[t.k]).length; store.set("worldsCleared",worldsCleared);
    saveShop(); sfx("praise"); showMenu("clear");
  }, 2600);
}
