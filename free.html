<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>グラビティ・ポップ フリー</title>
<meta property="og:title" content="グラビティ・ポップ">
<meta property="og:description" content="iPad を傾けて遊ぶ、物理で転がる落ちものパズル。同じ色のぷにを5つくっつけて消そう！">
<meta property="og:image" content="https://saaiya-chan.github.io/gravity-tetris/og.png">
<meta property="og:url" content="https://saaiya-chan.github.io/gravity-tetris/free.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://saaiya-chan.github.io/gravity-tetris/og.png">
<style>
  :root{
    --bg:#0e1116; --panel:#171b23; --line:#262c38; --text:#e8ecf3; --dim:#8a93a6; --accent:#ffcf5a;
    --side: clamp(170px, 20vw, 240px);                     /* 左右の列幅 */
    --b: clamp(46px, min(calc((var(--side) - 28px)/3.25), calc(13dvh)), 84px);   /* 操作ボタンの大きさ */
    --ad: 0px;                                                                   /* 下のバナー広告の高さ（アプリが教えてくれる） */
    --s: min(calc(100dvh - max(10px,env(safe-area-inset-top)) - max(10px,env(safe-area-inset-bottom)) - 38px - var(--ad)), calc(100vw - 2*var(--side) - 44px));          /* 盤面の一辺（上下に、金の枠と影のぶん 38px の余白を残す。広告の帯に枠がかからないように） */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden;touch-action:none;overscroll-behavior:none}
  body{
    display:grid; justify-content:center; align-content:stretch; gap:0 12px;
    padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) calc(max(10px,env(safe-area-inset-bottom)) + var(--ad)) max(10px,env(safe-area-inset-left));
    grid-template-columns: var(--side) var(--s) var(--side);
    grid-template-rows: minmax(0,1fr);                      /* 左右の列は、上に情報・下にボタンを同じ1マスの中で上下に寄せる（片方が高くても全体が画面からはみ出さない） */
    height:100dvh;
    grid-template-areas: "left stage right";
    background: radial-gradient(120% 80% at 50% 40%, #151a24 0%, var(--bg) 70%);
  }
  #hudL{grid-area:left;justify-self:start;align-self:start}
  #hudR{grid-area:right;justify-self:end;align-self:start;display:flex;gap:10px;align-items:center}
  #stage{grid-area:stage;width:var(--s);height:var(--s);position:relative;align-self:center}
  #ctrlL{grid-area:left;position:relative;z-index:1;justify-self:center;align-self:end;margin-bottom:6px}
  #ctrlR{grid-area:right;position:relative;z-index:1;justify-self:center;align-self:end;margin-bottom:6px}
  #turnHint{display:none}
  @media (orientation:portrait){
    body>*:not(#turnHint):not(#overlay){display:none!important}
    #turnHint{display:flex;position:fixed;inset:0;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--dim);font-size:17px;z-index:20}
    #turnHint svg{animation:turn 2.2s ease-in-out infinite}
    @keyframes turn{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
  }
  #stage,#board{touch-action:none}
  #board{width:100%;height:100%;display:block;border-radius:14px;box-shadow:0 0 0 1px #232a37,0 18px 40px rgba(0,0,0,.45)}

  /* HUD */
  .stat{display:flex;align-items:baseline;gap:8px}
  .stat .label{font-size:11px;letter-spacing:.16em;color:var(--dim)}
  #score{font-size:clamp(26px,4.2vmin,40px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  #lines{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
  #status{font-size:10.5px;color:var(--dim);margin-top:6px}
  .nextbox{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:12px;padding:6px 8px 4px;text-align:center}
  .nextbox .label{font-size:10px;letter-spacing:.16em;color:var(--dim)}
  #next{width:56px;height:56px;display:block}
  .iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;padding:0;
    background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--dim)}
  .iconbtn svg{width:18px;height:18px}

  /* アイテム */
  .item{position:relative;width:48px;height:48px;border-radius:14px;padding:0;display:grid;place-items:center;
    background:linear-gradient(180deg,#24405e,#182a40);border:1px solid #2f5a85;color:#bfe3ff;
    box-shadow:0 3px 0 #0a121c, inset 0 1px 0 rgba(255,255,255,.12);touch-action:none}
  .item#itemJump{background:linear-gradient(180deg,#1f4a33,#143022);border-color:#3f9a6a;color:#d4ffe6}
  .item#itemShuf{background:linear-gradient(180deg,#4a2b5e,#2f1b40);border-color:#7a4a99;color:#f0d6ff}
  .item#itemMag{background:linear-gradient(180deg,#5e2b34,#401b22);border-color:#b04a5c;color:#ffd6dc}
  .item.active{box-shadow:0 0 0 3px #ffcf5a, 0 3px 0 #0a121c}
  .item svg{width:26px;height:26px}
  /* アイテムを取ったときの演出 */
  .itemGet{position:fixed;z-index:8;pointer-events:none;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:10px}
  .itemGet .ig-ic{border-radius:28%;border:3px solid;display:grid;place-items:center;box-shadow:0 0 0 4px rgba(255,255,255,.85),0 0 40px rgba(255,220,120,.9),0 10px 24px rgba(0,0,0,.5)}
  .itemGet .ig-ic svg{width:58%;height:58%}
  .itemGet .ig-tx{font-weight:900;font-size:clamp(20px,3.4vw,34px);color:#fff;white-space:nowrap;text-shadow:0 0 6px #000,0 2px 0 #000,0 0 14px rgba(0,0,0,.8)}
  .itemGet .ig-tx b{color:#ffcf5a}
  .itemGet .ig-tx{background:rgba(8,10,14,.82);padding:4px 18px;border-radius:999px}
  .itemGet .ig-rays{position:absolute;left:50%;top:38%;width:260%;aspect-ratio:1;border-radius:50%;z-index:-1;
    background:repeating-conic-gradient(rgba(255,225,130,.55) 0 9deg, transparent 9deg 30deg);
    -webkit-mask:radial-gradient(circle, #000 0 30%, transparent 68%);mask:radial-gradient(circle, #000 0 30%, transparent 68%)}
  /* 次のステージまでの進み具合 */
  #stageCard .sc-prog{height:6px;border-radius:3px;background:rgba(255,255,255,.14);margin-top:7px;overflow:hidden}
  #stageCard .sc-prog i{display:block;height:100%;width:0;background:#ffcf5a;border-radius:3px;transition:width .3s}
  #stageCard .sc-next{font-size:12px;color:var(--dim);margin-top:3px}
  /* 空いているスロットは「＋」の丸で表示（押すとアイテムを選べる） */
  .slotEmpty{position:absolute;border-radius:50%;background:rgba(10,14,22,.45);border:2px solid rgba(255,255,255,.28);
    color:rgba(255,255,255,.75);display:grid;place-items:center;padding:0;box-shadow:inset 0 0 12px rgba(0,0,0,.35);touch-action:manipulation}
  .slotEmpty svg{width:42%;height:42%}
  .slotEmpty:active{transform:scale(.94)}
  .item .rm{display:none}
  body.slot-edit .item[data-slot] .rm{display:grid;place-items:center;position:absolute;top:-9px;left:-9px;width:26px;height:26px;border-radius:50%;background:#ff4d6d;color:#fff;font-size:14px;font-weight:900;box-shadow:0 2px 4px rgba(0,0,0,.4);z-index:3}
  body.slot-edit .item[data-slot]{animation:wiggle .5s ease-in-out infinite alternate}
  body.slot-edit .item .badge{display:none}
  body.slot-edit .slotEmpty{border-style:dashed;border-color:rgba(255,207,90,.7);color:#ffcf5a}
  @keyframes wiggle{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
  .drop-hover{outline:4px solid #ffcf5a;outline-offset:3px}
  .item.dragging{opacity:.35}
  #slotBar{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;width:min(520px,60vw);background:rgba(14,18,28,.98);border:1px solid #3a4458;border-radius:18px;padding:14px 16px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.55)}
  #slotBar .sb-title{font-size:20px;font-weight:900}
  #slotBar .sb-help{font-size:13px;color:var(--dim);margin:6px 0 10px;line-height:1.5}
  #slotBar .sb-tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:64px;padding:8px;border-radius:12px;background:rgba(255,255,255,.05);border:1px dashed #3a4458;margin-bottom:10px}
  #slotBar .sb-empty{font-size:12px;color:var(--dim);align-self:center}
  .tray-item,.slot-ghost{width:72px;height:72px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:#24405e;border:1px solid #3f5a85;color:#fff;font-size:11px;font-weight:800;touch-action:none;cursor:grab}
  .tray-item svg,.slot-ghost svg{width:28px;height:28px}
  .slot-ghost{position:fixed;z-index:60;pointer-events:none;box-shadow:0 10px 24px rgba(0,0,0,.5);transform:scale(1.08)}
  #slotPick{position:fixed;z-index:40;background:rgba(16,20,30,.96);border:1px solid #3a4458;border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:6px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  #slotPick button{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;font-size:14px;font-weight:800;color:#fff;background:#232a3a;border:1px solid #3a4458;min-width:150px}
  #slotPick button svg{width:22px;height:22px}
  #slotPick .pk-n{margin-left:auto;color:#ffcf5a}
  #slotPick .pk-t{font-size:12px;color:var(--dim);padding:2px 4px}
  .slot-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin:12px auto;max-width:520px;text-align:left}
  .slot-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--text)}
  .slot-row select{font-size:15px;padding:6px 8px;border-radius:10px;background:#1a1f2b;color:var(--text);border:1px solid #3a4458}
  #ctrlL .item{position:absolute}
  body.lay-ringL .item .lbl{display:block;font-size:12px}
  .item .lbl{display:none;font-size:10px;font-weight:800;line-height:1;letter-spacing:.02em;white-space:nowrap}
  .item#itemHand{background:linear-gradient(180deg,#0f6a66,#0a4443);border-color:#3ad0c4;color:#d4fff9}
  .shop-ic#shopIc_hand{background:linear-gradient(180deg,#0f6a66,#0a4443);border-color:#3ad0c4;color:#d4fff9}
  .item#itemBoost{background:linear-gradient(180deg,#6a3a12,#43240a);border-color:#d0802a;color:#ffe2c0}
  .shop-ic#shopIc_boost{background:linear-gradient(180deg,#6a3a12,#43240a);border-color:#d0802a;color:#ffe2c0}
  /* ステージの特徴 */
  #stageCard{margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);max-width:calc(var(--side) - 8px)}
  #stageCard .sc-name{font-size:19px;font-weight:900;color:var(--text)}
  #stageCard .sc-pts{margin:6px 0 0;padding-left:1.1em;font-size:14.5px;line-height:1.5;color:#dfe6f2}
  #stageCard .sc-pts li::marker{color:#ffcf5a}
  #stageCard .sc-fx{font-size:14px;font-weight:800;color:#ffcf5a;margin-top:5px;line-height:1.45}
  #stageCard .sc-fx:empty{display:none}
  #stageCard[data-theme=desert]{background:rgba(255,176,80,.1);border-color:rgba(255,176,80,.3)}
  #stageCard[data-theme=ice]{background:rgba(150,220,255,.1);border-color:rgba(150,220,255,.3)}
  #stageCard[data-theme=fire]{background:rgba(255,118,64,.1);border-color:rgba(255,118,64,.3)}
  #stageCard[data-theme=popcorn]{background:rgba(255,236,170,.1);border-color:rgba(255,236,170,.3)}
  #stageCard[data-theme=sticky]{background:rgba(255,190,60,.1);border-color:rgba(255,190,60,.3)}
  #stageCard[data-theme=space]{background:rgba(180,150,255,.1);border-color:rgba(180,150,255,.3)}
  #stageCard[data-theme=meadow]{background:rgba(140,230,150,.08);border-color:rgba(140,230,150,.25)}
  /* レイアウト: 大きいリング（アイコン＋名前） */
  body.lay-ringL .rotring .item{flex-direction:column;gap:2px;display:flex;align-items:center;justify-content:center}
  body.lay-ringL .rotring .item .lbl{display:block;font-size:9.5px}
  body.lay-ringL .rotring .item svg{width:46%;height:46%}
  /* レイアウト: タイル（名前つきの大きなボタンを回転ボタンの上に並べる） */
  body.lay-tiles #ctrlR{display:grid!important;grid-template-columns:1fr;gap:7px;width:calc(var(--side) - 4px)!important;height:auto!important;align-items:end;justify-self:end!important}
  body.lay-tiles #ctrlR .item{position:static!important;width:auto!important;height:min(52px,calc(var(--b)*0.74))!important;display:flex;flex-direction:row;gap:8px;align-items:center;justify-content:flex-start;padding:0 10px;border-radius:14px}
  body.lay-tiles #ctrlR .item svg{width:24px!important;height:24px!important;flex:none}
  body.lay-tiles #ctrlR .item .lbl{display:block;font-size:14px}
  body.lay-tiles #ctrlR .item .badge{position:static!important;margin-left:auto;order:3;flex:none}
  body.lay-tiles #ctrlR .item .lbl{order:2}
  body.lay-tiles #ctrlR #rotBtn{position:static!important;grid-column:1 / -1;justify-self:end;order:99;margin-top:4px}
  body.lay-tiles #ctrlR .item{min-width:0}
  @media (max-height:500px){                                     /* iPhone の横向きなど、背が低い画面 */
   
    #stageCard{padding:4px 8px;margin-top:4px} #stageCard .sc-name{font-size:14px} #stageCard .sc-pts{font-size:11.5px;line-height:1.35;margin-top:2px} #stageCard .sc-fx{font-size:11.5px}
    body.lay-tiles #ctrlR{gap:4px}
    body.lay-tiles #ctrlR .item{height:29px!important;border-radius:10px}
    body.lay-tiles #ctrlR .item svg{width:18px!important;height:18px!important}
    body.lay-tiles #ctrlR .item .lbl{font-size:12px}
  }
  body.lay-tiles #ctrlR .item .lbl{overflow:hidden;text-overflow:ellipsis}
  .item.down{transform:translateY(2px);box-shadow:0 1px 0 #0a121c}
  .item.empty{opacity:.35;filter:grayscale(.6)}
  .item.empty.active{opacity:1;filter:none}
  .item.active{box-shadow:0 0 0 2px #7fd0ff, 0 0 14px rgba(127,208,255,.7)}
  .badge{position:absolute;right:-6px;top:-6px;min-width:20px;height:20px;border-radius:10px;padding:0 5px;
    background:#ffcf5a;color:#2a1f05;font-size:12px;font-weight:800;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.4)}
  /* 操作ボタン */
  .pad3{display:flex;gap:calc(var(--b)*0.12);align-items:flex-end}
  .pad3 .bw:nth-child(2){margin-bottom:calc(var(--b)*0.42)}          /* 真ん中の「落とす」は少し上 */
  /* 右: 回転ボタンのまわりにアイテム（右手の親指から届く左上側に並べる） */
  .rotring{--ib:max(calc(var(--b)*0.7),40px);--rr:calc(var(--ib)*2.4);position:relative;
    width:calc(var(--b)*0.7 + var(--ib)*0.5 + var(--rr));height:calc(var(--b)*0.7 + var(--ib)*0.5 + var(--rr))}
  .rotring #rotBtn{position:absolute;right:calc(var(--b)*0.12);bottom:calc(var(--b)*0.12)}
  .rotring .item{position:absolute;width:var(--ib);height:var(--ib);border-radius:32%}
  .rotring .item svg{width:52%;height:52%}
  /* 回転ボタンの中心から同じ距離の円弧（左・左上・上寄り・上） */
  .rotring #itemStop{right:calc(var(--b)*0.7 - var(--ib)*0.5 + var(--rr));bottom:calc(var(--b)*0.7 - var(--ib)*0.5)}
  .rotring #itemMag{right:calc(var(--b)*0.7 - var(--ib)*0.5 + var(--rr)*0.866);bottom:calc(var(--b)*0.7 - var(--ib)*0.5 + var(--rr)*0.5)}
  .rotring #itemShuf{right:calc(var(--b)*0.7 - var(--ib)*0.5 + var(--rr)*0.5);bottom:calc(var(--b)*0.7 - var(--ib)*0.5 + var(--rr)*0.866)}
  .rotring #itemJump{right:calc(var(--b)*0.7 - var(--ib)*0.5);bottom:calc(var(--b)*0.7 - var(--ib)*0.5 + var(--rr))}
  .pad3 .cap{display:none}
  .bw{display:flex;flex-direction:column;align-items:center;gap:9px}
  .cap{font-size:10.5px;letter-spacing:.2em;color:#5d6577}
  button{font:inherit;color:var(--text);cursor:pointer}
  .pbtn{
    width:var(--b);height:var(--b);border-radius:50%;padding:0;display:grid;place-items:center;
    color:#dfe5f1;
    background:linear-gradient(180deg,#2b3244 0%,#1c212d 100%);
    border:1px solid #3a4359;
    box-shadow:0 5px 0 #0a0c11, 0 10px 18px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.09);
    transition:transform .06s, box-shadow .06s, filter .06s;
    touch-action:none;
  }
  .pbtn.down{transform:translateY(4px);box-shadow:0 1px 0 #0a0c11, 0 3px 8px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);filter:brightness(1.15)}
  .pbtn svg{width:44%;height:44%;overflow:visible}
  .pbtn .icon{transition:transform .25s cubic-bezier(.3,1.5,.5,1);transform-origin:50% 50%}
  .pbtn.rot{width:calc(var(--b)*1.16);height:calc(var(--b)*1.16);
    background:linear-gradient(180deg,#43357a 0%,#2b2252 100%);border-color:#6150a6;color:#eee9ff;
    box-shadow:0 5px 0 #150f2c, 0 10px 18px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.14)}
  .pbtn.rot.down{box-shadow:0 1px 0 #150f2c, 0 3px 8px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.1)}
  .pbtn.drop{background:linear-gradient(180deg,#ffd978 0%,#e8ad33 100%);border-color:#ffe29a;color:#2a1f05;
    box-shadow:0 5px 0 #6b4c0c, 0 10px 18px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.45)}
  .pbtn.drop.down{box-shadow:0 1px 0 #6b4c0c, 0 3px 8px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.35)}

  #overlay{position:fixed;inset:0;bottom:var(--ad);box-shadow:0 var(--ad) 0 rgba(8,10,14,.86);background:rgba(8,10,14,.86);display:flex;z-index:10;padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
  #overlay .sheet{margin:auto}
  @media (max-height:500px){ .sheet{padding:16px} .sheet h1{font-size:22px} ul.help{font-size:12px;line-height:1.6;margin:6px 0} .sheet p{font-size:13px;margin:4px 0} }
  #overlay.hidden{display:none}
  .sheet{max-width:460px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;text-align:center}
  .sheet h1{margin:0 0 4px;font-size:28px}
  /* はじめて出てきたものの紹介カード */
  .sheet.intro{max-width:420px;padding:0 24px 20px;background:linear-gradient(180deg,#27345c,#161b2c);border:2px solid #ffcf5a;overflow:visible;margin-top:26px}
  .in-head{display:inline-block;transform:translateY(-50%);background:linear-gradient(180deg,#ffe08a,#ffb93c);color:#3a2600;font-weight:900;font-size:19px;padding:8px 30px;border-radius:999px;box-shadow:0 4px 0 #a87400;letter-spacing:.06em}
  .in-pic{position:relative;height:170px;border-radius:18px;background:linear-gradient(180deg,rgba(150,200,255,.22),rgba(255,236,170,.16));display:grid;place-items:center;overflow:hidden;margin-top:-6px}
  .in-pic canvas{width:150px;height:150px;position:relative}
  .in-rays{position:absolute;left:50%;top:50%;width:420px;height:420px;margin:-210px;border-radius:50%;background:repeating-conic-gradient(rgba(255,240,180,.22) 0 10deg, transparent 10deg 30deg);animation:inSpin 14s linear infinite;
    -webkit-mask:radial-gradient(circle,#000 0 25%,transparent 62%);mask:radial-gradient(circle,#000 0 25%,transparent 62%)}
  @keyframes inSpin{to{transform:rotate(360deg)}}
  .in-item{position:relative;width:108px;height:108px;border-radius:28%;border:3px solid;display:grid;place-items:center;box-shadow:0 0 0 4px rgba(255,255,255,.85),0 8px 20px rgba(0,0,0,.45)}
  .in-item svg{width:58%;height:58%}
  .in-name{margin:14px 0 4px;font-size:26px;font-weight:900}
  .in-desc{margin:0 0 16px;font-size:16px;line-height:1.6;color:var(--text)}
  .sheet.intro button.big{min-width:150px;font-size:22px;padding:12px 30px;background:linear-gradient(180deg,#b6f36a,#6fcf3a);color:#143200;box-shadow:0 4px 0 #3c8a17}

  :root{ --ink:#17306e; --panel:#2f7be6; --line:#9fd0ff; --text:#ffffff; --dim:#e2f0ff; --accent:#ffd23c;
    --ol: 0 2px 0 var(--ink); }
  html,body,button,input{font-family:"GP",-apple-system,"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif}
  .ic{width:1.15em;height:1.15em;vertical-align:-.22em;display:inline-block;flex:none}
  /* ふち取り文字 */
  .ol, .sheet h1, .sheet .big, .home-title, .in-name, .in-head{ -webkit-text-stroke:.22em var(--ink); paint-order:stroke fill; text-shadow:0 .12em 0 var(--ink); }
  /* 小画面の暗幕と枠 */
  #overlay{background:rgba(16,40,110,.72);box-shadow:0 var(--ad) 0 rgba(16,40,110,.72);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  .sheet{position:relative;background:linear-gradient(180deg,#63bcff,#2f7be6);border:4px solid #ffd76a;border-radius:28px;box-shadow:0 0 0 3px var(--ink),0 10px 0 3px rgba(23,48,110,.55),0 24px 40px rgba(0,0,30,.35);
    padding:16px 22px 20px;color:#fff;margin-top:34px!important;animation:popIn .32s cubic-bezier(.2,1.5,.4,1)}
  @keyframes popIn{from{transform:scale(.82);opacity:0}to{transform:none;opacity:1}}
  .sheet p, .sheet li{color:#fff;text-shadow:0 1px 0 rgba(23,48,110,.6)}
  .sheet a{color:#fff6c2}
  /* リボンの見出し */
  .sheet h1, .in-head{display:table;margin:-40px auto 12px;padding:7px 34px 9px;font-size:24px;font-weight:900;color:#fff;letter-spacing:.04em;white-space:nowrap;
    background:linear-gradient(180deg,#58a9ff,#2a66d8);border:3px solid #ffd76a;border-radius:16px;box-shadow:0 0 0 3px var(--ink),0 6px 0 3px rgba(23,48,110,.6);transform:none;position:relative}
  .sheet h1::before,.sheet h1::after,.in-head::before,.in-head::after{content:"";position:absolute;top:10px;width:22px;height:70%;background:#1f56b8;border:3px solid #ffd76a;box-shadow:0 0 0 3px var(--ink);z-index:-1}
  .sheet h1::before,.in-head::before{left:-20px;border-radius:8px 0 0 8px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,35% 50%)}
  .sheet h1::after,.in-head::after{right:-20px;border-radius:0 8px 8px 0;clip-path:polygon(0 0,100% 0,65% 50%,100% 100%,0 100%)}
  .sheet h1 + h1, .sheet h1[style]{margin-top:22px!important}
  /* ✕ */
  .x-close{position:absolute;right:-14px;top:-18px;width:44px;height:44px;border-radius:50%;padding:0!important;margin:0!important;display:grid;place-items:center;z-index:3;
    background:linear-gradient(180deg,#6fb6ff,#2a66d8)!important;border:3px solid #fff!important;box-shadow:0 0 0 3px var(--ink),0 4px 0 3px rgba(23,48,110,.6)!important}
  .x-close .ic{width:22px;height:22px;vertical-align:0}
  .x-close:active{transform:translateY(3px)}
  /* ボタン: 青＝ふつう、緑＝進む、赤＝やめる。つやと厚み */
  .sheet button, #slotBar button{position:relative;font-weight:900;color:#fff;border-radius:14px;padding:9px 16px;border:2.5px solid #e6f4ff;
    background:linear-gradient(180deg,#9ad6ff 0%,#4f9cf5 48%,#3a84ea 52%,#3a84ea 100%);box-shadow:0 0 0 2.5px var(--ink),0 5px 0 2.5px #1c4aa6;text-shadow:0 1.5px 0 var(--ink);transition:transform .06s}

// 重力の向きの単位ベクトル（画面座標: x右, y下, z画面に垂直）。センサーがないときは「下に35°傾けた」ことにする

function drawDeco(g,k,cx,cy,r){

    g.translate(X(0.5),Y(-0.82)); g.rotate(0.35); g.translate(-X(0.5),-Y(-0.82));

    g.beginPath(); g.arc(X(0),Y(-0.68),r*0.62,Math.PI,0); g.closePath(); g.fillStyle="#3aa0ff"; g.fill(); g.stroke();

    E(0,-1.3,0.09,0.09,"#fff");
  }else if(k==="crown"){

    E(0,-0.7,1.02,0.2,"#6a3fc0"); P([[-0.5,-0.86],[0.5,-0.86],[0.47,-0.98],[-0.46,-0.98]],"#ff9a2e");
    g.lineWidth=r*0.05; P([[-0.1,-0.84],[0.1,-0.84],[0.1,-1],[-0.1,-1]],"#ffe27a");
  }else if(k==="santa"){
    g.beginPath(); g.moveTo(X(-0.6),Y(-0.72)); g.quadraticCurveTo(X(-0.3),Y(-1.6),X(0.5),Y(-1.45)); g.quadraticCurveTo(X(0.95),Y(-1.3),X(0.92),Y(-0.9)); g.quadraticCurveTo(X(0.6),Y(-1.15),X(0.6),Y(-0.72)); g.closePath(); g.fillStyle="#ff3b4e"; g.fill(); g.stroke();
    g.beginPath(); g.roundRect(X(-0.72),Y(-0.84),r*1.44,r*0.26,r*0.13); g.fillStyle="#fff"; g.fill(); g.stroke(); E(0.92,-0.86,0.16,0.16,"#fff");
  }else if(k==="straw"){
    g.beginPath(); g.arc(X(0),Y(-0.72),r*0.56,Math.PI,0); g.closePath(); g.fillStyle="#ffe08a"; g.fill(); g.stroke();
    E(0,-0.7,1.1,0.2,"#ffd25a"); P([[-0.55,-0.8],[0.55,-0.8],[0.53,-0.94],[-0.53,-0.94]],"#ff4d6d");

// ===== ライフ =====
// 遊び始めるたびに1つ使う（もう一度・最初から も同じ）。ワールドをクリアすると1つ戻る。最大5つ、20分で1つ回復。
// なくなったら: 待つ / 動画を見て +1 / コイン100枚で全回復
const LIFE_MAX=5, LIFE_MS=20*60*1000, LIFE_COST=100;
let lives=store.get("lives",{n:LIFE_MAX,t:Date.now()});
function lifeTick(){
  const now=Date.now();
  if(lives.n>=LIFE_MAX){ lives.n=LIFE_MAX; lives.t=now; return; }
  if(!(lives.t<=now)) lives.t=now;                              // 時計を戻されたとき
  let ch=false; while(lives.n<LIFE_MAX && now-lives.t>=LIFE_MS){ lives.n++; lives.t+=LIFE_MS; ch=true; }
  if(lives.n>=LIFE_MAX) lives.t=now;
  if(ch) store.set("lives",lives);
}
function lifeLeftText(){ lifeTick(); if(lives.n>=LIFE_MAX) return "MAX"; const ms=Math.max(0,LIFE_MS-(Date.now()-lives.t)), m=Math.floor(ms/60000), sc=Math.floor(ms%60000/1000); return `${m}:${String(sc).padStart(2,"0")}`; }
function useLife(){ lifeTick(); if(lives.n<=0) return false; if(lives.n>=LIFE_MAX) lives.t=Date.now(); lives.n--; store.set("lives",lives); return true; }
function addLife(n){ lifeTick(); lives.n=Math.min(LIFE_MAX,lives.n+n); if(lives.n>=LIFE_MAX) lives.t=Date.now(); store.set("lives",lives); }
setInterval(()=>{ const el=document.getElementById("lifeTxt"); if(el){ const n=document.getElementById("lifeN"); el.textContent=lifeLeftText(); if(n) n.textContent=lives.n; }
  const w=document.getElementById("nlWait"); if(w){ w.textContent=lifeLeftText(); if(lives.n>0 && menuKind==="nolife") showMenu("nolife"); } },1000);

// ===== 遊び方は2つ =====
// ワールド: 1つのワールド（草原・砂漠…）を5面つづけて遊ぶ。5面目にボスが出て、倒すとワールドクリア。途中でゲームオーバーになるとワールドの最初から。

function randomTheme(){ let i; do{ i=Math.random()*THEMES.length|0; }while(i===worldTheme && THEMES.length>1); return i; }

// ===== 盤面の形（ステージごとに 四角 → 丸 → 六角形 → 八角形 …） =====
const ARENAS=[{k:"square",name:"四角"},{k:"circle",name:"丸"},{k:"hex",name:"六角形"},{k:"oct",name:"八角形"},{k:"square",name:"広い四角（ぷにが小さく）",n:19}];
// 盤面の大きさをステージに合わせる。広くなるときは粒を真ん中へ寄せたまま広げ、狭くなるときにはみ出した粒はボーナスで消える
function applyArenaSize(){
  const want=arena().n||N0; if(want===N) return;
  const dx=(want-N)/2; N=want;
  for(const o of balls){ o.x+=dx; o.y+=dx; }
  if(dx<0){
    const out=balls.filter(o=>!o.live && (o.x<R||o.y<R||o.x>N-R||o.y>N-R));
    if(out.length){ for(const o of out) burst(o.x-0.5,o.y-0.5,o.c===GARBAGE?5:o.c);
      balls=balls.filter(o=>!out.includes(o)); dropBonds(o=>!out.includes(o)); score+=out.length*20;
      praise("はみ出しボーナス！", `${out.length}個  +${out.length*20}点`, "#9dffb0"); }
    for(const o of balls){ o.x=Math.min(N-R,Math.max(R,o.x)); o.y=Math.min(N-R,Math.max(R,o.y)); }
  }
  if(piece) for(const o of piece.balls){ o.x=Math.min(N-R,Math.max(R,o.x)); o.y=Math.min(N-R,Math.max(R,o.y)); }
  shake=Math.max(shake,8);
}
function arena(){ return ARENAS[((level||1)-1)%ARENAS.length]; }
// 多角形: 底が平らになる向き。各辺の外向きの法線と、中心から辺までの距離
function arenaEdges(k){
  const c=N/2;
  if(k==="hex"){ const a=c*Math.cos(Math.PI/6); return [0,1,2,3,4,5].map(i=>{ const t=Math.PI/2+i*Math.PI/3; return [Math.cos(t),Math.sin(t),a]; }); }
  if(k==="oct"){ return [0,1,2,3,4,5,6,7].map(i=>{ const t=Math.PI/2+i*Math.PI/4; return [Math.cos(t),Math.sin(t),c]; }); }
  return null;
}
// 粒を盤面の内側に戻す。めり込んでいたら外向きの法線を返す
function arenaPush(o){
  const A=arena().k; if(A==="square") return null;
  const c=N/2; let hit=null;
  if(A==="circle"){
    const dx=o.x-c, dy=o.y-c, d=Math.hypot(dx,dy), lim=c-R;
    if(d>lim){ const nx=dx/d, ny=dy/d; o.x=c+nx*lim; o.y=c+ny*lim; hit=[nx,ny]; }
    return hit;
  }
  for(const [nx,ny,a] of arenaEdges(A)){
    const d=(o.x-c)*nx+(o.y-c)*ny, lim=a-R;
    if(d>lim){ o.x-=nx*(d-lim); o.y-=ny*(d-lim); hit=[nx,ny]; }
  }
  return hit;
}
// 壁に触れているか（触れていれば外向きの法線）。位置は動かさない
function arenaContact(o){
  const A=arena().k, c=N/2, eps=0.002;
  if(A==="circle"){ const dx=o.x-c, dy=o.y-c, d=Math.hypot(dx,dy); return d>=c-R-eps ? [dx/d,dy/d] : null; }
  let hit=null; for(const [nx,ny,a] of arenaEdges(A)){ if((o.x-c)*nx+(o.y-c)*ny >= a-R-eps) hit=[nx,ny]; } return hit;
}
function insideArena(x,y,m=0){
  const A=arena().k, c=N/2; if(A==="square") return true;
  if(A==="circle") return Math.hypot(x-c,y-c) <= c-R+m;
  return arenaEdges(A).every(([nx,ny,a])=>(x-c)*nx+(y-c)*ny <= a-R+m);
}
function arenaPathAppend(g,s){ arenaPath(g,s,true); }
function arenaPath(g,s,append=false){
  const A=arena().k, c=N/2*s;
  if(!append) g.beginPath();
  if(A==="circle"){ g.moveTo(c*2,c); g.arc(c,c,c,0,Math.PI*2); return; }
  const E=arenaEdges(A); if(!E){ g.rect(0,0,N*s,N*s); return; }
  // 隣り合う2辺の交点が角
  for(let i=0;i<E.length;i++){ const [n1x,n1y,a1]=E[i], [n2x,n2y,a2]=E[(i+1)%E.length];
    const det=n1x*n2y-n1y*n2x, x=(a1*n2y-a2*n1y)/det, y=(n1x*a2-n2x*a1)/det;
    i?g.lineTo(c+x*s,c+y*s):g.moveTo(c+x*s,c+y*s); }
  g.closePath();
}
let themeEvT=0, sandFx=null, stageTrans=null, popcornAt=1500;
const TRANS_MS=1400, STAGE_PAUSE=2200;    // 背景が切り替わる時間 / 新しい組を出さずに待つ時間
function themeStep(now, dt){

    themeEvT=0;

    const pick = (gb.length && Math.random()<0.7) ? gb[Math.random()*gb.length|0] : list[Math.random()*list.length|0];
    if(pick){ balls=balls.filter(o=>o!==pick); dropBonds(o=>o!==pick); for(let i=0;i<2;i++) burst(pick.x-0.5,pick.y-0.5,0); score+=10; sfx("lock"); }

    themeEvT=0; popcornAt=600+Math.random()*2000;
    // 触れている壁の、外向きの法線（触れていなければ null）
    const wallN=o=>{ const A=arena().k, c=N/2, e=0.05;
      if(A==="square"){ if(o.y>=N-R-e) return [0,1]; if(o.y<=R+e) return [0,-1]; if(o.x>=N-R-e) return [1,0]; if(o.x<=R+e) return [-1,0]; return null; }
      if(A==="circle"){ const dx=o.x-c, dy=o.y-c, d=Math.hypot(dx,dy)||1; return d>=c-R-e ? [dx/d,dy/d] : null; }
      for(const [nx,ny,a] of arenaEdges(A)) if((o.x-c)*nx+(o.y-c)*ny >= a-R-e) return [nx,ny]; return null; };
    const list=balls.filter(o=>!o.live&&!o.pop&&!o.frozen&&wallN(o)), a=Math.max(15, G/cellM*Math.hypot(gN.x,gN.y));
    const n=Math.min(list.length, 1+(Math.random()<0.35?1:0)+(Math.random()<0.15?1:0));
    for(let i=0;i<n;i++){
      const o=list.splice(Math.random()*list.length|0,1)[0], wn=wallN(o);
      const H=3+Math.random()*4.5, v=Math.sqrt(2*a*H)*(o.heavy?0.5:1), ang=(Math.random()-0.5)*0.9, c=Math.cos(ang), sn=Math.sin(ang);
      const dx=-wn[0]*c+wn[1]*sn, dy=-wn[1]*c-wn[0]*sn;         // 壁から離れる向き（少しばらつく）
      // つながっているぷにも、上に乗っているぷにも、まとめて飛ばす
      const go=new Map([[o,1]]);
      const q=[o]; while(q.length && go.size<14){ const b=q.pop(); for(const [p1,p2] of bonds){ const t=p1===b?p2:p2===b?p1:null; if(t && !go.has(t) && !t.live && !t.pop){ go.set(t,0.9); q.push(t); } } }
      for(const b of balls){ if(go.has(b)||b.live||b.pop) continue; const rx=b.x-o.x, ry=b.y-o.y, al=rx*dx+ry*dy, lat=Math.abs(rx*dy-ry*dx); if(al>0 && al<7 && lat<2*R*0.95) go.set(b,0.92); }
      for(const [b,k] of go){ b.vx=dx*v*k; b.vy=dy*v*k; b.slip=500; }
      o.wv=(o.wv||0)+0.02;
      for(let j=0;j<3;j++) burst(o.x-0.5+wn[0]*0.4,o.y-0.5+wn[1]*0.4,3);
    }
    if(n){ tone(900,1500,0.05,"square",0.07); tone(300,160,0.09,"sine",0.16,0.01); shake=Math.max(shake,3); }
  }
}
// ===== ボス戦 =====
// ステージ3・6・9…でボスが出る。ボス戦の間は組の出口が3か所になり、ボスはときどき左右の出口からお邪魔ぷにを降らせる。
// 粒を消すとボスにダメージ（連鎖するほど大きい）。HPを0にすると撃破ボーナス。
const BOSS_EVERY = 5;           // ボスはステージ5・10・15…
let boss=null, bossFx=null, spawnIdx=0;
function bossName(n){ return ["ぷにキング","ぷにクイーン","ぷにエンペラー","ぷにゴッド"][Math.min(3,n-1)]; }
function startBoss(now, n=Math.max(1,Math.floor(level/BOSS_EVERY))){
  const maxHp=50+n*30;
  boss={n, hp:maxHp, maxHp, nextAtk:now+6000, warn:0, name:bossName(n), nextBeam:now+10000}; beam=null;
  bossFx={t:now, text:`${boss.name} あらわる！`};

}
// 出口: 真ん中と、重力に直角な向きに左右4マス
function spawnBases(){
  const c=N/2, u=gDir()||[0,1], p=[u[1],-u[0]];
  const k=4*N/N0;
  return boss ? [[c,c],[c+p[0]*k,c+p[1]*k],[c-p[0]*k,c-p[1]*k]] : [[c,c]];
}
// ===== 放置対策 =====
// 傾きの変化もボタン操作もないまま IDLE_WARN 秒たつと注意、IDLE_MS たつとお邪魔ぷにが降ってくる（その後は IDLE_AGAIN ごと、だんだん増える）
const IDLE_WARN=5000, IDLE_MS=8000, IDLE_AGAIN=6000, IDLE_TILT=0.10;      // IDLE_TILT: 傾きがこれ以上変わったら「動かした」とみなす（約6度）
let idleT=0, idleN=0, idleWarned=false, idleAx=0, idleAy=0;
function idleTouch(){ idleT=0; idleN=0; idleWarned=false; }
function idleStep(now, dt){
  if(!running||paused||over||popping||(stageTrans && now-stageTrans.t<STAGE_PAUSE)||(boss&&boss.dying)){ return; }
  if(Math.hypot(gN.x-idleAx,gN.y-idleAy)>IDLE_TILT){ idleAx=gN.x; idleAy=gN.y; idleTouch(); return; }
  idleT+=dt;
  if(!idleWarned && idleT>=IDLE_WARN){ idleWarned=true; praise("うごかして！","じっとしていると お邪魔ぷにが降ってくる","#ff9db0"); }
  if(idleT>=IDLE_MS){
    idleT=IDLE_MS-IDLE_AGAIN; idleN++;
    const c=N/2, u=gDir()||[0,1], pp=[u[1],-u[0]], kk=4*N/N0, k=Math.min(4,1+idleN);          // 出口の左右（ボス戦の横の出口と同じ場所）から降らせる
    for(const [bx,by] of [[c+pp[0]*kk,c+pp[1]*kk],[c-pp[0]*kk,c-pp[1]*kk]]) for(let i=0;i<k;i++){
      const x=bx+(Math.random()-0.5)*1.6, y=by+(Math.random()-0.5)*1.6;
      if(overlaps([[x,y]],0.1)) continue;
      const o=newBall(x,y,GARBAGE); o.vx=u[0]*3; o.vy=u[1]*3; balls.push(o); burst(x-0.5,y-0.5,GARBAGE);
    }

  }
}

// ボスの必殺技「いじわる光線」: 真ん中の出口からランダムな向きに光線。BEAM_WARN の間は細い線で予告し、そのあと太い光線が出る。
// 当たったぷには、つながりが壊れてはじけ飛ぶ（消えはしない）
const BEAM_WARN=1300, BEAM_FIRE=500, BEAM_W=0.8;
let beam=null;
function beamStep(now){
  if(!boss){ beam=null; return; }
  if(!beam){
    if(now<boss.nextBeam || boss.dying) return;
    beam={t0:now, ang:Math.random()*Math.PI*2, fired:false}; sfx("mag"); return;
  }
  if(!beam.fired && now>=beam.t0+BEAM_WARN){
    beam.fired=true;
    const c=N/2, dx=Math.cos(beam.ang), dy=Math.sin(beam.ang), hit=new Set();
    for(const o of balls){ if(o.live||o.pop) continue;
      const rx=o.x-c, ry=o.y-c, t=rx*dx+ry*dy; if(t<0.3) continue;
      const d=rx*dy-ry*dx; if(Math.abs(d)>BEAM_W) continue;
      hit.add(o); }
    if(hit.size){
      dropBonds(o=>!hit.has(o));
      for(const o of hit){ const rx=o.x-c, ry=o.y-c, side=(rx*dy-ry*dx)>=0?1:-1, sp=7+Math.random()*5;
        o.vx+=(dy*side*0.8+dx*0.5+(Math.random()-0.5)*0.6)*sp; o.vy+=(-dx*side*0.8+dy*0.5+(Math.random()-0.5)*0.6)*sp;
        o.noBond=now+900; o.wv=(o.wv||0)+0.02; burst(o.x-0.5,o.y-0.5,o.c===GARBAGE?5:Math.min(o.c,4)); }
      dirty=true;
    }
    sfx("bomb"); shake=10;
  }
  if(now>=beam.t0+BEAM_WARN+BEAM_FIRE){ beam=null; boss.nextBeam=now+Math.max(7000, 13000-boss.n*1000); }
}
function drawBeam(now, s){
  if(!beam) return;
  const c=N/2*s, L=N*1.5*s, dx=Math.cos(beam.ang), dy=Math.sin(beam.ang), t=now-beam.t0;
  ctx.save(); ctx.lineCap="round";
  if(!beam.fired){                                             // 予告: 点線がちかちかして、だんだん濃くなる
    const k=Math.min(1,t/BEAM_WARN);
    ctx.strokeStyle=`rgba(255,90,200,${0.25+0.5*k*(0.6+0.4*Math.sin(now/45))})`; ctx.lineWidth=s*(0.12+0.5*k); ctx.setLineDash([s*0.5,s*0.4]); ctx.lineDashOffset=-now/20;
    ctx.beginPath(); ctx.moveTo(c+dx*s*0.4,c+dy*s*0.4); ctx.lineTo(c+dx*L,c+dy*L); ctx.stroke(); ctx.setLineDash([]);
    ctx.font=`900 ${s*0.62}px "GP",-apple-system,"Hiragino Sans",sans-serif`; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.lineWidth=s*0.14; ctx.strokeStyle="rgba(60,0,60,.8)"; ctx.fillStyle="#ffb3ec"; ctx.strokeText("いじわる光線！",c,s*2.1); ctx.fillText("いじわる光線！",c,s*2.1);
  }else{
    const k=1-Math.min(1,(t-BEAM_WARN)/BEAM_FIRE);
    for(const [w,col] of [[BEAM_W*2.6,`rgba(255,80,210,${0.35*k})`],[BEAM_W*1.7,`rgba(255,150,235,${0.75*k})`],[BEAM_W*0.7,`rgba(255,255,255,${0.95*k})`]]){
      ctx.strokeStyle=col; ctx.lineWidth=s*w*(0.6+0.4*k); ctx.beginPath(); ctx.moveTo(c,c); ctx.lineTo(c+dx*L,c+dy*L); ctx.stroke(); }

function bossStep(now){
  if(!boss) return;
  beamStep(now);
  if(!boss.warn && now>=boss.nextAtk-1100) boss.warn=now;     // 攻撃の1.1秒前に出口が赤く光る

      if(overlaps([[x,y]],0.1)) continue;
      const o=newBall(x,y,GARBAGE); o.vx=u[0]*3; o.vy=u[1]*3; balls.push(o); burst(x-0.5,y-0.5,GARBAGE);
    }

// 指定した位置に置いたら、壁や他の粒（組の2個以外）と重なるか
function overlaps(pts, slack=0.02){
  for(const [x,y] of pts){
    if(x<R-slack||y<R-slack||x>N-R+slack||y>N-R+slack) return true;
    if(!insideArena(x,y,slack)) return true;
    for(const o of balls){
      if(o.live) continue;
      const dx=o.x-x, dy=o.y-y;
      if(dx*dx+dy*dy < (2*R-slack)*(2*R-slack)) return true;
    }

}
function piecePts(dx=0,dy=0){ return piece.balls.map(o=>[o.x+dx,o.y+dy]); }

function tryMove(dx,dy){

  const u=gDir()||[0,1], p=[-u[1],u[0]];
  let mx=dx, my=dy;
  const perp=dx*p[0]+dy*p[1], along=dx*u[0]+dy*u[1];
  if(Math.abs(perp)>=Math.abs(along)){ const k=Math.sign(perp)||1; mx=p[0]*k; my=p[1]*k; }
  else if(along>0){ mx=u[0]; my=u[1]; }
  // 少しずつ近づけて、ぶつかる手前まで動かす
  let best=0;
  for(let t=1;t>=0.25;t-=0.25){ if(!overlaps(piecePts(mx*t,my*t))){ best=t; break; } }
  if(!best) return false;
  mx*=best; my*=best;
  for(const o of piece.balls){ o.x+=mx; o.y+=my; }
  piece.ox-=mx; piece.oy-=my; dirty=true;
  return true;
}
function rotate(dir){ // 1:時計回り -1:反時計回り。軸の粒のまわりを全体が回る

  const a=piece.balls[0], D=2*R;
  const rot=(k)=>piece.balls.map(o=>{ const ox=o.x-a.x, oy=o.y-a.y; return k===2?[-ox,-oy]:(dir>0?[-oy,ox]:[oy,-ox]); });
  const kicks=[[0,0],[D,0],[-D,0],[0,-D],[0,D],[2*D,0],[-2*D,0]];
  for(const k of [1,2]){
    const offs=rot(k);
    for(const [kx,ky] of kicks){
      const pts=offs.map(([ox,oy])=>[a.x+kx+ox,a.y+ky+oy]);
      if(!overlaps(pts)){
        const ax=a.x+kx, ay=a.y+ky;
        piece.balls.forEach((o,i)=>{ o.x=ax+offs[i][0]; o.y=ay+offs[i][1]; o.vx=a.vx; o.vy=a.vy; });
        piece.wv=(piece.wv||0)-0.006; lockTimer=0; dirty=true; sfx("rot"); return;

        const rv=(p.vx-o.vx)*nx+(p.vy-o.vy)*ny;
        if(rv>=0) continue;
        const j=-(1+ER)*rv/(wa+wb);
        o.vx-=j*nx*wa; o.vy-=j*ny*wa; p.vx+=j*nx*wb; p.vy+=j*ny*wb;

      const o=handGrab.o;

      else { const k=Math.min(1/h,28); o.vx=(handGrab.x-o.x)*k; o.vy=(handGrab.y-o.y)*k; const sp=Math.hypot(o.vx,o.vy); if(sp>45){ o.vx*=45/sp; o.vy*=45/sp; } }

// 組が何かに乗って止まったら手放す

  const sp=Math.max(...piece.balls.map(o=>Math.hypot(o.vx,o.vy)));

  else if(total>=10) praise("大量消し！", `${total}個いっぺんに`);
  if(colorSet.size>=3){ rec.multi++; praise(`${colorSet.size}色同時消し！`, "", "#9dffb0"); }
  if(bombs.length && total>=12){ rec.bigBomb++; praise("大爆発！", `${total}個を巻き込んだ`, "#ff8a5a"); }
  if(gb.length>=5){ rec.garbage++; praise("お邪魔一掃！", `${gb.length}個まとめて`, "#cfd6e4"); }

function useBoost(){
  if(!running||paused||over||items.boost<=0||boostLeft>0) return;
  items.boost--; boostLeft=BOOST_MS;
  if(cascade && chainUntil<Infinity && chainUntil>performance.now()){ chainWinLen*=2; chainUntil=performance.now()+chainWinLen; }  // いまの受付もすぐ延ばす
  showItemUse("boost");
  sfx("boost"); updateHud();
}
function useStop(){
  if(!running||paused||over||items.stop<=0||stopLeft>0) return;
  items.stop--; stopLeft=STOP_MS;
  showItemUse("stop");
  updateHud();                                                 // 効果音は syncStopSound が鳴らす（ストップの間ずっと時計の音）
}
function useShuffle(){
  if(!running||paused||over||items.shuf<=0||shuffle||popping) return;
  const src=balls.filter(o=>!o.live);
  if(!src.length) return;
  const FL=['virus','vLeft','bomb','balloon','heavy','frozen','magnet','timer','sticky'];
  const from=src.map(o=>{ const b={x:o.x-0.5, y:o.y-0.5, c:o.c}; for(const k of FL) if(o[k]!=null) b[k]=o[k]; return b; });
  // 行き先: 真ん中3×3と、落下中の組のまわりを避けて、ランダムに散らす（1マスに1個なので重ならない）
  const c=(N-1)/2, spots=[];
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    if(Math.abs(x-c)<=1 && Math.abs(y-c)<=1) continue;
    if(piece && piece.balls.some(o=>Math.hypot(o.x-(x+0.5),o.y-(y+0.5))<1.2)) continue;
    spots.push([x,y]);
  }
  for(let i=spots.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [spots[i],spots[j]]=[spots[j],spots[i]]; }
  if(spots.length<from.length) return;
  items.shuf--;
  const colors=from.map(b=>{ const x={...b}; delete x.x; delete x.y; return x; });
  for(let i=colors.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [colors[i],colors[j]]=[colors[j],colors[i]]; }
  const to=from.map((b,i)=>({x:spots[i][0], y:spots[i][1], ...colors[i]}));
  shuffle={t:performance.now(), from, to, spin: Math.random()<0.5?1:-1};
  showItemUse("shuf");
  balls=balls.filter(o=>o.live); bonds=[]; bondKeys=new Set(); dirty=false;
  sfx("shuf"); updateHud();
}
function easeInCubic(t){ return t*t*t; }
function easeOutBack(t){ const c1=1.4, c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); }
// シャッフル中の粒の位置（盤面のマス単位、中心座標）
function shuffleFrame(now){
  const t=now-shuffle.t, c=(N-1)/2+0.5, out=[];
  const sp=shuffle.spin;
  if(t<SHUF_IN){                               // ぐるぐる回りながら中央へ
    const e=easeInCubic(t/SHUF_IN);
    for(const b of shuffle.from){
      const dx=b.x+0.5-c, dy=b.y+0.5-c, r0=Math.hypot(dx,dy), a0=Math.atan2(dy,dx);
      const r=r0*(1-e), a=a0+sp*e*Math.PI*3;
      out.push({x:c+Math.cos(a)*r, y:c+Math.sin(a)*r, c:b.c, sc:1-0.45*e});
    }
  }else if(t<SHUF_IN+SHUF_HOLD){               // 中央で渦を巻く
    const k=(t-SHUF_IN)/SHUF_HOLD;
    shuffle.from.forEach((b,i)=>{
      const a=i*2.399+sp*(k*Math.PI*2+t*0.01), r=0.35+0.25*Math.sin(i*1.7+t*0.02);
      out.push({x:c+Math.cos(a)*r, y:c+Math.sin(a)*r, c:shuffle.to[i].c, sc:0.55});
    });
  }else{                                       // 四方へ吐き出す
    const k=Math.min(1,(t-SHUF_IN-SHUF_HOLD)/SHUF_OUT), e=easeOutBack(k);
    for(const b of shuffle.to){
      const dx=b.x+0.5-c, dy=b.y+0.5-c, rr=Math.hypot(dx,dy), a1=Math.atan2(dy,dx);
      const a=a1 - sp*(1-k)*Math.PI*1.2, r=rr*e;
      out.push({x:c+Math.cos(a)*r, y:c+Math.sin(a)*r, c:b.c, sc:0.55+0.45*Math.min(1,k*1.5)});
    }
  }
  return out;
}

function setGravity(d){
  d = ((d%4)+4)%4;
  if(d===grav) return;
  grav=d; dirty=true;
  updateCtrl();
}

// 顔: 小さな点の目・ほっぺ・小さな口（つぶらな目で、本家とは違う顔）
function face(g,r,o,gx,gy){

  g.strokeStyle="#2b1830"; g.fillStyle="#2b1830"; g.lineCap="round"; g.lineWidth=Math.max(1,r*0.09);
  const ex=r*0.34, ey=-r*0.04+ly;

  }else{
    for(const sx of [-1,1]){
      g.beginPath(); g.ellipse(sx*ex+lx,ey,r*0.085,r*0.11,0,0,Math.PI*2); g.fill();
      g.fillStyle="#fff"; g.beginPath(); g.arc(sx*ex+lx-r*0.025,ey-r*0.04,r*0.03,0,Math.PI*2); g.fill(); g.fillStyle="#2b1830";
    }
  }
  g.lineWidth=Math.max(1,r*0.07);
  g.beginPath();
  if(o.happy){ g.arc(lx,r*0.18+ly,r*0.12,0.1*Math.PI,0.9*Math.PI); }
  else { g.moveTo(lx-r*0.08,r*0.17+ly); g.quadraticCurveTo(lx-r*0.04,r*0.23+ly,lx,r*0.18+ly); g.quadraticCurveTo(lx+r*0.04,r*0.23+ly,lx+r*0.08,r*0.17+ly); }

// ===== つながりのデザイン =====
// A: とろり（くびれのあるゼリーの橋） B: もちもち（太くくっつく） C: 手つなぎ D: ハート E: シール（白いふち） F: 棒（旧）
const BOND_STYLES = [
  {key:"goo",    name:"A とろり"},
  {key:"mochi",  name:"B もちもち"},
  {key:"hands",  name:"C 手つなぎ"},
  {key:"heart",  name:"D ハート"},
  {key:"sticker",name:"E シール"},
  {key:"bar",    name:"F 棒（今まで）"},
];
let bondStyle = store.get("bondStyle2","sticker"); if(!BOND_STYLES.some(b=>b.key===bondStyle)) bondStyle="sticker";
// くびれた橋: 2つの円のあいだを、内側にへこんだ曲線でつなぐ
function neck(g,x1,y1,x2,y2,r,ang,pinch,fill){
  const dx=x2-x1, dy=y2-y1, d=Math.hypot(dx,dy)||1, ux=dx/d, uy=dy/d, nx=-uy, ny=ux;

  g.lineTo(x2+r*(-ca*ux-sa*nx), y2+r*(-ca*uy-sa*ny));

function heartPath(g,x,y,sz){
  g.beginPath(); g.moveTo(x,y+sz*0.35);

  g.bezierCurveTo(x+sz*0.45,y-sz*1.05, x+sz*1.1,y-sz*0.35, x,y+sz*0.35);
  g.closePath();
}
// 粒の下に描く部分
function bondUnder(g,x1,y1,x2,y2,r,ci){
  const p=PALETTE[ci];
  if(bondStyle==="bar"){ g.strokeStyle=p.base; g.lineWidth=r*1.3; g.lineCap="round"; g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke(); }
  else if(bondStyle==="goo") neck(g,x1,y1,x2,y2,r*0.98,0.95,0.42,p.base);
  else if(bondStyle==="mochi") neck(g,x1,y1,x2,y2,r*0.99,1.2,0.78,p.base);
}
// 粒の上に描く部分（くっついたところ）
function bondOver(g,x1,y1,x2,y2,r,ci,t){

  if(bondStyle==="goo"||bondStyle==="mochi"){            // つなぎ目のかげを消して、ひとつながりに見せる
    const k=bondStyle==="goo"?0.3:0.46;
    const gr=g.createRadialGradient(mx,my,0,mx,my,r*k);
    gr.addColorStop(0,p.base); gr.addColorStop(0.7,p.base); gr.addColorStop(1,p.base+"00");
    g.save(); g.translate(mx,my); g.rotate(Math.atan2(uy,ux)); g.scale(0.55,1.2); g.translate(-mx,-my);
    g.fillStyle=gr; g.beginPath(); g.arc(mx,my,r*k,0,Math.PI*2); g.fill(); g.restore();
    let nx=-uy, ny=ux; if(ny>0||(ny===0&&nx>0)){ nx=-nx; ny=-ny; }   // 光の来る上側に、橋のつや
    g.fillStyle="rgba(255,255,255,.3)";

  }else if(bondStyle==="hands"){                          // 小さな手をつないでいる
    const nx=-uy, ny=ux, side = (ny>0 || (ny===0 && nx>0)) ? 1 : -1;   // 下側（画面の下寄り）で手をつなぐ
    const hx=mx+nx*side*r*0.72, hy=my+ny*side*r*0.72;
    g.lineCap="round";

    }

// シール: つながったかたまり全体を白いふちで囲む（粒より先に描く）

function drawNext(){
  fitCanvas(nv);
  const W=nv.width; nctx.clearRect(0,0,W,W);
  const draw1=(nx,cx,cy,size,alpha,face)=>{
    const xs=nx.o.map(o=>o[0]), ys=nx.o.map(o=>o[1]);
    const mx=(Math.min(...xs)+Math.max(...xs))/2, my=(Math.min(...ys)+Math.max(...ys))/2;
    const span=Math.max(Math.max(...xs)-Math.min(...xs), Math.max(...ys)-Math.min(...ys))+1;
    const u=Math.min(size/span, size*0.5), r=u*0.47;
    nx.o.forEach(([x,y],i)=>blob(nctx,cx+(x-mx)*u,cy+(y-my)*u,r,nx.c[i],alpha,{face,fx:{[nx.f[i]||"_"]:true, timer:nx.f[i]==="timer"?TIMER_MS:null},t:performance.now()}));
  };
  draw1(nextPairs[0], W*0.38, W*0.5, W*0.62, 1, true);            // 次の組
  draw1(nextPairs[1], W*0.83, W*0.5, W*0.28, 0.7, false);          // その次
}
function updateHud(){
  document.getElementById("score").textContent=score;
  document.getElementById("lines").textContent=maxChain;
  const sn=document.getElementById("stageN"); if(sn) sn.textContent=stageLabel();
  const th=theme(), scN=document.getElementById("scName");
  applyWorldBg(th.k);
  if(scN){ scN.textContent=themeTitle(th);
    document.getElementById("scPts").innerHTML=[`盤面: ${arena().name}`, ...th.pts].map(t=>`<li>${t}</li>`).join("");
    const fx=[]; if(boss) fx.push(`👑 ボス戦: ${boss.name}`); if(boostLeft>0) fx.push("🚀 ブースター中"); if(handLeft>0) fx.push("🖐 魔法の手"); if(magLeft>0) fx.push("🧲 マグネット中"); if(stopLeft>0) fx.push("⏳ ストップ中");
    document.getElementById("scFx").textContent=fx.join("　");
    const need=stageNeed(level), left=Math.max(0,need-stagePop);
    document.getElementById("scBar").style.width=(boss?100:Math.min(100,stagePop/need*100))+"%";
    document.getElementById("scNext").textContent = mode==="world" && (level%WORLD_STAGES===0) ? "ボスを倒すとワールドクリア" : boss ? "ボス戦中" : `次のステージまで あと${left}個`;
    document.getElementById("stageCard").dataset.theme=th.k; fitHud(); fitHudSoon(); }
  const st=document.getElementById("itemStop"), sh=document.getElementById("itemShuf");
  if(st){
    document.getElementById("nStop").textContent=items.stop; document.getElementById("nShuf").textContent=items.shuf;
    st.classList.toggle("empty", items.stop<=0); sh.classList.toggle("empty", items.shuf<=0);
    st.classList.toggle("active", stopLeft>0);
    const jp=document.getElementById("itemJump");
    if(jp){ document.getElementById("nJump").textContent=items.jump; jp.classList.toggle("empty", items.jump<=0); }
    for(const k in ITEM_BTN){ const e=document.getElementById(ITEM_BTN[k]); if(e) e.classList.toggle("locked", !itemOpen(k)); }   // まだ解放されていないアイテムは出さない
    const hd=document.getElementById("itemHand");
    if(hd){ document.getElementById("nHand").textContent=items.hand; hd.classList.toggle("empty", items.hand<=0); hd.classList.toggle("active", handLeft>0); }
    const bo=document.getElementById("itemBoost");
    if(bo){ document.getElementById("nBoost").textContent=items.boost; bo.classList.toggle("empty", items.boost<=0); bo.classList.toggle("active", boostLeft>0); }
    const mg=document.getElementById("itemMag");
    if(mg){ document.getElementById("nMag").textContent=items.mag; mg.classList.toggle("empty", items.mag<=0); mg.classList.toggle("active", magLeft>0); }
  }
}

// 左上の情報が、左下のボタン（とその上のアイテムスロット）に重ならないよう、高さを収める。入りきらない箇条書きは下から隠す
function fitHud(){

  h.style.maxHeight="";
  const lis=[...document.querySelectorAll("#scPts li")]; for(const li of lis) li.style.display="";

  const limit=c.getBoundingClientRect().top-4;
  const over=()=>h.getBoundingClientRect().bottom>limit;

function screenAngleCCW(){

  if(typeof window.__nativeAngle==="number") return window.__nativeAngle;
  if(typeof window.orientation==="number") return window.orientation;
  if(screen.orientation && typeof screen.orientation.angle==="number") return screen.orientation.angle;
  return 0;
}

      const e=document.getElementById(ITEM_EL[k]); left.appendChild(e); place(e, xs[i], ys[i]); });
  }

// ===== 傾きセンサー =====
// iOS（iPadOS はデスクトップ版 Mac の UA を名乗るので、タッチ対応の Mac も iOS 扱い）
const IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent)
  || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints>1);
let sensorSeen=false, sx=0, sy=0, pendDir=-1, pendSince=0;
function onMotion(e){
  const a=e.accelerationIncludingGravity;
  if(!a || a.x==null || a.y==null) return;
  if(!sensorSeen){ sensorSeen=true; setStatus(); }
  // 1) 端末座標系（x右, y上）での「重力が引く向き」
  //    仕様（Android）: 値は重力の反作用 → 向きは -a
  //    iOS: 全軸が仕様と逆 → 向きは +a
  const sgn = IS_IOS ? 1 : -1;
  // 2) y を下向きに直す
  let dx0 = sgn*a.x, dy0 = -sgn*a.y;
  // 3) 画面の回転ぶん戻して「画面上の向き」にする（反時計回りに w 度回した端末 → -w 度回転）
  const w = (screenAngleCCW() + sensorOffset*90) * Math.PI/180;
  const c=Math.cos(-w), s=Math.sin(-w);
  let gx = dx0*c - dy0*s, gy = dx0*s + dy0*c;
  sx = sx*0.6 + gx*0.4; sy = sy*0.6 + gy*0.4;
  const mag=Math.hypot(sx,sy);
  // 重力の単位ベクトル（画面に沿った成分 x,y と、画面に垂直な成分 z）
  const az = Math.abs(a.z||0), tot = Math.hypot(gx,gy,az) || 1;
  gN.x = gN.x*0.7 + (gx/tot)*0.3; gN.y = gN.y*0.7 + (gy/tot)*0.3; gN.z = gN.z*0.7 + (az/tot)*0.3;
  tiltDeg = Math.asin(Math.min(1, Math.hypot(gN.x,gN.y)))*180/Math.PI;   // 盤面が水平から何度傾いているか
  if(mag<TILT_MIN) { pendDir=-1; return; }
  const ang=Math.atan2(sy,sx)*180/Math.PI;            // 0=右, 90=下
  const axes=[90,180,-90,0];                          // DIRS の順
  let bestD=0, bestDiff=999;
  axes.forEach((ax,i)=>{ let d=Math.abs(((ang-ax)%360+540)%360-180); if(d<bestDiff){bestDiff=d;bestD=i;} });
  if(bestD!==grav && bestDiff<40 && running&&!paused&&!over) setGravity(bestD);   // 操作ボタンの向きだけ一番近い方向に合わせる
  if(Math.hypot(gN.x,gN.y)>0.05) dirty=true;
}
async function enableSensor(){
  try{
    if(typeof DeviceMotionEvent!=="undefined" && typeof DeviceMotionEvent.requestPermission==="function"){
      const res = await DeviceMotionEvent.requestPermission();
      if(res!=="granted"){ setStatus("センサーが許可されませんでした"); return; }
    }
    window.addEventListener("devicemotion",onMotion);
  }catch(err){ setStatus("センサーを使えません（"+(err&&err.name||"error")+"）"); }
}
function setStatus(msg){
  const el=document.getElementById("status");
  if(msg){ el.textContent=msg; return; }
  const S=slope();
  const acc = (S.canStart||physActive) ? Math.max(0,S.aMS) : 0;
  el.textContent = sensorSeen ? `傾き ${Math.round(tiltDeg)}° ・ μ ${S.f.k.toFixed(2)} ・ ${acc>0?acc.toFixed(1)+" m/s²":"静止摩擦で停止"}` : (window.isSecureContext ? "傾きセンサー: なし" : "傾きセンサー: HTTPSが必要");
}

// ===== タッチ操作 =====
// 横ドラッグ（重力と直交方向）= 移動 / 重力方向へドラッグ = ソフトドロップ / 重力方向へフリック = ハードドロップ / タップ = 回転
let tp=null;
function toBoard(dx,dy){ // 画面上の移動量 → 盤面座標
  const r=angle*Math.PI/180, c=Math.cos(r), s=Math.sin(r);
  return [dx*c - dy*s, dx*s + dy*c];
}
const stage=document.getElementById("stage");
stage.addEventListener("pointerdown",e=>{
  if(!running||paused||over) return;
  stage.setPointerCapture(e.pointerId);
  if(handLeft>0){                                            // 魔法の手: いちばん近いぷにをつかむ（落ちてくる途中の組はつかめない）
    const [bx,by]=boardPos(e.clientX,e.clientY); let best=null, bd=0.9;
    for(const o of balls){ if(o.live||o.pop) continue; const d=Math.hypot(o.x-bx,o.y-by); if(d<bd){ bd=d; best=o; } }
    if(best){ handGrab={o:best, x:bx, y:by, id:e.pointerId}; tp=null; dirty=true; return; }
  }
  tp={id:e.pointerId, x0:e.clientX, y0:e.clientY, ax:e.clientX, ay:e.clientY, t0:performance.now(), maxd:0};
});
stage.addEventListener("pointermove",e=>{

  if(!tp||e.pointerId!==tp.id||!piece) return;
  const cell = stage.offsetWidth/N;
  tp.maxd=Math.max(tp.maxd, Math.hypot(e.clientX-tp.x0, e.clientY-tp.y0));
  const [bx,by]=toBoard(e.clientX-tp.ax, e.clientY-tp.ay);
  const [gx,gy]=DIRS[grav];
  const along = bx*gx + by*gy;                 // 重力方向成分
  const perp  = gx!==0 ? by : bx;              // 直交成分
  const px = gx!==0 ? 0 : 1, py = gx!==0 ? 1 : 0;
  const step = cell*0.85;
  if(Math.abs(perp)>=step){
    const k=Math.sign(perp);
    tryMove(px*k,py*k); lockTimer=0;
    const [sx2,sy2]=toBoardInv(px*k*step, py*k*step);
    tp.ax+=sx2; tp.ay+=sy2;
  }else if(along>=step*1.2){
    if(tryMove(gx,gy)) score+=1;
    const [sx2,sy2]=toBoardInv(gx*step*1.2, gy*step*1.2);

function toBoardInv(bx,by){ const r=-angle*Math.PI/180, c=Math.cos(r), s=Math.sin(r); return [bx*c-by*s, bx*s+by*c]; }
stage.addEventListener("pointerup",e=>{
  if(!tp||e.pointerId!==tp.id) return;
  const dt=performance.now()-tp.t0;
  const [bx,by]=toBoard(e.clientX-tp.x0, e.clientY-tp.y0);
  const [gx,gy]=DIRS[grav];
  const along=bx*gx+by*gy, perp=gx!==0?by:bx;
  if(tp.maxd<12 && dt<300) rotate(1);
  else if(dt<280 && along>stage.offsetWidth*0.12 && along>Math.abs(perp)*2) hardDrop();
  tp=null;
});

  if(!running||paused||over) return;
  const [gx,gy]=DIRS[grav];
  const map={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
  if(map[k]){
    const [dx,dy]=map[k];
    if(dx===gx&&dy===gy){ if(tryMove(dx,dy)) score+=1; }
    else if(dx!==-gx||dy!==-gy){ tryMove(dx,dy); lockTimer=0; }
    e.preventDefault(); return;
  }
  if(k===" "){ hardDrop(); e.preventDefault(); return; }
  if(k==="1") useStop();
  if(k==="2") useShuffle();
  if(k==="3") useJump();
  if(k==="x"||k==="X") rotate(1);
  if(k==="z"||k==="Z") rotate(-1);
  const gk={s:0,a:1,w:2,d:3,S:0,A:1,W:2,D:3};

function screenToBoardDir(i){ const [x,y]=DIRS[i]; const [bx,by]=toBoard(x,y); return nearestDir(bx,by); }
function boardToScreenDir(i){ const [x,y]=DIRS[i]; const [sx2,sy2]=toBoardInv(x,y); return nearestDir(sx2,sy2); }
function nearestDir(x,y){ let bi=0,bv=-9; DIRS.forEach(([dx,dy],i)=>{ const v=dx*x+dy*y; if(v>bv){bv=v;bi=i;} }); return bi; }

function dirDeg([x,y]){ return Math.atan2(y,x)*180/Math.PI; }
function setRot(el,deg){                    // 最短の回り方でアイコンを回す
  if(!el) return;
  const prev = (el._r==null) ? deg : el._r;
  let d=deg; while(d-prev>180) d-=360; while(d-prev<-180) d+=360;
  el._r=d; el.style.transform=`rotate(${d}deg)`;
}
function updateCtrl(){

function holdButton(id, fn, repeat){

// 小画面に ✕ を付ける（「もどる」「とじる」「続ける」と同じ働き）
function decorateSheet(){
  if(sheet.classList.contains("home")||sheet.querySelector(".x-close")) return;
  const t=["backBtn","zkBack","shopBack","resumeBtn","introOk"].map(id=>document.getElementById(id)).find(Boolean); if(!t||menuKind==="clear") return;
  const x=document.createElement("button"); x.className="x-close"; x.setAttribute("aria-label","とじる"); x.innerHTML=ICON.close; x.onclick=()=>t.click(); sheet.appendChild(x);
}
// 小画面が画面（広告の帯の上まで）に入りきらないときは、全体を少し縮めて収める。長い一覧（あそびかた・ショップなど）はそのままスクロール
function fitSheet(){
  sheet.style.zoom="";
  if(overlay.classList.contains("hidden")||sheet.classList.contains("home")||sheet.classList.contains("wide")) return;
  const z0=parseFloat(getComputedStyle(sheet).zoom)||1, top=overlay.getBoundingClientRect().top, av=overlay.clientHeight-10; let z=z0;
  for(let i=0;i<3;i++){ const ext=sheet.getBoundingClientRect().bottom-top+overlay.scrollTop; if(ext<=av) break; z*=av/ext*0.995; if(z<z0*0.62){ sheet.style.zoom=""; return; } sheet.style.zoom=z; }
}
let fitT=0;
new MutationObserver(()=>{ decorateSheet(); fitSheet(); clearTimeout(fitT); fitT=setTimeout(fitSheet,420); }).observe(document.getElementById("sheet"),{childList:true});
window.addEventListener("resize",()=>fitSheet());

function shareX(withImage){
  const top=REC_DEFS.filter(([k])=>rec[k]>0 && !["maxChain","stage","maxPop"].includes(k)).slice(0,3).map(([k,label,unit])=>`${label}${rec[k]>1?"×"+rec[k]:""}`);
  const text=`グラビティ・ポップで ${score}点！\n最大${rec.maxChain}連鎖・ステージ${rec.stage}${top.length?"\n"+top.join("・"):""}${lastNew.includes("score")?"\nベスト更新！":""}${withImage?"\n#グラビティポップ #落ちものパズル #ぷに":""}`;
  const url="https://saaiya-chan.github.io/gravity-tetris/free.html";
  const tags=["グラビティポップ","落ちものパズル","ぷに"];
  const intent="https://x.com/intent/post?text="+encodeURIComponent(text)+"&url="+encodeURIComponent(url)+"&hashtags="+encodeURIComponent(tags.join(","));
  const msg=document.getElementById("xMsg");
  const say=t=>{ if(msg) msg.textContent=t; };
  const mh=window.webkit && window.webkit.messageHandlers;
  let card=null; try{ card=makeShareCard(); }catch(e){}
  if(!withImage){
    // X で投稿: 結果カードの画像をコピーしてから投稿画面を開く（投稿画面で長押し→ペーストで画像を添付できる）
    try{
      if(mh && mh.postX && card){ mh.postX.postMessage({intent, image:card.toDataURL("image/png")}); say("画像をコピーしました。X の投稿画面で長押し→「ペースト」で画像を添付できます"); return; }
      if(!mh && card && navigator.clipboard && window.ClipboardItem){
        navigator.clipboard.write([new ClipboardItem({"image/png": new Promise(r=>card.toBlob(r,"image/png"))})])
          .then(()=>say("画像をコピーしました。X の投稿画面で貼り付けて添付できます")).catch(()=>{});
      }
    }catch(e){}
  }
  try{
    if(mh && mh.shareImage && card){                                                 // iOS アプリ: 画像つきで共有メニューを開く（そこで X を選ぶ）
      shareScrim(true);                                                              // 共有メニューの後ろを暗くぼかす（半透明のメニューが見やすいように）
      mh.shareImage.postMessage({text, url, image:card.toDataURL("image/png")});
      say("共有メニューから送り先を選んでください（X は X アプリが入っていると出ます）"); return;
    }
    if(!mh && card && navigator.canShare){                                           // ブラウザ（iPad の Safari など）: 画像つきで共有
      card.toBlob(b=>{ const f=new File([b],"gravity-pop.png",{type:"image/png"});
        if(navigator.canShare({files:[f]})) navigator.share({files:[f], text:text+"\n"+url}).catch(()=>{});
        else window.open(intent,"_blank"); },"image/png");
      say("「画像を保存」で写真に保存して、X で添付できます"); return;
    }
    const h=mh && mh.openExternal;
    if(h){ h.postMessage(intent); say("X を開いています…"); }       // 古いアプリ: X の投稿画面を開く
    else{
      const w=window.open(intent,"_blank");                                          // ブラウザ: 新しいタブで
      say(w ? "X を開いています…" : "X を開けませんでした（アプリの入れ直しが必要かも）");
    }
  }catch(e){ say("X を開けませんでした: "+e.message); }
  // 開けなかったときのために、投稿する文をコピーしておく（X に貼り付けられる）
  try{ navigator.clipboard && navigator.clipboard.writeText(text+"\n"+url).then(()=>{ if(msg) msg.textContent+=" ／ 投稿文をコピーしました"; }).catch(()=>{}); }catch(e){}
}

function showIntro(q){

  }else{
    const it=SHOP.find(x=>x.k===q.k), btn=document.getElementById(ITEM_BTN[q.k]), cs=getComputedStyle(btn);
    head="あたらしいアイテム"; name=it.name; desc=it.desc+"。ボタンを押すと使える";
    pic=`<div class="in-item" style="background:${cs.backgroundImage};border-color:${cs.borderTopColor};color:${cs.color}">${btn.querySelector("svg")?.outerHTML||""}</div>`;
  }
  sheet.innerHTML=`<div class="in-head">${head}</div>
    <div class="in-pic"><div class="in-rays"></div>${pic}</div>
    <h2 class="in-name">${name}</h2><p class="in-desc">${desc}</p>
    <button class="big" id="introOk">OK</button>`;
  overlay.scrollTop=0; sfx("get");
  const c=document.getElementById("introCv");
  if(c){
    const z=ZUKAN.find(z=>z.k===q.k), dpr=Math.min(3,window.devicePixelRatio||1), W=Math.round(150*dpr); c.width=c.height=W; const g=c.getContext("2d");
    const draw=now=>{ if(!c.isConnected) return; g.clearRect(0,0,W,W);
      const fx=Object.assign({},z.fx||{}); if(fx.timer) fx.timer=30000-((now/1000)%30)*1000;
      const br=1+0.04*Math.sin(now/300), blink=((now/1000)%3.2)<0.12, yy=z.k==="balloon" ? W*(0.5+0.05*Math.sin(now/600)) : W*0.52;
      blob(g,W/2,yy,W*0.32*br,z.c,1,{face:true,blink,g:[0,1],fx,t:now}); introAnim=requestAnimationFrame(draw); };
    cancelAnimationFrame(introAnim); introAnim=requestAnimationFrame(draw);
  }
  document.getElementById("introOk").onclick=()=>{
    cancelAnimationFrame(introAnim); sheet.classList.remove("intro"); introOpen=false;
    const i=introQ.findIndex(q=>performance.now()>=q.at);
    if(i>=0) showIntro(introQ.splice(i,1)[0]); else { paused=false; hideOverlay(); }
  };
}

  pop:    {name:"ポップ",   g:["#ff8fc0","#ffd27a"], band:["#ffffff","#ffe8f2"], ink:"#7a2a4a"},
  sky:    {name:"空",       g:["#5ab8ff","#b8f0ff"], band:["#ffffff","#e6f6ff"], ink:"#14507a"},
  sunset: {name:"夕焼け",   g:["#ff7a59","#5a2a8a"], band:["#ffd36a","#ffb04a"], ink:"#4a1a0a"},
  stage:  {name:"ステージ", g:null,                  band:["#ffcf5a","#ffa046"], ink:"#2a1606"},
};
const CARD_F='-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif';
function cardRecs(n){ return REC_DEFS.filter(([k])=>rec[k]>0 && k!=="stage").slice(0,n); }
function cardTitle(){                                          // スコアに応じた称号
  const t=[[0,"ぷに見習い"],[3000,"ぷに使い"],[20000,"ころがし名人"],[100000,"傾きの達人"],[500000,"重力マスター"],[2000000,"ぷにの神"]];
  let r=t[0][1]; for(const [v,n] of t) if(score>=v) r=n; return r;
}
function makeShareCard(style=cardStyle){
  const c=document.createElement("canvas"); c.width=1200; c.height=675; const g=c.getContext("2d"), F=CARD_F;
  const snap=(x,y,w,h,rad)=>{ g.save(); g.beginPath(); g.roundRect(x,y,w,h,rad); g.clip();
    const sn=chainSnap||boardSnap;                             // 最大連鎖の瞬間があればそれ、なければゲームオーバーの瞬間
    if(sn) g.drawImage(sn,x,y,w,h); else { g.fillStyle="#141a26"; g.fillRect(x,y,w,h); } g.restore(); };
  const txt=(t,x,y,font,col,align="left",stroke=0,sc="rgba(0,0,0,.55)")=>{ g.font=font; g.textAlign=align;

  const puni=(x,y,r,ci)=>blob(g,x,y,r,ci,1,{face:true,g:[0,1],t:0});
  const isNew=k=>lastNew.includes(k);
  g.textBaseline="alphabetic";
  if(style==="A"){                                             // A: シンプル（暗い背景、左に盤面）
    const bg=g.createLinearGradient(0,0,1200,675); bg.addColorStop(0,"#1b1430"); bg.addColorStop(1,"#0b1018"); g.fillStyle=bg; g.fillRect(0,0,1200,675);
    g.fillStyle="#141a26"; g.beginPath(); g.roundRect(40,50,575,575,26); g.fill(); snap(50,60,555,555,18);
    [[1110,90,0],[1150,150,1],[1080,170,3]].forEach(([x,y,ci])=>puni(x,y,30,ci));
    txt("グラビティ・ポップ",660,110,`900 44px ${F}`,"#ffcf5a");
    txt("SCORE",660,180,`700 24px ${F}`,"#a9b3c7"); txt(String(score),660,265,`900 96px ${F}`,"#fff");
    if(isNew("score")) txt("ベスト更新！",660,305,`900 28px ${F}`,"#ff6b9a");
    cardRecs(7).forEach(([k,l,u],i)=>{ const y=355+i*42; txt(l,660,y,`700 27px ${F}`,"#a9b3c7"); txt(`${rec[k]}${u}`+(isNew(k)?" NEW!":""),1140,y,`700 27px ${F}`,"#fff","right"); });
    txt("#グラビティポップ",660,640,`600 20px ${F}`,"#6f7a90");
  }else if(style==="B"){                                       // B: ポップ（明るいグラデーション、ぷにがいっぱい、スコアどーん）
    const bg=g.createLinearGradient(0,0,1200,675); bg.addColorStop(0,"#ff8fc0"); bg.addColorStop(0.5,"#ffb36b"); bg.addColorStop(1,"#ffe27a"); g.fillStyle=bg; g.fillRect(0,0,1200,675);
    g.globalAlpha=0.18; g.fillStyle="#fff"; for(let i=0;i<14;i++){ g.beginPath(); g.arc((i*173)%1200, (i*97)%675, 40+(i%4)*25, 0, Math.PI*2); g.fill(); } g.globalAlpha=1;
    const ps=[[70,615,48,0],[165,645,32,1],[1100,110,62,2],[1000,60,40,3],[1140,615,50,4],[60,90,48,1],[1050,650,30,0]];
    ps.forEach(([x,y,r,ci])=>puni(x,y,r,ci));
    txt("グラビティ・ポップ",600,100,`900 54px ${F}`,"#fff","center",12,"rgba(180,60,90,.55)");
    txt(cardTitle(),600,165,`900 34px ${F}`,"#7a2a4a","center");
    txt(String(score),600,320,`900 150px ${F}`,"#fff","center",22,"rgba(160,50,80,.6)");
    txt(isNew("score")?"点  ★ベスト更新！":"点",600,375,`900 36px ${F}`,"#7a2a4a","center");
    const rs=cardRecs(6); const bw=330, bh=62, gap=18, cols=3, x0=600-(cols*bw+(cols-1)*gap)/2;
    rs.forEach(([k,l,u],i)=>{ const x=x0+(i%cols)*(bw+gap), y=410+Math.floor(i/cols)*(bh+gap);
      g.fillStyle="rgba(255,255,255,.82)"; g.beginPath(); g.roundRect(x,y,bw,bh,31); g.fill();
      txt(l,x+24,y+41,`800 25px ${F}`,"#8a4a62"); txt(`${rec[k]}${u}`,x+bw-22,y+41,`900 28px ${F}`,isNew(k)?"#ff3d7f":"#4a2a3a","right"); });
    txt("#グラビティポップ",600,650,`800 22px ${F}`,"rgba(122,42,74,.8)","center");
  }else if(style==="C"){                                       // C: 盤面ドーン（最後の盤面を大きく、下に帯）
    const B=CARD_BGS[cardBg]||CARD_BGS.stage, th=theme();
    const gc = B.g || [th.floor ? `rgb(${th.floor})` : "#ffcf5a", th.bg[1]];
    const bg=g.createLinearGradient(0,0,1200,675); bg.addColorStop(0,gc[0]); bg.addColorStop(1,gc[1]); g.fillStyle=bg; g.fillRect(0,0,1200,675);
    if(cardBg!=="night"){ g.globalAlpha=0.16; g.fillStyle="#fff"; for(let i=0;i<12;i++){ g.beginPath(); g.arc((i*197)%1200,(i*113)%560,35+(i%4)*22,0,Math.PI*2); g.fill(); } g.globalAlpha=1; }
    g.fillStyle="rgba(0,0,0,.25)"; g.beginPath(); g.roundRect(338,33,540,540,24); g.fill();     // 盤面の影
    snap(330,25,540,540,24); g.strokeStyle="rgba(255,255,255,.5)"; g.lineWidth=4; g.beginPath(); g.roundRect(330,25,540,540,24); g.stroke();
    const band=g.createLinearGradient(0,560,0,675); band.addColorStop(0,B.band[0]); band.addColorStop(1,B.band[1]);
    g.fillStyle=band; g.fillRect(0,575,1200,100);
    txt(`${score}点`,40,645,`900 60px ${F}`,B.ink);
    txt(`最大${rec.maxChain}連鎖 ・ ステージ${rec.stage}${rec.boss?` ・ ボス${rec.boss}体撃破`:""}`,1160,620,`800 26px ${F}`,B.ink,"right");
    txt("グラビティ・ポップ  #グラビティポップ",1160,655,`700 20px ${F}`,B.ink+"bb","right");
    if(isNew("score")) txt("ベスト更新！",345,75,`900 32px ${F}`,"#ff5a8a","left",8);
    [[95,120,60,0],[175,230,42,3],[1105,140,58,2],[1030,250,40,1]].forEach(([x,y,r,ci])=>puni(x,y,r,ci));
  }else{                                                       // D: トレカ（金の枠、称号、ステータス）
    const bg=g.createRadialGradient(600,300,50,600,340,750); bg.addColorStop(0,"#3a2a6a"); bg.addColorStop(1,"#0e0a20"); g.fillStyle=bg; g.fillRect(0,0,1200,675);
    for(let i=0;i<60;i++){ g.globalAlpha=0.3+((i*37)%10)/20; g.fillStyle="#fff"; g.beginPath(); g.arc((i*197)%1200,(i*131)%675,1+(i%3),0,Math.PI*2); g.fill(); } g.globalAlpha=1;
    const gold=g.createLinearGradient(0,0,1200,675); gold.addColorStop(0,"#fff1b0"); gold.addColorStop(0.5,"#d9a43a"); gold.addColorStop(1,"#fff1b0");
    g.strokeStyle=gold; g.lineWidth=14; g.beginPath(); g.roundRect(24,24,1152,627,36); g.stroke();
    g.lineWidth=3; g.beginPath(); g.roundRect(44,44,1112,587,26); g.stroke();
    snap(80,95,480,480,20); g.strokeStyle=gold; g.lineWidth=6; g.beginPath(); g.roundRect(80,95,480,480,20); g.stroke();
    txt("GRAVITY POP",620,120,`900 30px ${F}`,"#d9a43a"); 
    txt(cardTitle(),620,190,`900 58px ${F}`,"#fff1b0","left",8,"rgba(0,0,0,.5)");
    txt("SCORE",620,255,`800 24px ${F}`,"#b9a8e8"); txt(String(score),620,335,`900 80px ${F}`,"#fff");
    const stars=Math.min(5,1+Math.floor(Math.log10(Math.max(10,score))-2)); txt("★".repeat(stars)+"☆".repeat(5-stars),1130,255,`900 40px ${F}`,"#ffcf5a","right");
    cardRecs(5).forEach(([k,l,u],i)=>{ const y=395+i*44; txt(l,620,y,`700 26px ${F}`,"#b9a8e8"); txt(`${rec[k]}${u}`+(isNew(k)?" NEW":""),1130,y,`800 26px ${F}`,"#fff","right"); });
    txt("#グラビティポップ",620,615,`700 20px ${F}`,"#8f80c0");
    puni(1080,130,46,6);
  }
  return c;
}
function gameOver(){
  if(worldDone) return;
  over=true; piece=null;
  // ゲームオーバーの演出: 出口から近い順に灰色になって、そのあと下へこぼれ落ちる
  const now=performance.now(), c=N/2;
  for(const o of balls){ o.ovDelay=Math.hypot(o.x-c,o.y-c)*70+Math.random()*60; o.ovGrey=false; o.fvy=null; }
  overFx={t:now}; shake=10; sfx("over");
  try{ boardSnap=document.createElement("canvas"); boardSnap.width=cv.width; boardSnap.height=cv.height; boardSnap.getContext("2d").drawImage(cv,0,0); }catch(e){ boardSnap=null; }
  rec.stage=level; rec.maxChain=Math.max(rec.maxChain,maxChain);
  saveRecords();
  lastCoins=coinsForGame(); coins+=lastCoins; saveShop();
  setTimeout(()=>{ if(over) showMenu("over"); },2600);
}
// 記録を残す（ベストスコアと到達ステージはエンドレスだけ）
function saveRecords(){
  lastNew=[];
  if(mode==="endless" && score>best){ if(best>0) lastNew.push("score"); best=score; store.set("bestFree",best); }
  for(const [k] of REC_DEFS){ if(k==="stage" && mode!=="endless") continue; if(rec[k]>(bestRec[k]||0)){ if(bestRec[k]) lastNew.push(k); bestRec[k]=rec[k]; } }
  store.set("bestRecFree",bestRec);
}
// ワールドクリア: ボスを倒したら、少し余韻を見せてからコインの画面へ
let clearBonus=0, clearDoubled=false;
let clearUnlock=null, clearBossN=1;       // このクリアで使えるようになったアイテム / 倒したボスの番号
// クリア画面の絵: やられてしょんぼりしたボス（つぶれて、目を回して、涙。王冠は転がり、白旗をあげている）と紙ふぶき
function drawBossDown(cv){
  const W=cv.width=640, H=cv.height=250, g=cv.getContext("2d"), t0=performance.now(), th=THEMES[worldTheme%THEMES.length]||THEMES[0];
  const conf=Array.from({length:46},(_,i)=>({x:Math.random()*W, y:Math.random()*H, v:30+Math.random()*50, a:Math.random()*6.28, c:["#ff5c8d","#ffc21f","#5ad1ff","#8fe04a","#c9a0ff","#fff"][i%6], w:6+Math.random()*7}));
  const loop=()=>{
    if(!cv.isConnected) return; introAnim=requestAnimationFrame(loop);
    const now=performance.now(), t=(now-t0)/1000; g.clearRect(0,0,W,H);
    const sky=g.createLinearGradient(0,0,0,H); sky.addColorStop(0,"#bfe9ff"); sky.addColorStop(1,"#fff7c9"); g.fillStyle=sky; g.fillRect(0,0,W,H);
    g.save(); g.translate(W/2,H*0.55); g.rotate(t*0.25); for(let i=0;i<12;i++){ g.rotate(Math.PI/6); g.fillStyle="rgba(255,255,255,.35)"; g.beginPath(); g.moveTo(0,0); g.lineTo(-38,-520); g.lineTo(38,-520); g.fill(); } g.restore();
    g.fillStyle="#9fdc7a"; g.beginPath(); g.ellipse(W/2,H+60,W*0.75,120,0,0,7); g.fill();
    const cx=W/2, r=84, cy=H-62-r*0.62+Math.sin(t*2.2)*2, INK="#2a1840";
    g.fillStyle="rgba(23,48,110,.2)"; g.beginPath(); g.ellipse(cx,H-50,r*1.25,13,0,0,7); g.fill();
    // 白旗（左手）
    g.save(); g.translate(cx-r*1.12,cy+r*0.2); g.rotate(-0.25+Math.sin(t*3)*0.08); g.strokeStyle="#8a5a2a"; g.lineWidth=6; g.lineCap="round"; g.beginPath(); g.moveTo(0,40); g.lineTo(0,-96); g.stroke();
    g.fillStyle="#fff"; g.strokeStyle="#17306e"; g.lineWidth=3; g.beginPath(); g.moveTo(0,-96); for(let i=0;i<=10;i++) g.lineTo(-i*7.2,-96+Math.sin(t*5+i*0.6)*4*(i/10)); for(let i=10;i>=0;i--) g.lineTo(-i*7.2,-52+Math.sin(t*5+i*0.6)*4*(i/10)); g.closePath(); g.fill(); g.stroke(); g.restore();
    // からだ（つぶれている）
    blob(g,cx,cy,r,4,1,{face:false,g:[0,1],w:0.3+0.02*Math.sin(t*2.2),t:now});
    const fy=cy+r*0.3;
    // ばんそうこう
    g.save(); g.translate(cx+r*0.5,fy-r*0.62); g.rotate(0.5); g.fillStyle="#ffe2c0"; g.strokeStyle=INK; g.lineWidth=2.5; for(const a of [0,Math.PI/2]){ g.save(); g.rotate(a); g.beginPath(); g.roundRect(-22,-7,44,14,6); g.fill(); g.stroke(); g.restore(); } g.restore();
    // ぐるぐるの目
    g.strokeStyle=INK; g.lineWidth=4; g.lineCap="round";
    for(const sx of [-1,1]){ g.beginPath(); for(let a=0;a<Math.PI*4.5;a+=0.25){ const rr=2+a*1.5, x=cx+sx*r*0.36+Math.cos(a*sx+t*4*sx)*rr, y=fy-r*0.12+Math.sin(a*sx+t*4*sx)*rr; a?g.lineTo(x,y):g.moveTo(x,y); } g.stroke(); }
    // 困りまゆ・ふにゃふにゃの口
    for(const sx of [-1,1]){ g.beginPath(); g.moveTo(cx+sx*r*0.16,fy-r*0.44); g.lineTo(cx+sx*r*0.52,fy-r*0.36); g.stroke(); }
    g.beginPath(); for(let i=0;i<=24;i++){ const x=cx-r*0.2+r*0.4*i/24, y=fy+r*0.28+Math.sin(i*0.9+t*6)*3.5; i?g.lineTo(x,y):g.moveTo(x,y); } g.stroke();
    // 涙（ぽろぽろ）
    for(const sx of [-1,1]) for(let i=0;i<3;i++){ const k=((t*0.9+i/3+(sx>0?0.17:0))%1), x=cx+sx*(r*0.62+k*26), y=fy-r*0.02+k*k*70; g.globalAlpha=1-k; g.fillStyle="#7fd4ff"; g.strokeStyle="#2a7fd0"; g.lineWidth=2; g.beginPath(); g.moveTo(x,y-9); g.quadraticCurveTo(x+8,y+3,x,y+7); g.quadraticCurveTo(x-8,y+3,x,y-9); g.fill(); g.stroke(); } g.globalAlpha=1;
    // 頭の上の星（くらくら）
    for(let i=0;i<3;i++){ const a=t*2.4+i*2.094, x=cx+Math.cos(a)*r*0.62, y=cy-r*0.72+Math.sin(a)*10; g.fillStyle="#ffc21f"; g.strokeStyle="#17306e"; g.lineWidth=2; g.beginPath(); for(let j=0;j<10;j++){ const rr=j%2?5:11, b=j*Math.PI/5-Math.PI/2; g.lineTo(x+Math.cos(b)*rr,y+Math.sin(b)*rr); } g.closePath(); g.fill(); g.stroke(); }
    // 転がった王冠（右の地面）
    g.save(); g.translate(cx+r*1.55,H-60); g.rotate(1.1+Math.sin(t*2)*0.05); g.fillStyle="#ffc21f"; g.strokeStyle="#17306e"; g.lineWidth=3; g.lineJoin="round";
    g.beginPath(); g.moveTo(-30,14); g.lineTo(-34,-24); g.lineTo(-15,-6); g.lineTo(0,-32); g.lineTo(15,-6); g.lineTo(34,-24); g.lineTo(30,14); g.closePath(); g.fill(); g.stroke(); g.fillStyle="#ff4d6d"; g.beginPath(); g.arc(0,2,5,0,7); g.fill(); g.restore();
    // 紙ふぶき
    for(const c of conf){ const y=(c.y+t*c.v)%(H+20)-10, x=c.x+Math.sin(t*2+c.a)*14; g.save(); g.translate(x,y); g.rotate(c.a+t*3); g.fillStyle=c.c; g.fillRect(-c.w/2,-c.w/4,c.w,c.w/2); g.restore(); }
  };
  loop();
}
function worldClear(){
  worldDone=true; piece=null; balls=balls.filter(o=>!o.live); stopLeft=0;
  setTimeout(()=>{
    if(!worldDone||!running) return;
    running=false; rec.stage=level; rec.maxChain=Math.max(rec.maxChain,maxChain); saveRecords();
    clearBonus=50+10*worldNo; lastCoins=coinsForGame()+clearBonus; clearDoubled=false;
    coins+=lastCoins;
    if(IAP_MH && iap.adFree){ coins+=lastCoins; clearDoubled=true; }       // 広告なし版は、動画なしでいつも2倍
    addLife(1);                                                // クリアしたらライフが1つ戻る
    clearUnlock=null; clearBossN=Math.max(1,Math.floor(level/BOSS_EVERY));
    if(worldNo===worldsCleared){ worldsCleared++; store.set("worldsCleared",worldsCleared); clearUnlock=Object.keys(ITEM_UNLOCK).find(k=>ITEM_UNLOCK[k]===worldsCleared)||null; }
    saveShop(); sfx("praise"); showMenu("clear");
  }, 2600);
}

// ===== 起動 =====
grav=0;
colorsN=5; balls=[]; nextPairs=[newPair(),newPair()]; particles=[];
running=false; paused=false; over=false;
applyOrientation(); updatePad(); setStatus(); drawNext(); showMenu("title");
if(dailyReady()) showMenu("daily");                             // その日はじめて開いたら、デイリーボーナスを見せる
requestAnimationFrame(frame);
